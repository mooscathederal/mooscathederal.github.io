const TEXTE = [{"titel": "Lächeln & Winken", "unter": "", "datum": "2026-07-03", "anzeige": "03.07.26", "form": "Prosa", "zeilen": false, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "", "titel": "", "zeilen": false, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Der Unauffällige zahlt nichts und hält das für Neutralität. Der andere zahlt laufend und bekommt für die Zahlung ein Kompliment: unkompliziert. Die Ordnung belohnt, wer sie trägt, dafür, dass er sie trägt. Deshalb sieht sie aus wie Freiwilligkeit."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wer nie erklären musste, warum er lebt, wie er lebt, hält die Erklärungslosigkeit für seinen Charakter. Sie ist die Eigenschaft seines Orts in der Rechnung. Zwei Fragen hängen daran: ob die eigene Beliebtheit je etwas anderes war als ein niedriger Preis. Und ob normal je etwas anderes gemeint hat als: kostet wenig."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Zwei, die gut zusammenarbeiten, stehen an einer Tür, es ist spät, einer sagt einen Satz zu viel, halb Scherz, halb nicht. Der andere hört ihn, das sieht man daran, dass er eine Sekunde zu lange nichts sagt. Dann greift er zur Klinke, mitten im Nachhall des Satzes, noch bevor der zu Ende gedacht ist, und die Bewegung der Hand beantwortet, was die Worte offen gelassen hätten. Genau da wird sichtbar, was hätte wegfallen müssen, damit man arbeitet gut zusammen all die Monate gestimmt hat."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Die Wärme des Satzes war echt, drei Sätze lang. Falsch wird sie erst hinterher, und niemand nimmt sie zurück, sie hält nur nicht. Wer die Hand zur Klinke bewegt, bevor der Satz fällig wird, bezahlt trotzdem, nur früher und allein, ohne dass je jemand sieht, wofür."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Man wird geliebt für das, was man zeigt, und fragt nie nach, ob es auch für das gilt, was man verschweigt. Die Anpassung liefert die Antwort gleich mit, bevor die Frage gestellt wird."]]}]}, {"t": "p",
