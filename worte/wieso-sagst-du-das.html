<script>
const SEITE = {"zurueck": "index.html", "letztes": {"titel": "Woher willst du das wissen?", "href": "woher-willst-du-das-wissen.html"}, "naechstes": {"titel": "Klugscheißen per excelsis", "href": "klugscheien-per-excelsis.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "Wieso sagst du das?", "unter": "Zwischen dem, was gesagt wird, und dem, was daraus wird.", "datum": "2026-03-18", "anzeige": "18.03.26", "form": "Prosa", "zeilen": true, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "", "titel": "", "zeilen": true, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "„Zwischen dem, was ich denke, was ich sagen will, was ich glaube zu sagen, was ich sage, was du hören willst, was du hörst und was du verstehst, liegen viele Möglichkeiten, sich zu missverstehen.“"]]}, {"f": 0, "r": [["n", "— Bernard Werber"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich ziehe mich im Sprechen zurück und passe mich an. Meist unauffällig. Man sagt etwas halb. Man lässt etwas stehen. Man nimmt die Form, die schnell trägt und wenig Nachgang verlangt. Das kann ein leiser Satz sein. Das kann ein harter Satz sein. Der Unterschied ist kleiner, als es aussieht. Beides kann dazu dienen, nicht ganz hineinzugehen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Gerade die knappen Sätze können da viel. Sie bringen etwas sofort in Form. Man sagt es, und für einen Moment steht es. Das kann gut sein. Es kann etwas klären, das vorher nur herumlag. Es kann aber auch zu früh fertig werden. Dann übernimmt der Satz. Er trägt nicht mehr, er schließt. Etwas wird erledigt, das noch gar nicht durch ist."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Mich interessiert daran, was er abkürzt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Manche Sätze tragen etwas. Andere stellen nur schneller Ruhe her. Von außen sehen sie oft ähnlich aus. Der Unterschied liegt nicht im Ton. Er liegt darin, ob die Sache im Satz bleibt oder unter seiner Form verschwindet."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Darum reicht die Frage nach Wahrheit nicht. Natürlich muss ein Satz stimmen. Aber fast nie geht es nur darum. Ein Satz ordnet etwas. Er drückt etwas weg. Er zieht etwas heran. Er verschiebt, wer jetzt sprechen muss und wer noch ausweichen kann. Er kann etwas öffnen. Er kann aber auch bloß dafür sorgen, dass das Unklare endlich aufhört zu stören."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Mit Schweigen ist es nicht anders. Schweigen ist nicht reif, nur weil nichts gesagt wird. Manchmal ist es richtig. Manchmal ist es nur die stillere Art, den offenen Satz nicht tragen zu müssen. Nach außen sieht das oft friedlicher aus. In der Sache wird nichts friedlich. Sie läuft nur ohne Sprache weiter. Oft schlechter, weil niemand sie festhalten muss."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vieles nimmt sich vernünftig aus und ist trotzdem nur eine Form, nicht wirklich dableiben zu müssen. Das Schweigen nennt sich Rücksicht. Der harte Satz nennt sich Ehrlichkeit. Die vorsichtige Form nennt sich Genauigkeit. Alles kann stimmen. Nichts davon ist deshalb schon sauber."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich misstraue nicht der Härte. Ich misstraue der Härte, die so tut, als sei mit ihr schon alles gesagt. Es gibt Sätze, die müssen knapp sein, sonst werden sie weichgeredet. Es gibt andere, die klingen entschiedener, als der Gedanke es hergibt. Dann macht der Ton etwas, was der Satz selbst nicht leistet. Einfach weil Härte Dinge schneller fest aussehen lässt, als sie sind."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Mit Vorsicht ist es nicht besser. Nicht jede Differenzierung ist Redlichkeit. Man kann sich in Vorbehalten ebenso einrichten wie in fertigen Formeln. Das eine schiebt auf. Das andere macht zu. Beides kann helfen, den eigentlichen Einsatz nicht leisten zu müssen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Der Unterschied liegt für mich nicht zwischen hart und weich, knapp und lang, offen und entschieden. Er liegt zwischen Sätzen, die etwas wirklich austragen, und Sätzen, die es bloß vorzeitig ordnen. Viele Probleme entstehen nicht aus der offenen Lüge. Sie entstehen, weil etwas zu schnell ruhiggestellt wird."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht wird die Neigung zum Spruch, zur Formel, zum Aphorismus irgendwann falsch. Nicht weil Verdichtung schlecht wäre. Ohne Verdichtung bleibt vieles matt. Aber der kurze Satz hat seine eigene Versuchung. Er bringt etwas in eine Form, bevor klar ist, ob diese Form es schon halten kann. Er macht etwas handhabbar, das vielleicht noch gar nicht handhabbar ist. Und genau das fühlt sich oft erst einmal gut an."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Zwischen Menschen wird das sofort ernst. Da bleibt kein Satz einfach Satz. Er verändert den Raum. Er verschiebt, wer sich zeigen muss. Er kann etwas klären oder ein Gefälle herstellen. Er kann den anderen hineinholen oder hinstellen. Das heißt nicht, dass man nur noch vorsichtig reden sollte. Das wäre wieder nur eine andere Art, sich nicht festlegen zu müssen. Aber es heißt, dass die bloße Stärke eines Satzes nichts entscheidet."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich will darum weder im Schweigen verschwinden noch mich in Formeln retten. Beides ist möglich. Beides funktioniert oft erstaunlich gut. Gerade deshalb taugt es nicht als Maß."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ein Satz muss stehen können, ohne sich auf seine Form zu verlassen. Er darf nicht nur abkürzen. Er soll etwas offenlegen, ohne alles andere sofort stillzustellen. Und er sollte nicht so auftreten, als sei jede Gegenrede schon bloß Ausweichen oder mangelnder Mut. Sobald ein Satz das nötig hat, stimmt meist schon etwas nicht, auch wenn er etwas Richtiges berührt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich brauche keine Sprache der Schonung. Ich brauche auch keine Sprache der Kälte. Beides überzeugt mich nicht. Ich brauche Sätze, die nicht gleich wieder verschwinden, sobald sie gesprochen sind. Sätze, die nicht nur treffen, sondern bleiben. Nicht als Pose. Nicht als kleine Herrschaft. Einfach so, dass sie etwas klären, ohne sich durch Härte, Kürze oder Aufschub künstlich zu verstärken."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nicht möglichst viel mit wenig Sprache erledigen. Nicht sich durch Schweigen sauber halten. Sondern so sprechen, dass die Sache nicht hinter der Form verschwindet. Dass ein Satz stehen kann, ohne sich aufzublasen. Und offen bleiben kann, ohne sich zu entziehen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Mehr brauche ich dazu nicht. Ein Satz, der etwas klärt und nicht sofort alles stilllegt, ist schon viel. Man hört ihn anders. Man kann ihm antworten."]]}]}], "vermerk": ""}]}];
