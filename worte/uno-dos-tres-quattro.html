<script>
const SEITE = {"zurueck": "index.html", "letztes": null, "naechstes": {"titel": "Über Nebel und Ordnung", "href": "uber-nebel-und-ordnung.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "Uno · Dos · Tres · Quattro", "unter": "", "datum": "2026-03-03", "anzeige": "08.–09.02.26", "form": "Prosa", "zeilen": true, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "Uno", "titel": "Preußischer Obrigkeitsgehorsam als Persönlichkeit", "zeilen": true, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Da ist ein Knoten, den ich seit Jahren mit mir rumtrage. Ich versuche, ihn zu lösen. Oder wenigstens etwas aufzulockern oder anzuschauen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich hab lange geglaubt, mein Wert hängt daran, wie gut ich funktioniere. Wie zuverlässig, wie schnell, wie unkompliziert. Ich sag das, als wäre es eine klare Überzeugung gewesen. War’s nicht. Es war ein Grundgefühl, ein Standardmodus."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich kann nicht mal genau sagen, wann das angefangen hat. Vielleicht da, wo ich gemerkt hab, dass Stimmung kippen kann. Ohne Ansage. Dass Nähe manchmal Bedingungen hat, auch wenn niemand das so sagt. Und dann macht man sich eben passend. Nicht bewusst, einfach automatisch."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Irgendwann wird das innere Abtasten dann so normal, dass man es gar nicht mehr merkt. Wie viel ist gerade okay? Wie viel von mir ist hier eigentlich noch zumutbar? (Allein das Wort „zumutbar“.) Wie viel darf ich zeigen, ohne dass es anstrengend wirkt, ohne dass jemand genervt ist, still wird, oder weggeht? Ich rutsche da schnell in „man“, weil „ich“ zu nah ist. Aber eigentlich meine ich mich."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Lob ist da wie kleine Markierungen auf einer Karte. „Verlässlich.“ „So gut, dass du da bist.“ „Auf dich kann man zählen.“ Und ich mochte das. Das tu ich vielleicht auch immer noch. Natürlich mag ich das. Nur meint es nicht unbedingt mich. Oder nur die funktionierende Version davon."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und die kann ich ziemlich gut. Schnell antworten, Dinge halten, Stimmung lesen, glatt bleiben, „easy“ sein. Wenn innen was drückt, wird es auf später verschoben. Irgendwann. Jetzt wäre es unpraktisch. Oder könnte es stören."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das Gemeine ist, es klappt ja auch. Zum Teil. Man kriegt Vertrauen, Aufgaben, vielleicht sogar Anerkennung. Und dann fühlt sich das fast wie der Beweis an, dass das System richtig ist."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nur kann dieses System einen auch leer machen. Dann kommt es in komischen Momenten raus. Als Spannung im Nacken, als Gereiztheit, dieses „ich kann nicht mehr“, das eigentlich nicht zur Lage passt. Oder als Gefühl am Abend, wenn alles ruhig ist und ich plötzlich nicht so richtig weiß, was ich mit mir anfangen soll."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Weil ich mir selbst nur noch über Aufgaben begegne. Wenn nichts ansteht, ist da eine Stille, die nicht beruhigt. Sie ist nur unklar."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann gibt es manchmal noch winzige Momente, wo ich kurz Luft hole. Und damit Fragen. Was brauche ich eigentlich, um da zu bleiben? Wie komm ich irgendwo an? Und innerlich nicht wegzurutschen?"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich will nicht fordern. Oder jedenfalls nicht, dass es allein davon abhängt. Ich mein eher ein Zurückkommen. Ein „Hören, was da ist“ … ohne es sofort in zwei Seiten zu teilen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und vielleicht ist das schon viel. Sich nicht nur ernst nehmen, wenn man praktisch ist. Sich erlauben, menschlich zu sein, auch wenn das nicht elegant aussieht."]]}]}], "vermerk": ""}, {"name": "Dos", "titel": "Beziehungen ohne Nähe", "zeilen": true, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Ich hab das Gefühl, viele Beziehungen gehen nicht kaputt, sondern werden einfach leiser. Und ich merk, wie ich das schreibe, und es klingt wie ein schöner Satz. Aber ich meine das ziemlich konkret. Das „Leiserwerden im Alltag“, ohne Drama, ohne „wir müssen reden“, so schleichend, dass man es auch übersehen kann."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nicht weil nichts mehr da ist. Es is das, was nicht gut ankommt. Was den anderen stresst oder von dem ich ausgehe, dass es „zu viel“ sein könnte. Was ihn dicht macht, was ihn kalt werden lässt. Dann wird man vorsichtig. Erst aus Liebe, glaube ich. Oder nicht. Großes Wort! Vielleicht aus dem Wunsch, es gut zu machen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vorsicht ist ja nicht falsch. Nur wird sie schnell zum System. Und dann zum stillen Regelwerk, das niemand offiziell beschlossen hat."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Der Moment vor der Reaktion. Bevor ich etwas anspreche, gibt es ein innerliches Tasten. Eine Revision. Ich mache Sätze weicher, bevor sie überhaupt raus sind. Und ich denke die Stimmung mit, als wäre das meine Aufgabe."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann kommt die Landkarte im Kopf und Körper. Hier ja, dort lieber nicht. Hier irgendwann, da vielleicht lieber nie. Das ist kein Plan. Vielleicht nicht mal Entscheidung. Nur Gewohnheit. Irgendwann merk ich gar nicht mehr, dass ich verhandle. Es fühlt sich ja an wie Rücksicht, wie Reife. Oder ein „ich will keinen Streit“."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich bring das nicht, weil du heute so müde bist. Ich schluck etwas runter, weil es sonst wieder zu kompliziert wird. Ich sag das anders, damit du nicht gleich dicht machst. Und irgendwann, das ist das Bittere, mach ich mich ein bisschen leichter, damit der andere bleibt. Ohne dass man es so nennt. Nennen kann."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich schreibe das und denke: klingt das zu hart? Aber ich kenne das. Ich umgehe mich selbst, um eine Beziehung nicht zu gefährden. Dann wird nicht nur ein Konflikt kleiner, sondern auch ich."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und Nähe. Ich glaube, Nähe hat weniger mit Harmonie zu tun, als ich vielleicht gerne hätte. Näher ist es, wenn ich etwas Unfertiges sagen kann und der andere geht nicht sofort auf Abstand. Nähe ist, wenn ich spüre, ich bin nicht nur okay, wenn ich angenehm bin."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wenn das fehlt, wird Beziehung funktional. Man kann super zusammen Alltag machen. Ist freundlich und liebevoll und lacht sogar. Und trotzdem bleibt etwas unberührt, wie ein Zimmer, das man nicht mehr betritt. Verboten ist es nicht. Nur zu kalt, zu leer, und man hat sich dran gewöhnt, daran vorbeizulaufen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann wird es ruhig. Eine vorsichtige Ruhe. Ich hab gelernt, weniger stören zu können. Mit der guten Ruhe nach einem ehrlichen Gespräch hat das wenig zu tun."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Manchmal ist die Liebe noch da, und es fehlt das kleine Risiko, das Nähe eigentlich braucht. Sich ungeschützt zeigen. Einfach sagen: So ist es gerade."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nicht jede Beziehung hält das aus. Manche Dinge bleiben nur stabil, solange alles glatt bleibt. Aber wenn etwas lebendig bleiben soll, muss irgendwann jemand aufhören, sich ständig zu optimieren. Hoffe ich jedenfalls."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht kommt dann wieder Luft rein, wenn man wirklich da ist. Als Person und nicht als Produkt von Umständen."]]}]}], "vermerk": ""}, {"name": "Tres", "titel": "Verantwortung aber bitte ohne Risiko.", "zeilen": true, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Ich hab ein ambivalentes Verhältnis zum Wort „Verantwortung“. Es klingt so schnell groß und moralisch. Dabei erleb ich es oft klein, lästig und unschön. Und trotzdem wichtig."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Verantwortung ist selten ein Moment, eher eine Dauer. Nichts, was ich einmal mache, und dann ist es erledigt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich glaube, viele fürchten Verantwortung. Nicht nur, weil sie schwer ist. Sie nagelt einen fest. Ich kann dann nicht mehr so tun, als wäre alles „gerade schwierig“. Man hinterlässt eine Spur, und die bleibt stehen. Elegant und rückwärts raus is dann nich mehr."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich kenne dieses doppelte Ding. Man sieht, dass etwas nicht passt, und spürt den eigenen Anteil. Und hofft trotzdem, es möge sich irgendwie selbst lösen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Weniger Kälte als ein Reflex, sich selbst zu schützen. Verantwortung hat Nebenwirkungen. Man wirkt weniger souverän, muss etwas zugeben und etwas Unangenehmes aushalten."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Also verpackt man sie in Meinungen und ins richtige Vokabular. Oder in Aktivitätsschübe."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Man kann sehr viel tun und trotzdem nicht da sein. Und man kann sehr still sein und trotzdem bleiben. (Ich hoffe, das ist verständlich. Ich meine: Präsenz ist nicht abhängig von Intensität.) Aka: Man muss nicht viel sagen, um viel zu bedeuten."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Für mich heißt das, nicht zu warten, bis es sich richtig anfühlt. Auch nicht, bis ich endlich so klar bin, dass nichts mehr wackelt. Handeln, während es noch wackelt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das sind oft kleine Sachen, die nicht heroisch aussehen. Nicht ausweichen. Widersprechen, obwohl die Stimme zittert. Sich entschuldigen, ohne gleich „aber du auch“ hinten dranzuhängen. „Ich war’s.“ Punkt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das stört das eigene Bild von mir. Das is der Sinn daran, weniger ausweichend zu werden und nicht besser im Sinne von glänzen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wenn ich die tres Teile zusammenhalte, geht’s vielleicht immer um dasselbe. Nicht verschwinden. Nicht alles tragen, aber das Eigene nicht liegen lassen. Nicht alles im Griff haben, aber dranbleiben bei dem, was heute wirklich ansteht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht ist das genug. Als Richtung, die man leise nimmt, ohne genau zu wissen, wie schnell man ankommt."]]}]}], "vermerk": ""}, {"name": "Quattro", "titel": "Hold your Head up.", "zeilen": true, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Beim Schreiben merk ich, wie ich sofort nach dem nächsten Punkt suche. Als müsste das hier wieder ordentlich werden, mit Linie und Ergebnis. Wahrscheinlich ist genau das schon wieder der Trick."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich bin so auf Effizienz und Funktion getrimmt, dass sogar mein Innenleben sich wie Arbeit anfühlt. Sortieren, formulieren, abhaken. Damit es nicht zu viel wird. Nicht aus dem Ruder läuft. Damit es irgendwie passt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es gibt Zeiten, die sich nicht abhaken lassen. Das is nicht dramatisch. Vor allem leer. Zwischen zwei Tagen und zwei Dingen, wo nichts passiert. Nix von außen zieht. Wenn niemand etwas braucht und nichts ansteht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Was bleibt, is ein Gefühl."]]}, {"f": 0, "r": [["n", "Ich weiß nicht genau, wer ich bin, wenn ich nicht gebraucht werde."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht is das zu hart. Ich mein es aber nüchtern. Is halt so einfach. Leider. Denk ich. Ne. Glaub ich."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann mach ich, was greifbar scheint. Ich werde aktiv und such mir was. Sinn, Struktur, Beschäftigung. Hauptsache nicht zu lange still, nicht zu lange nur da. Zum Beispiel selbstoffenbarende Texte schreiben, um nicht für die Prüfung aus Persönlichkeitspsychologie zu lernen. Viva die Prokrastination."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es is Angst, die verlernt hat zu sprechen. Oder es zu versuchen. Ich weiß nicht. Weniger das Scheitern als das Aufhören zu leisten. Dann bleibt nichts, woran ich mich festhalten kann."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann kommt der nächste Reflex hinterher. Ich trimm mich selbst und nenne es vernünftig. Ein „Jetzt übertreibst du mal nicht“. Und seine Gegenbewegung: „Jetzt klingt’s dramatisch, mach es kleiner, bevor es peinlich wird“."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Der Mechanismus: Sobald etwas weich wird, mache ich es wieder hart. Sobald etwas ehrlich wird, packe ich es wieder ein. Ehrlich sieht selten gut aus, und gut aussehen fühlt sich sicherer an."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich glaube, ich habe lange gedacht, ich muss mich im Griff haben, damit ich okay bin. Und ein älterer Teil von mir tut das weiterhin. Nicht auffallen, nicht stören, vor allem: „Nicht zu viel sein!“"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dabei passiert Nähe vielleicht genau woanders. Dort, wo es nicht sitzt und trotzdem jemand dableibt. Oder ich. Und ich halte das aus. Wenigstens für eine Weile."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und ich merke, wie oft ich mich selbst übergehe. Es is kein Selbsthass. Ich stelle mich einfach automatisch hintenan, ganz routiniert. Wie Hunger ignorieren oder Müdigkeit wegdrücken. Oder einen Gedanken abwürgen, weil er gerade nicht passt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Irgendwann merk ich das nicht mal mehr. Außerdem nenn ich es Reife, Stärke. Manchmal stimmt das auch. Manchmal ist es auch eine Flucht in Kompetenz. Kompetenz ist sicherer. Da kann ich was und kriege Rückmeldung. Da bin ich nicht mehr hilflos."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Gefühl ist anders. Da gibt’s kein Lob und keine Struktur. Da ist nur etwas, das da ist und nicht unbedingt angenehm und auch nicht produktiv. Nicht alles sollte gelöst werden, um echt zu sein. Hoffe ich."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich versuch, negative Gefühle in etwas Brauchbares zu verwandeln. Aus Traurigkeit Tiefe, Angst in Wachsamkeit, Wut in Disziplin, Einsamkeit in Unabhängigkeit. Möglicherweise glaube ich, ich dürfte nur etwas fühlen, wenn am Ende dabei was rauskommt. Etwas, das vorzeigbar is. Und ich mir selbst erklären darf. Und kann."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das ist der innere Deal. Niemand hat ihn verlangt, und ich halte ihn trotzdem ein."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich denk, hier könnte Quattro sein: den Deal zu sehen, wenn er wieder anfängt. Den Impuls, in falscher Sehnsucht:"]]}, {"f": 0, "r": [["n", "Beweis dich."]]}, {"f": 0, "r": [["n", "Mach dich besser."]]}, {"f": 0, "r": [["n", "Mach dich leichter."]]}, {"f": 0, "r": [["n", "Mach dich wertvoller."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Daneben liegt noch ein anderer Satz. Leise und nicht besonders überzeugend. Aber eher näher dran."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht muss ich nicht glänzen, um da zu sein."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann der Protest in mir. Mit mir. Gegen mich. Für mich. Ein Teil in mir, weil er noch denkt: Wenn ich nicht glänze, wer bleibt dann? Das is wahrscheinlich die bessere Frage. Das is vielleicht die bessere und eigentliche Frage. Nicht, wie ich weiterkomme. Wer oder was bleibt, wenn ich aufhöre, mich zu polieren? Kann ich mit mir sitzen, wenn nichts passiert? Kann ich mich ernst nehmen, ohne gerade nützlich zu sein? Kann ich bei mir bleiben, ohne mir gleich eine Aufgabe draus zu machen?"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Konkret heißt das für mich: Nicht sofort antworten. Nicht sofort erklären. Nicht sofort versuchen, alles einzuordnen. Und nicht sofort lachen, wenn es eigentlich wehtut."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Manchmal reicht ein Atemzug, bevor ich wieder funktioniere. Unspektakulär! Und vielleicht reicht das erstmal, für den Anfang, als Richtung, nicht als Lösung."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nicht: Ich werde jetzt anders."]]}, {"f": 0, "r": [["n", "Sondern: Ich bin nicht sofort weg."]]}]}], "vermerk": ""}]}];
