const SEITE = {"zurueck": "index.html", "letztes": {"titel": "4KB bis zum Mond", "href": "4kb-bis-zum-mond.html"}, "naechstes": {"titel": "warum ich nicht wegsehen kann.", "href": "warum-ich-nicht-wegsehen-kann.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "Popo-lismus", "unter": "Wie politische Entlastung zu Haltung wird", "datum": "2026-03-29", "anzeige": "29.03.26", "form": "Prosa", "zeilen": true, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "10.26", "titel": "", "zeilen": true, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Dortmund Hauptbahnhof. Dienstagabend im Februar. Gleis 12, glaube ich. Oder 2. Ich weis nicht mehr. Es ist Kalt. Neben mir zwei Männer, Ende vierzig vielleicht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Einer der beiden schaut auf sein Handy und sagt, ohne aufzusehen:"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "„Man wird ja wohl noch sagen dürfen.\""]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Der andere nickt. Nicht zornig. Als wäre etwas abgefallen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Mich hat nicht der Satz getroffen. Es war das Nachlassen im Gesicht getroffen. Für einen Moment war weniger zu tragen. Keine große Befreiung, nur gerade genug, um zu merken was solche Formeln können. Sie nehmen etwas ab, und zwar innerlich, bevor sie inhaltlich irgendwas behaupten. Man muss nicht noch einmal prüfen. Nicht noch einmal sortieren."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Politik wirkt oft, bevor sie überzeugt. In dem Moment, in dem ein Satz schon Erleichterung mitbringt, ist die eigentliche Arbeit meistens schon getan. Nicht die inhaltliche. Die andere."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich kenne diese Bewegung auch aus mir selbst. Weniger an dem Satz. Als Form. Endlich kein weiterer Aufwand."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Rechts tritt diese Entlastung im Moment gröber auf, mehr Grenze, mehr Schluss. Links ist sie oft besser verkleidet, moralischer oder verfahrensnäher. Nichtdestotrotz. Auch dort gibt es Sätze, die zu früh beruhigen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Mich interessiert weniger die Ideologie als der Vorgang selbst. Ein Wort fällt, die Last des Offenen sinkt. Wenn Müdigkeit sich wie Einsicht tarnt. Oder wenn ich gar nicht die beste Antwort will, nur dass etwas aufhört."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Frieden, Ordnung, Demokratie, Nachhaltigkeit, Verantwortung. Wörte so nicht verdächtig sind.Sie sind nötig. Man kommt ohne sie nicht aus. Gerade deshalb muss man ihnen misstrauen, sobald sie zu früh Ruhe herstellen. Wenn sie statt nur zu benennen, schon das Gefühl liefern, dass jetzt jemand übernimmt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das Handy arbeitet daran scheinbar besser mit als jeder Redner. Solingen, 2024. Ein Anschlag, ein Land, das eine Woche lang über nichts anderes redet. Danach kam beides gleichzeitig: die eine Seite, die das Ereignis sofort in ihre bestehende Erzählung einsortierte, und die andere, die genau davor warnte und dabei selbst schon wusste, wie ihre Warnung klingen würde. Es schien sich alles darum zu drehen. Ich hab jedenfalls die nächste Tage fast nix anderes gesehn. Und das nicht weil ich es gesucht hätte."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es brauch dafür keine Lügen. Es reicht die richtige Mischung aus Auswahl und Wiederholung. Das Material echt genug, um zu fühlen. Oft reicht es schon lange genug in eine Richtung zu zeigen. Niemand muss etwas erfinden."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Niemand muss mich persönlich hassen. Die Logik funktioniert. Das reicht so lang wie es soll.  Aus Neigung wird Muster, und das Muster zu einem Reflex. Grenzen verschwimmen. Und damit meine Fähigkeit zu sagen ob mein Urteil aus Prüfung oder Wiedererkennung kommt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "„Die da oben.\" „Das System.\" „die Woken.\"„die Medien“ oder „das Patriarchat“. Bündeln, ordnen und Richtung geben. Die Erklärung steckt bereits in der Benennung. „Die Verhältnisse\" schiebt die Haftung am weitesten weg, das ist der Unterschied zu „die Rechten\", das noch relativ nah an einem realen Gegenüber bleibt. Je größer das Ganze wird, in das ich etwas einsortiere, desto weniger muss ich auf meinen eigenen Anteil schauen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich rede über Gewalt und ändere meinen Ton nicht. Ich rede über Ausgrenzung und bleibe im Kleinen feige."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Die Zeit arbeitet im stillen mit. Kein Bruch fühlt sich an wie Bruch. Eine Formulierung, die vor fünf Jahren kalt geklungen hätte, wirkt heute bloß direkt. Das heißt dann Nüchternheit. Manchmal ist es nur Gewöhnung. Ich weis meist selbst nicht was der Fall ist. Und ich habe auch keine verlässliche Methode gefunden, das im Moment zu unterscheiden. Für den Moment. Vielleicht geht das auch erst im Rückblick, und dann ist es zu spät, um noch etwas daran zu ändern. Und vielleicht is das nur der Reflex der unruhe eine ort zu geben."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Irgendwann trägt die schöne Ausgewogenheit selbst nicht mehr. Links is dabei nicht harmlos.  Rechtsruck versteht es gerade schneller in Dinge zu übersetzt, die andere wirklich treffen. Der Ausschluss, die Erniedrigung oder Verfahren an stelle des Ton. Ich Behauptung das. Das ist keine Beobachtung, und sie kostet etwas, wenn sie falsch ist. Ich mache sie trotzdem."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Entlarvung kann auch bequem werden. Jede Seite hält sich gerne für die letzte ehrliche. Sie glauben, die Pose der anderen durchschaut zu haben. Entlarvung erspart oft mehr Arbeit als ein wirklicher Wahrheitsversuch. Dann wenn der Ekel vor Pose größer wird als die Aufmerksamkeit für tatsächlichen Schaden, macht man Härte wieder anständig."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich weiß nicht, wie man diese zwei Sätze gleichzeitig ernst nimmt, ohne dass einer den anderen am Ende doch entschärft. Ich habe darauf keine Antwort, die mir nicht selbst wie eine kleine Beruhigung vorkäme."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Der Bahnhof. Eine Flasche, die bei jedem Zug droht umzufallen und zu zerbrechen. Der Satz fällt. Der andere nickt. Und für einen Moment wird etwas leichter."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Die Flasche liegt denke ich immer noch da. Irgendjemand wird sie schon wegräumen."]]}]}], "vermerk": ""}, {"name": "03.26", "titel": "", "zeilen": true, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Am Bahnhof wurde es für einen Moment sichtbar."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Später Nachmittag. Metall in der Luft. Ein Automat piept. Die Türen gehen zu schnell zu. Zwei Männer stehen neben mir. Einer schaut auf sein Handy und sagt, ohne aufzusehen:"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "„Man wird ja wohl noch sagen dürfen.“"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Der andere nickt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nicht zornig."]]}, {"f": 0, "r": [["n", "Nicht besonders entschieden."]]}, {"f": 0, "r": [["n", "Eher so, als wäre kurz etwas abgefallen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Mich traf nicht zuerst der Satz. Mich traf dieses kleine Nachlassen im Gesicht. Für einen Augenblick war weniger zu tragen. Nicht viel. Keine große Befreiung. Nur gerade genug, dass man merkt, was solche Formeln können. Sie nehmen etwas ab. Nicht nur inhaltlich. Vor allem innerlich. Man muss nicht noch einmal neu prüfen, nicht noch einmal sortieren, nicht noch einmal mit sich selbst in diese unangenehme offene Lage zurück."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Politik wirkt oft schon, bevor sie überzeugt. Dann, wenn ein Satz etwas leichter macht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nicht erst bei dem, was sie behaupten. Früher. In dem Moment, in dem ein Satz schon Erleichterung mitbringt. Dann fällt nicht nur ein Urteil. Es verschiebt sich auch etwas in der Last. Wer noch weiterdenken muss. Wer sich schon bestätigt fühlen darf. Wer das Komplizierte jetzt gerade nicht mehr allein halten muss."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "So ein Satz sagt nicht nur etwas. Er entscheidet oft schon mit, wer weiter mit dem Offenen Sitzen bleibt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das ist kein rechter Spezialeffekt. Ich kenne die Bewegung auch aus mir selbst. Nicht an genau diesem Satz. Aber als Form. Endlich kein weiterer Aufwand. Endlich keine neue Zumutung. Endlich eine Formulierung, die so klingt, als wäre die Sache im Grunde schon entschieden."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Darum liegt das Problem nicht nur auf einer Seite. Rechts tritt diese Entlastung im Moment oft gröber auf. Mehr Grenze, mehr Schluss, mehr dieses erleichterte Einrasten in Klarheit. Links ist sie häufiger besser verkleidet. Moralischer, sprachbewusster, verfahrensnäher. Aber auch dort gibt es Sätze, die zu früh beruhigen. Sätze, in denen man mit dem richtigen Vokabular schon fast auf der richtigen Seite steht, bevor der Gegenstand wirklich offen daliegt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Mich interessiert daran weniger die Ideologie als der Vorgang."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ein Wort fällt. Und plötzlich sinkt die Last des Offenen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Man merkt das nicht zuerst im Kopf. Eher im Körper. Wenn etwas nach Ende klingt, obwohl nichts zu Ende ist. Wenn Müdigkeit sich wie Einsicht tarnt. Wenn ich gar nicht die beste Antwort will, sondern nur, dass etwas aufhört. Dann wird Sprache operativ. Schutz trägt"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "schon Ausschluss mit. Verantwortung kann in Kontrolle kippen. Ehrlichkeit kann so gesprochen werden, dass Verachtung mitläuft und sich trotzdem sauber anfühlt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wörter wie Sicherheit, Ordnung, Freiheit, Gerechtigkeit sind deshalb nie einfach gut und nie einfach verdächtig. Sie sind nötig. Man kommt ohne sie nicht aus. Gerade deshalb muss man ihnen misstrauen, sobald sie zu früh Ruhe herstellen. Sobald sie nicht nur benennen, was fehlt oder gebraucht wird, sondern schon das Gefühl liefern, dass jetzt etwas übernommen wird. Gib mir kurz die Last. Ich mache das."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Darin liegt ein Teil ihres Reizes."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nicht in erster Linie im Inhalt. Sondern darin, dass sie das Schwanken verkürzen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Auch das Handy arbeitet daran mit. Vielleicht sogar besser als jeder Redner."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ein Video. Ein Kommentar. Noch eins. Jemand schreibt: „Seht ihr. Genau das.“ Dann weiter. Ein Messer in einer Überschrift. Ein Gesicht in Nahaufnahme. Ein Ausschnitt, der gerade lang genug ist, um etwas zu beweisen. Später auf der anderen Seite ein Chatverlauf, ein Satz ohne Vorgeschichte, eine Entschuldigung, die schon im Moment ihres Auftauchens wieder zu wenig ist. Ich bleibe einen Tick länger bei dem, was mich trifft. Das System merkt es. Danach kommt mehr davon."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dafür braucht es nicht einmal eine Lüge."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es reicht Auswahl. Gewichtung. Wiederholung. Das Material kann echt sein. Gerade das macht es so wirksam. Man muss nichts erfinden. Man muss nur so lange in dieselbe Richtung zeigen, bis der nächste Gedanke sich anfühlt, wie der eigene, obwohl die Wiederholung längst mitgebaut hat."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das Trostlose daran ist schlicht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Niemand muss mich persönlich hassen. Es reicht, dass diese Logik funktioniert."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Aus einer Neigung wird ein Muster. Aus einem Muster ein Reflex. Irgendwann merke ich nicht mehr, was an meinem Urteil aus Prüfung kommt und was nur aus Wiedererkennung. Dann hat der Satz seinen eigentlichen Dienst schon getan. Er hat mir die Arbeit nicht ganz erspart. Aber so weit reduziert, dass ich den Rest mit Überzeugung selbst erledige."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht ist das eine gegenwärtige Form politischer Selbstentlastung. Nicht Urteilslosigkeit. Eher das Gegenteil. Ein Urteil, das sich so anfühlt, als hätte es keine Kosten."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "„Die da oben.“"]]}, {"f": 0, "r": [["n", "„Das System.“"]]}, {"f": 0, "r": [["n", "„Die Medien.“"]]}, {"f": 0, "r": [["n", "„Die Woken.“"]]}, {"f": 0, "r": [["n", "„Die Rechten.“"]]}, {"f": 0, "r": [["n", "„Der Westen.“"]]}, {"f": 0, "r": [["n", "„Die Verhältnisse.“"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Fast jedes dieser Wörter kann etwas Reales treffen. Genau deshalb funktionieren sie. Sie bündeln. Sie ordnen. Sie geben Richtung. Und sie machen es leicht, die Haftung nach außen"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "zu schieben. Je größer das Ganze wird, desto weniger genau muss ich noch auf meinen eigenen Anteil schauen. Die Schuld liegt dann oben, außen, historisch, strukturell. Bei mir bleibt Haltung. Aber nicht immer derselbe Preis."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dort kippt etwas. Nicht unbedingt die Erklärung selbst. Die kann stimmen. Aber ihre Funktion verändert sich. Sie hilft dann nicht mehr nur, etwas besser zu sehen. Sie hilft auch, etwas in mir selbst weniger genau anzusehen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das ist der Punkt, an dem ich dem Text nicht ausweichen kann, indem ich nur über andere rede."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann rede ich über Gewalt und ändere meinen Ton nicht. Ich rede über Ausgrenzung und bleibe im Kleinen feige. Ich rede über Wahrheit und prüfe den eigenen Satz vor allem dort, wo die Prüfung nichts kostet."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Der Satz bleibt bei mir. Seine Folgen nicht. Und die Zeit arbeitet still mit. Kein Bruch fühlt sich an wie Bruch. Eher wie Fortsetzung. Ein Lachen bleibt stehen. Ein Ton wird normal. Eine Formulierung, die gestern noch kalt geklungen hätte, wirkt heute bloß direkt. Man stoppt später. Man zuckt weniger. Man lässt mehr durch. Das nennt man dann leicht Nüchternheit oder Differenzierung. Manchmal ist es nur Gewöhnung."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Irgendwann trägt auch die schöne Ausgewogenheit nicht mehr. Nicht weil links harmlos wäre. Sondern weil sich der Rechtsruck gerade schneller in Dinge übersetzt, die andere wirklich treffen. In Ausschluss. In Erniedrigung. In die Bereitschaft, soziale Kosten härter nach unten und außen zu verteilen. In Kälte, die nicht mehr nur Ton bleibt, sondern Verfahren wird."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann reicht es nicht mehr, bloß Pose zu hassen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Denn auch Entlarvung kann bequem werden. Jede Seite hält sich gern für die letzte ehrliche, weil sie die Pose der anderen durchschaut zu haben glaubt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Entlarvung zieht, weil sie einem oft mehr Arbeit erspart als ein wirklicher Wahrheitsversuch."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Aber wenn der Ekel vor Pose größer wird als die Aufmerksamkeit für Schaden, macht man Härte wieder anständig. Dann klingt Rücksicht plötzlich wie Schwäche und grobe Vereinfachung wie Mut."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Darum will ich am Ende nicht bei einer fairen Mitte landen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich will nur zu diesem einen kleinen Moment zurück."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Bahnhof. Der Satz fällt. Der andere nickt. Für einen Augenblick wird etwas leichter."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich kenne diesen Moment auch in mir. Nicht mit genau diesem Satz. Aber als Bewegung. Dieses kurze innere Nachgeben, wenn eine Formulierung so fällt, als müsse ich jetzt nicht mehr weiterprüfen. Als dürfte ich das Offene für einen Moment gegen Klarheit tauschen, ohne dafür einen Preis zu zahlen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Gerade deshalb misstraue ich ihm."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nicht jedem klaren Urteil."]]}, {"f": 0, "r": [["n", "Nicht jeder Härte."]]}, {"f": 0, "r": [["n", "Aber jedem frühen Frieden, der kommt, bevor die Last wirklich verteilt ist."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Mehr habe ich im Moment nicht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nur diese kleine Regel:"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Sätzen misstrauen, die mich zuerst beruhigen. Und eher denen glauben, die mich zwingen, die Last nicht zu schnell abzugeben."]]}]}], "vermerk": ""}]}];
