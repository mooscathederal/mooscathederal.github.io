<script>
const SEITE = {"zurueck": "index.html", "letztes": {"titel": "Sensibilität", "href": "sensibilitat.html"}, "naechstes": {"titel": "Was bleibt, ohne zu bleiben.", "href": "was-bleibt-ohne-zu-bleiben.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "Stille Enteignung", "unter": "", "datum": "2026-04-11", "anzeige": "11.04.26", "form": "Prosa", "zeilen": false, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "", "titel": "", "zeilen": false, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Dienstagnachmittag. Hohe Decken. Neubau. Der Boden riecht nach Staub und frischem Kunststoff. Drei Armlängen zwischen uns. Er sitzt aufrecht. Ich richte mich mit auf. Meine Knie still, die Hände ruhig, als sei Ausgeglichenheit hier schon Teil der Einrichtung. Als ich anfange zu sprechen, nickt er kaum merklich. Nicht zu früh, nicht zu spät. Seine Stimme wird ruhiger, je ungenauer ich werde. Je mehr ich suche, desto fertiger wird sein Ton. Ich komme mit einem Satz an und noch beim Reden höre ich, wie er woanders landet."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Visite. Tür auf. Klinge runter. Zwei weitere Personen im Rücken. Der Chefarzt bleibt nicht stehen. Er hält nur kurz inne. Ich bin noch beim ersten Satz, da liegt schon dieses kleine Heben der Hand in der Luft. Kein scharfes Abbrechen. Eher die Bewegung, mit der man eine Schublade schließt. Verlauf. Der Satz von eben ist nicht weg, nur nicht mehr meiner."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Später sitzt mir eine Frau gegenüber und lässt mich ausreden. „Ja.” „Natürlich.” „Ich verstehe.” Sie sieht mich an, ohne zu drängen. Fast warm. Dann setzt sie zum Schluss an. Auch das Stolpern. Auch die Stellen, an denen ich selbst noch hänge. Ich höre meine Sätze wieder. Ich kenne sie kaum."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "In der Fallbesprechung fällt ein Name und der Ton im Raum wird enger. Nicht kälter. Eher dichter. Belastbarkeit. Einsicht. Verantwortung. Mitarbeit. Einer notiert. Jemand schaut auf die Uhr. Ich sitze da und merke, wie wenig es braucht. Kein Angriff. Kein offener Hohn. Nur diese schlichte Art, in der etwas von einem Menschen abfällt und auf dem Tisch liegenbleibt, knapp genug, damit es weitergehen kann."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nicht Feindseligkeit, die falsch liest. Routine, die abschließt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht braucht Entscheidung genau diese Kälte. Systeme, die für jeden zittern, entscheiden für niemanden. Wer zu lange bei einem Namen bleibt, kommt beim nächsten zu spät. Das ist kein schlechtes Argument. Ich halte es aus, ohne es wegzuschieben."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Aber ich merke, dass es mich nicht von dem löst, was ich gesehen habe. Nicht wie etwas falsch gelesen wird. Wie etwas fertig wird, bevor es fertig ist, und wie dieses Fertigsein dann gilt, ohne dass jemand es entschieden hätte."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Zeiteinheit. Ertragslage. Relation. Angemessenheit. Wörter, in denen nichts zittert. Nichts wartet. Nichts hängt an einem Nachmittag, an einem Körper, an Monaten, in denen jemand endlich einmal wieder kommt. Das ist nicht Gleichgültigkeit. Das ist wie Betrieb läuft, wenn er nicht mehr warten kann. Die langsamen Dinge stehen weiter hinten. Bindung. Warten. Dass eine Arbeit nicht nur Zeit frisst, sondern Zeit hält. Dass ein Satz manchmal drei Sitzungen braucht, bis er überhaupt einer wird."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Auch dieser Satz hat jetzt eine Form. Er liegt hier und gilt."]]}]}], "vermerk": ""}]}];
