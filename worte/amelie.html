<script>
const SEITE = {"zurueck": "index.html", "letztes": {"titel": "Passierschein", "href": "passierschein-a38.html"}, "naechstes": {"titel": "Die Tru(e)man Show", "href": "die-trueman-show.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "Amélie", "unter": "Amélie ist eine Fantasie darüber, wie man die Welt berührt, ohne ihr erst einmal direkt in die Augen sehen zu müssen.", "datum": "2026-03-03", "anzeige": "12.02.26", "form": "Prosa", "zeilen": true, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "10.26", "titel": "", "zeilen": true, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Für einen Moment fühlt es sich warm an, wenn ich tue, was entschieden wurde. Wie eine Hand, die schon losgeht, bevor überhaupt jemand gefragt hat."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann stehe ich da, mit zu offenen Armen. Das kann großzügig wirken. Manchmal ist es das auch. Das erklärt aber nicht, warum es so eilt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "„Ich kümmer mich drum.“ Ein frühes Übernehmen. Als würde es den Raum stabilisieren, wenn ich ihn zuerst fülle."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Jemand nennt ein Problem, noch ohne um Hilfe zu bitten. Ich könnte mich anbieten. Spüre den Drang. Wenn ich nichts tue, könnte eine Chance vorbeigehen. Etwas, durch das wir uns näherkämen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Noch weiß ich nicht, ob du Hilfe möchtest. Vielleicht wolltest du mir nur erzählen, was dich beschäftigt. Vielleicht möchtest du es selbst lösen. Vielleicht hoffst du tatsächlich, dass ich mich anbiete."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich weiß es nicht. Trotzdem höre ich in deinem Satz schon die Bitte."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich biete mich an und mache aus der offenen Situation meine Zuständigkeit. Damit steht fest, was ich tue."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es folgt die stumme Kränkung, weil meine Hilfe angenommen, aber nicht in derselben Bedeutung erwidert wird. Ich entlaste und hoffe, dafür einen besonderen Platz zu behalten."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich kann viel geben und kaum erfahren, ob ich ohne dieses Geben angekommen wäre. Aber auch das weiß ich nicht: Was zwischen uns möglich gewesen wäre, wenn ich dich zunächst hätte antworten lassen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und manchmal ist es Fürsorge. Die Hilfe wird gebraucht. Ich möchte sie geben. Zugleich kann darin der Versuch liegen, etwas anderes abzuwehren. Enttäuschung, die schon im Anmarsch scheint. Ablehnung, bevor sie ausgesprochen ist."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich möchte dir helfen. Ich möchte auch nicht herausfinden müssen, was zwischen uns geschieht, wenn ich es nicht tue."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Im Moment des Gebens kann ich mich selbst übergehen. Das ist der Angst egal."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich möchte vorkommen. Selbst gehalten werden. Angeboten habe ich etwas, das helfen soll. Wir begegnen uns, und an dieser Stelle bleibe ich trotzdem unerreicht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Mir fehlt die Erfahrung, wie ich etwas brauchen kann, ohne es vorher zu verdienen. Aus dem Wunsch, gehalten zu werden, wird ein Halten. Der andere soll erkennen, was nie gesagt wurde."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Eine Schuld, die niemand ausgestellt hat. Ich zahle sie trotzdem. Kleiner werde ich an der Stelle, die sich zeigen wollte."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Gebe ich, weil ich frei bin? Gebe ich, damit du bleibst? Gebe ich, um Reue und Scham zuvorzukommen?"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich weiß selbst nicht genau, was ich mir verspreche. Es ist keine Entscheidung, auch kein Plan. Es ist älter. Etwas entscheidet noch und immer wieder. Oder so scheint es."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Die Erwartung steht trotzdem im Raum, wie ein Glas, das nicht umfallen darf."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Später merke ich, dass ich mehr zugesagt habe, als ich wollte. Das Wissen kommt zurück, die Zusage bleibt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ein Geländer sieht aus wie ein Heute nicht. Später. Oder „Das kann ich nicht.“ Oder ehrlich: „Das will ich nicht.“"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Aber das Geländer beantwortet noch nicht, weshalb ich überhaupt schon vor einer Bitte vor der Frage stehe, ob ich Ja oder Nein sagen muss."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht liegt die erste Schwierigkeit vor der Grenze. Ich kann die offene Situation nicht offen lassen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Du hast ein Problem genannt. Ich hab nichts zugesagt. Du hast noch nichts verlangt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich könnte fragen, ob du überhaupt etwas brauchst. Ich könnte zuhören, ohne schon eine Aufgabe daraus zu machen. Es könnte eine Nähe entstehen, die ich durch mein frühes Übernehmen gar nicht bemerkt hätte."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht auch nicht. Manchmal ist die Gelegenheit tatsächlich vorbei, wenn ich zu lange warte. Manchmal wäre mein Angebot genau das gewesen, was du gebraucht hättest."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich möchte etwas richtig machen. Auch aus meinem Abwarten kann eine Leistung werden. Eine Hoffnung, dass du erkennst, wie viel Mühe es mich kostet, nichts zu übernehmen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Mir scheint, zwischen „Ich könnte“ und „Ich mache es“ kommt das Wollen nicht zu Wort. Aber ich denke dort fehlt nicht nur mein Wollen. Ich habe auch deines schon beantwortet, bevor du es ausgesprochen hast. Was du gesagt hättest, kommt nicht mehr vor."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich möchte länger an dieser Stelle bleiben, damit etwas geschehen kann, das ich noch nicht entschieden habe."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Was ist, wenn ich ohne mein Geben weniger wert bin?"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich kann mir sagen, dass ich auch ohne Leistung da sein darf. Ich spreche die Erlaubnis aus und weiß noch nicht, wie ich ihr glauben soll. Das Nein verschwindet, bevor es vortreten darf."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich kann versuchen wieder bei mir zu landen. Mich einsammeln. Zurück in meinen Takt kommen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Die Bitte bleibt trotzdem bestehen, auch die Sehnsucht. Wie sie sich zeigen könnte, ohne sich als Geben zu verkleiden, weiß ich nicht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich gebe zu viel und merke es erst hinterher. Oder ich weiß es schon und gebe trotzdem. Liebe kann Liebe sein, auch mit Angst. Oder Angst in schöner Handschrift."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich kann versuchen zu stehen. Nicht freundlicher sein, als ich gerade kann und will. Auch wenn die Tür nur einen Spalt offen ist."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Manchmal gebe ich, und es fühlt sich frei an. Manchmal bleibe ich, und es fühlt sich trotzdem eng an."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Jemand will etwas hervorbringen, von dem ich nichts weiß. Er nimmt dafür meine Hand. Was sie tut, weiß ich. Was durch sie entsteht, nicht."]]}]}], "vermerk": "überarbeitet am 31.10.2026"}, {"name": "02.26", "titel": "", "zeilen": true, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Sich zu verausgaben ist oft kein Herz. Es kommt eher einem Zittern im Hintergrund nahe. Ich merke das selten in dem Moment. Es fühlt sich erst warm an. Aktiv. Sinnvoll. Wie eine Hand, die schon losgeht, bevor überhaupt jemand gefragt hat."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann stehe ich da, mit zu offenen Armen. So lässt sich der eigenen Unsicherheit zuvorkommen. Das kann großzügig wirken. Ist es aber nicht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich kenne diese Gewohnheit. Dieses „Ich kümmer mich drum“ als Reflex, nicht als Entscheidung. Ein frühes Übernehmen. Als würde es den Raum stabilisieren, wenn ich ihn zuerst fülle. Dann heißt es Fürsorge."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Jemand nennt ein Problem, noch ohne um Hilfe zu bitten. Ich biete mich an und mache aus der offenen Situation meine Zuständigkeit. Was folgt ist die Kränkung, weil die Hilfe angenommen, aber nicht in derselben Bedeutung erwidert wird. Der unausgesprochene Tausch lautet: Ich entlaste dich, dafür behalte ich einen besonderen Platz. Niemand hat diesem Vertrag zugestimmt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und manchmal ist es Fürsorge. Oft ist es zugleich der stille Versuch, etwas anderes abzuwehren. Enttäuschung, die schon im Anmarsch scheint. Ablehnung, bevor sie ausgesprochen ist. Und darunter, kaum benennbar, diese allgemeine Unklarheit darüber, was eigentlich passieren würde, wenn ich einfach nichts täte."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das Schlimmste daran: dass niemand merkt, wie sehr man selbst gehalten werden möchte."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht geben manche Menschen zu viel, weil sie nicht wissen, wie man etwas braucht, ohne es vorher zu verdienen. So wird aus einer Bitte Leistung und aus Verletzlichkeit Fürsorge. Der andere soll erkennen, was nie gesagt wurde, und kann doch nur auf das antworten, was sichtbar ist."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Zu viel zu geben kann wie Liebe aussehen, während es innen eher einem Schuldhaken gleicht, den keiner unterschrieben hat. Die Kränkung entsteht dann nicht, weil nichts gegeben wurde, sondern weil eine verborgene Bitte unbeantwortet blieb."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Gebe ich, weil ich frei bin? Oder gebe ich, damit du bleibst?"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das ist ein heikler Satz, weil er schnell nach Manipulation klingt. Dabei ist es selten kalkuliert. Es ist kindlicher als das: eine alte Gewohnheit, die sich als Moral verkleidet."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich bin gut, wenn ich hilfreich bin. Sicher bin ich erst, wenn ich unentbehrlich werde. Und verlassen wird man nicht, wenn man sich selbst rechtzeitig hintenanstellt. Das ist zumindest die stille Rechnung, die darunter läuft."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und das Tragische daran: Es funktioniert. Jedenfalls manchmal. Kurz."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Menschen mögen es, umsorgt zu werden."]]}, {"f": 0, "r": [["n", "Bis sie merken, dass da etwas mitschwingt. Eine Erwartung, die nicht ausgesprochen wird und trotzdem im Raum steht, wie ein Glas, das nicht umfallen darf."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann passiert etwas, das wehtut, obwohl es logisch ist."]]}, {"f": 0, "r": [["n", "Sie respektieren nicht die Aufopferung. Sie achten die Stabilität."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Die Menge, die du gibst, merken sie kaum. Was zählt, ist die Linie, die du nicht verwischst. Der Rahmen, den du schützt. Dass du bei deinem Nein bleiben kannst, ohne es tausendmal zu erklären."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Denn Aufopferung ist nicht automatisch Tiefe. Manchmal ist sie nur das Fehlen eines Geländers."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ein Geländer ist unromantisch. Es sieht aus wie ein Heute nicht. Wie ein Später. Wie ein „Das kann ich nicht.“"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und trotzdem bringt es oft als Erstes Ruhe in Beziehungen. Das ist weniger Kalkül als Temperatur. Dieses stille: „Hier kann man atmen.“"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich glaube, hier kippt oder klärt es sich:"]]}, {"f": 0, "r": [["n", "Wenn Geben aufhört, hektisch zu sein, und stattdessen bewusst wird. Wenn es nicht mehr nach Eile schmeckt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Geduld ist langsam. Angst ist schnell."]]}, {"f": 0, "r": [["n", "Angst gibt zu früh. Geduld wartet, bis es wirklich so weit ist."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und manchmal ist das Ehrlichste, nichts zu tun. Das Kribbeln nicht wegzudrücken."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Im Unbequemen bleiben. Die Spannung stehen lassen. Den Impuls nicht sofort bedienen. Die Nervosität mitnehmen, ohne zu handeln. Nicht gleich alles glattziehen. Den inneren Alarm nicht zum Steuerrad machen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dabei kommt diese nüchterne Frage hoch, die nicht schmeichelt: Was ist, wenn ich ohne mein Geben weniger wert bin?"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und dann merkt man: Unter der moralischen Schicht liegt etwas sehr Menschliches."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nicht der Begriff Selbstwert. Das Gefühl von Eigenwert dahinter."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dieses: Da ist etwas, das mich auch ohne Leistung trägt. Mein Fundament. Mein Stand. Sicherheit in mir."]]}, {"f": 0, "r": [["n", "Das zu sehen, ist keine Anklage."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wieder bei mir landen. In mir ankommen. Zurück in den eigenen Raum. Mich einsammeln. Wieder Boden unter den Füßen haben. Zurück in meinen Takt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Denn es gibt auch eine Gegenbewegung."]]}, {"f": 0, "r": [["n", "Fast unsichtbar, aber ernst."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Weniger Angst im Geben, mehr Halt darunter. Und eine Nähe, die sich nicht mehr selbst absichern muss."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "„Ich gebe gar nichts mehr“ wäre die eine Übertreibung. „Ich gebe nicht, um mich zu retten“ ist schon näher dran."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das könnte der Übergang sein. Vom Geben als Bitte. Zum Geben als Wahl."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und ja, es bleibt widersprüchlich."]]}, {"f": 0, "r": [["n", "Manchmal gibt man zu viel und merkt es erst hinterher. Beim Nein bleibt manchmal ein kaltes Gefühl zurück, obwohl es gesund ist. Liebe kann wirklich Liebe sein. Oder Angst in schöner Handschrift."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich will das nicht komplett auflösen. Ich will es nur genauer sehen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Denn Aufrichtigkeit mir selbst gegenüber heißt nicht, immer abrufbar zu sein, sondern bei mir zu bleiben, ohne hart zu werden."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Innere Geradheit. Stimmigkeit. Eine Haltung, die man nicht ständig neu begründen muss. Anstand, ganz einfach: sich nicht selbst verlassen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ob das am Ende reicht, weiß ich nicht. Manchmal gebe ich, und es fühlt sich frei an. Manchmal bleibe ich, und es fühlt sich trotzdem eng an."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Auch wenn ich nicht über meine Kapazität hinaus freundlich bin. Auch wenn die Tür nur einen Spalt offen ist und nicht alles mit mir auffängt."]]}]}], "vermerk": "überarbeitet am 13.07.2026"}]}];
