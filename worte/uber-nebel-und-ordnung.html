<script>
const SEITE = {"zurueck": "index.html", "letztes": {"titel": "Uno · Dos · Tres · Quattro", "href": "uno-dos-tres-quattro.html"}, "naechstes": {"titel": "Zeit ist der eigentliche Souveräne.", "href": "zeit-ist-der-eigentliche-souverane.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "Über Nebel und Ordnung", "unter": "Viele wussten. Wenige entschieden. Die meisten zahlen.", "datum": "2026-03-03", "anzeige": "Februar 2026", "form": "Prosa", "zeilen": false, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "", "titel": "", "zeilen": false, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Manchmal merke ich, dass ich wieder an derselben Stelle denke wie vor Jahren. Die Ereignisse sind andere. Die Bewegung dahinter nicht. Vielleicht überschätzen wir Geschichte. Wir tun so, als würde uns das Verstehen automatisch klüger machen. Als reiche es, etwas zu durchschauen, und dann würde es sich schon verschieben. Dabei ist dieses „Verstehen” oft nur ein Lichtkegel im Nebel: klar genug, um zu hoffen, zu verschwommen, um zu tragen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Denn es löst sich nicht einfach. Es verlagert sich. Neue Begriffe, neue Manieren, neue Outfits. Und darunter dreht sich dasselbe Karussell: dieselbe Angst, dieselbe Bequemlichkeit, dieselbe Sehnsucht nach Ruhe."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich habe dafür kein sauberes Bild. Nur so eine Kreuzung im Kopf, an der man immer wieder steht. Jedes Mal fühlt es sich an wie das erste Mal, obwohl man weiß, dass man diese Ecke schon kennt. Und trotzdem hilft das Wissen nicht unbedingt. Es beruhigt kurz. Aber es verändert nicht automatisch etwas."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es beginnt selten groß. Kein „Wir entscheiden jetzt …”. Kleinigkeiten: ein Stich, eine Kränkung, ein Satz, den man nicht sagt, weil er zu viel auslösen könnte. Dieses leise innere „Ich werde gerade nicht gesehen”, das nicht einmal laut genug wird, um ein richtiger Satz zu sein. Mehr so ein Zucken. Wenn das lange genug so bleibt, kommt etwas, das sich wie Ordnung anfühlt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich meine nicht Ordnung als Struktur, die schützt. Ich meine Ordnung als Schließung. Als Eindeutigkeit, weil Offenheit zu viel geworden ist. Nicht als Ideologie. Wie jemand, der im Dunkeln nach der Wand tastet, weil er etwas Festes greifen will. Hauptsache Kontrolle. Hauptsache Eindeutigkeit. Eindeutigkeit ist die Droge der Überforderung."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das kann sich beruhigend anfühlen. Und genau das macht es heikel. Weil es nicht nach Härte klingt. Es klingt nach einem „endlich wieder ruhig schlafen”."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann wird Sprache kürzer. Die Welt ist nicht einfacher geworden, aber Komplexität wirkt unpraktisch. Sie stört. Sie kostet Zeit."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wenn die Komplexität der Probleme das Verständnis der Menschen übersteigt, wächst das Bedürfnis nach Führung. Gemeint ist Entlastung, nicht Verantwortung."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nach ein paar Jahren wirkt schon ein „Ja, aber …” wie ein Problem, weil dieses „aber” wieder Luft reinlässt. Weil es zeigt, dass etwas offen ist. Und Offenheit ist genau das, was man in so einem Moment nicht aushält."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Verantwortung verteilt sich dabei oft so, dass sie wie Hintergrundrauschen wird. Sie ist da, und sobald man versucht, sie festzunageln, greift man ins Leere. Keiner war es. Alle ein bisschen. Umstände halt. Zuständigkeiten, Gremien, Prozesse, Ausreden, Zeitdruck. Und trotzdem steht man irgendwann da und denkt: Wer hält hier eigentlich irgendwas?"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Machtmissbrauch setzt jemanden voraus, der Macht hat. Hier verliert etwas nur an Bedeutung. Wo Verfahren wichtiger werden als Verantwortung, regiert niemand mehr. Es verwaltet sich nur noch selbst."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Währenddessen laufen die Dinge weiter. Systeme, Routinen, Beziehungen. Nicht unbedingt böse. Zäh. Dieses „Es funktioniert doch”, das langsam zur Begründung wird."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielen reicht es vielen schon, dass der Laden nicht brennt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann passiert manchmal diese Verschiebung, bei der Innen Außen wird. Das, was man innen nicht halten kann. Unsicherheit, Widerspruch, Ambivalenz tauchen außen wieder auf. Im Tonfall, in Härte, in Lagergefühl oder in dem Wunsch, dass irgendwer anders die Unruhe sortiert."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das Gegenüber rutscht aus dem Menschlichen heraus und wird zu einer Funktion: Gegner. Problem. Projektionsfläche. Ich schreibe das so, weil ich merke, wie nah das auch im Kleinen ist. Wie schnell."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Am Anfang wirkt das oft erstaunlich freundlich. Ruhe. Klarheit. Dass es wieder normal wird. Mehr will man ja nicht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ordnung kommt selten mit matschigen Stiefeln. Häufig hat sie eine warme Stimme. Dabei legt sie sich wie eine Decke über Zweifel: beruhigend, schwer, ein bisschen zu eng. Das Enge-Sein merkt man erst später. Wenn man sich nicht mehr richtig drehen kann."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Rollen entstehen. Man wird „zuverlässig”, „vernünftig”, „unkompliziert”. Und plötzlich hängt Zugehörigkeit an Dingen, die keiner ausspricht. Wer belohnt wird, wenn er unkompliziert ist, lernt schnell, Komplexität zu verstecken. Nicht aus Lüge. Müdigkeit."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Diese Müdigkeit kommt nicht nur vom Machen. Vielleicht kommt sie vom Spagat zwischen Selbstverantwortung und Selbstbetrug. Das nennt man dann Anpassung oder Reife und klopft sich dafür auf die Schulter: „Ich kann mich zusammenreißen.” Nur fühlt es sich manchmal nach Rückzug an. Der so langsam verläuft, dass man ihn erst bemerkt, wenn er Alltag ist."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "In Beziehungen sieht man das schnell. Man bleibt höflich, zugewandt, stabil. Nah genug, um nicht allein zu sein. Fern genug, um nichts zu riskieren. Konflikte werden auf später verschoben, und später wird zum Dauerzustand. Sicherheit und Vermeidung sehen dann aus wie Stabilität."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und es kippt. Nicht dramatisch. Ein Wechsel im Tonfall. Wenn Zweifel plötzlich wie eine Störung wirken. Wenn man merkt, dass für bestimmte Fragen kein Platz mehr ist. Nicht, weil sie falsch wären, sondern weil sie zu viel öffnen. Und Öffnen ist anstrengend. Es macht den Nebel sichtbar, und Nebel macht Angst."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Manchmal kommt dann eine Gegenbewegung. Luftnot. Der Griff nach Sauerstoff. Aber auch das ist nicht automatisch Freiheit. Anderes Kostüm, andere Wörter, andere Gesellschaft. Darunter bleibt dieselbe Spannung: Bitte endlich Ruhe im Kopf."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich sehe dieses Muster in Beziehungen, Gesellschaften und Staaten. Ich schreibe „sehe”, nicht „weiß”. Ich will nicht so tun, als hätte ich eine endgültige Antwort. So ein starkes Gefühl. Macht sammelt sich dort, wo viele ihr eigenes Gewicht ablegen. Nicht immer freiwillig. Nicht immer aus Bequemlichkeit. Oft aus Erschöpfung, Angst, Mangel an Alternativen. Aber das Ergebnis sieht ähnlich aus."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wenige tragen Entscheidungen, viele tragen Folgen. Von Rom bis heute."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht wiederholt sich Geschichte nicht deshalb, weil wir nichts lernen. Bestimmte Anreize und Ängste lassen sich einfach zuverlässig zusammensetzen. Weil sich innere Unruhe so gut nach außen verlagern lässt: in Feindbilder, in einfache Erzählungen, in harte Sprache, klare Lager. Die Bühne wechselt, das Drehbuch bleibt ähnlich."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Erst Unruhe, dann Ordnung. Erst Fragen, dann der Wunsch, sie nicht mehr hören zu müssen. Ein Schutzreflex, der menschlich ist. Und logisch wirkt. Und trotzdem Räume kleiner macht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Komplexität fühlt sich irgendwann wie Überforderung an, und Überforderung ruft nach Eindeutigkeit. Eindeutigkeit entlastet kurz. Kontrolle fühlt sich an wie Handlungsfähigkeit. Und für manche kann selbst Krieg, so absurd das ist, einfacher wirken als Politik, weil er Klarheit simuliert. Er macht die Welt grob. Schwarz-weiß. Beweglich in eine Richtung."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nur ist das kein Ende. Sondern ein Tausch. Man tauscht Unschärfe gegen Zerstörung. Und die Unschärfe kommt später wieder."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es kippt dort, wo Menschen aufhören, sich innerlich verantwortlich zu fühlen. Wenn Verantwortung abgegeben wird, um Ruhe zu haben. Der Preis ist Ohnmacht, und Ohnmacht ist ein erstaunlich guter Treibstoff für Ordnung."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und dann lande ich bei Fragen, die sich schwer stellen lassen, ohne pathetisch zu werden: Warum geben wir so viel Macht ab? Warum lassen wir zu, dass wenige Positionen so viel über viele bestimmen können, manchmal durch einen Knopfdruck, manchmal durch ein Unterlassen?"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Weil es entlastet. Weil es angenehmer ist, an Steuerbarkeit durch andere zu glauben, als sich einzugestehen, wie sehr man selbst Teil der Mechanik ist. Nicht als Schuldfrage. Als Tatsache, die man nicht gerne fühlt. Manche haben Spielräume, andere kaum. Und trotzdem nutzt die Mechanik unsere Müdigkeit aus."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und dann passiert manchmal etwas Kleines. Kein Heldending. Kein Wunder. Nur ein kurzes Innehalten. Der Moment, in dem ich einen Schritt zurückgehe, bevor ich ganz in einer Rolle verschwinde. Der Moment, in dem ich merke, dass ich eine Bühne betrete und schon mitspiele. Wenn ich spüre, wie bequem es ist. Zu bequem."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann werde ich einen Tick leiser. Nicht, um den Nebel zu besiegen oder plötzlich eine perfekte Lösung zu haben. Nur um die Kreuzung einmal wirklich zu sehen. So wie sie ist. Mit allem, was offenbleibt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und vielleicht ist das schon viel. Der Anfang von etwas, das nach Verantwortung klingt statt nach Ordnung. Oder nach Präsenz. Sie zeigt sich klein: in einer Nachfrage. In einem Nein zur Abkürzung. In dem einen Satz, den man nicht mehr schluckt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich bin mir nicht sicher. Aber ich glaube, das ist der Weg, der nicht zurückführt."]]}]}], "vermerk": ""}]}];
