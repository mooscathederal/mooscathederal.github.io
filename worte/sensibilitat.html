<script>
const SEITE = {"zurueck": "index.html", "letztes": {"titel": "Privilegien und Verantwortung", "href": "privilegien-und-verantwortung.html"}, "naechstes": {"titel": "Stille Enteignung", "href": "stille-enteignung.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "Sensibilität", "unter": "Nicht weich. Nur wach.", "datum": "2026-04-06", "anzeige": "06.04.26", "form": "Prosa", "zeilen": false, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "", "titel": "", "zeilen": false, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Ich merke Sensibilität selten in großen Momenten. Meistens fängt sie klein an."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ein Etikett im Nacken. Der Löffel, der im Glas anschlägt. Jemand sagt meinen Namen in einem Ton, der für alle anderen neutral wäre, und in mir zieht sich etwas zusammen, bevor ich sagen könnte, was daran falsch war. Der Ton ist längst vorbei, aber in mir arbeitet er weiter. Er bekommt Anschluss. Erinnerung, Vermutung oder Körper. Bevor ich im Moment ankomme ist da mehr als ein Geräusch."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Andere gehen durch einen Raum und nehmen den Raum. Ich gehe durch einen Raum und der Raum nimmt mich. Licht, Stimmen, Kaffee, eine nasse Jacke auf der Heizung, eine ungeduldige Bewegung am Nebentisch, das kleine Zögern vor einer Antwort. Nichts davon muss an sich zu viel sein. Nur kommt es meist alles auf einmal."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Früher dachte ich, Sensibilität sei Schwäche, nur schöner benannt. Ungünstige Bauweise. Zu wenig Schutz zwischen mir und der Welt. Mit den Jahren wurde das weniger eindeutig. Die Frage wurde kleiner und härter, schwerer auszuweichen: Was mache ich mit dem, was mich trifft? Wem gebe ich Aufmerksamkeit? Was lasse ich wieder gehen? Schwäche war zu einfach. Gabe auch. Beides macht es ordentlicher, als es ist."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wahrnehmen ist der Anfang. Danach bleibt zu viel offen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ein grober Mensch wird von vielem gar nicht erst getroffen. Bei mir landet vieles direkt in der Antennenschüssel. Dann muss ich entscheiden, was Wirklichkeit ist und was nur Einschlag. Das kostet Zeit. Kraft. Genau das, was in diesem Moment oft fehlt. Von außen mag das lächerlich aussehen. Man sieht mir ja nur auf die Stirn."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Manchmal stimmt es. Jemand sagt, es sei nichts, und eine Stunde später war doch etwas. Ein Gespräch kippt, und vorher war schon dieser kleine Riss im Ton. Daran ist nichts edel. Gelegentlich hilft es. Meistens gibt es der Unruhe nur Material."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "So kann Sensibilität Selbstverlust verstärken. Was offen bleibt, verschwindet nicht. Es arbeitet weiter, auch wenn die Energie fehlt, es zu übersetzen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann wird nicht nur alles zu viel. Es wird auch schnell zu wichtig. Ich lasse dem Uneindeutigen keine Zeit. Ein Ton, ein Blick, eine kleine Verzögerung, ein Geruch, eine Unruhe im Raum. Zu vieles drängt sich nach vorn. Ich antworte nicht mehr auf das, was ich will, sondern auf das, was gerade am härtesten auf mich drückt. Ich meide Menschen nicht immer aus einem großen Grund. Manchmal auch nur, weil sie schon nach wenigen Minuten zu sehr da sind. Zu viel Blick, zu viel Tempo und Unruhe in den Händen. Zu viel Bedarf an sofortiger Antwort. Dann heißt es schnell: Erschöpfung. Oft sitze ich nur da und merke, dass ich schon wieder nach dem lautesten Reiz lebe."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Während ich noch prüfe, ist es schon drin. Außen fast nichts. Nur etwas, das nicht sauber sitzt. Innen schon dieser Lärm. Ein Ton. Eine Spannung. Jemandes Unruhe. Ich weiß dann noch nicht genau, was es ist, nur dass es schon dabei ist, sich festzusetzen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich erinnere mich an den alten Versuch, es wegzuerziehen. Stell dich nicht so an. Gewöhn dich dran. Sei nicht so empfindlich. Das hilft fast nie. Es schließt nur Klappen, während dahinter alles weiterarbeitet. Aus Wahrnehmung wird beschämte Wahrnehmung. Ich bin weiter überreizt, aber jetzt kommt Scham dazu, weil ich es spüre."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Die bessere Frage ist: Worauf richte ich mich aus?"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das klingt sauberer, als es ist. In Wirklichkeit heißt es für mich, früher zu gehen. Eine Nachricht nicht sofort zu beantworten. Ein Kleidungsstück wegzuwerfen, obwohl andere darüber lachen würden. Einen Menschen nicht noch einmal zu treffen. Vielleicht auch ohne gerechtfertigten Grund. Nur dieses enge Gefühl im Brustkorb. Dazu dieser Schwindel, als würden weiße Risse durchs Bewusstsein laufen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich weiß dann noch nicht, ob diese Abwehr recht hat. Aber sie ist auch nicht nichts. Etwas in mir stemmt sich gegen etwas, das schon zu weit gegangen ist. Wenn ich sie jedes Mal übergehe, bin ich irgendwann nicht mehr großzügig. Nur noch abwesend."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich denke das ist die Versuchung: alles hereinzulassen und es Nähe zu nennen. Alles zu prüfen und es Kontrolle zu nennen. Dabei bin ich nicht da. Ich bin nur beschäftigt, nachträglich Türen zu schließen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nicht alles erklären. Nicht alles prüfen. Nicht alles aushalten."]]}]}], "vermerk": "überarbeitet am 30.06.2026"}]}];
