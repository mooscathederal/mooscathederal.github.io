const SEITE = {"zurueck": "index.html", "letztes": {"titel": "Hinter klugen Sätzen", "href": "hinter-klugen-satzen.html"}, "naechstes": {"titel": "Woher willst du das wissen?", "href": "woher-willst-du-das-wissen.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "Wer hat dir das erlaubt?", "unter": "Ein Text über Kant, die Kränkung der Vernunft und die Sauberkeit ihrer Grenze.", "datum": "2026-03-14", "anzeige": "14.03.26", "form": "", "zeilen": true, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "", "titel": "", "zeilen": true, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Im Saal sitzt niemand ruhig."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vorn die Vernunft. Nicht als Königin. Eher wie eine Instanz, die sich zu lange selbst nicht vorgeladen hat. Sie steht da mit ihren Akten, mit diesem alten Ton, als könne sie aus eigener Kraft bis in die letzten Zimmer der Welt gehen und dort noch gültige Sätze holen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann die Frage."]]}, {"f": 0, "r": [["n", "Wer hat dir das erlaubt?"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nicht ob sie denken kann. Das kann sie. Nicht ob sie ordnen, schließen, unterscheiden kann. Auch das. Die Akten sind voll davon. Begriffe, Urteile, Folgerungen, ganze Treppen aus Sätzen. Ihre Reichweite ist nicht das Problem. Eher dies: Sie kommt weit und hält das schon für ein Recht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Kant ist hier nicht der große Richter aus Stein. Eher der Erste, der merkt, dass in diesem Raum dauernd Behauptungen verhandelt wurden, ohne die Zuständigkeit zu prüfen. Seele, Welt, Gott, Ursprung, Ganzes. Hohe Wörter. Viel Sicherheit. Fast nie die nüchterne Frage, ob Vernunft dort noch erkennt oder nur weiterläuft, weil sie den eigenen Schwung mit Wahrheit verwechselt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Genau da kippt es."]]}, {"f": 0, "r": [["n", "Denn Vernunft verliert nicht ihre Kraft. Sie verliert etwas Peinlicheres. Die Gewohnheit, sich selbst zu glauben."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Sie darf weiter arbeiten. Aber nicht mehr so tun, als könne sie jenseits möglicher Erfahrung erkennen, nur weil sie dorthin denken kann. Denkfähigkeit ist kein Eigentumstitel. Ein Begriff ist noch keine Sache."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Danach steht nicht nur irgendeine metaphysische Behauptung schief. Der Anspruch selbst steht schief. Nicht bloß der Inhalt. Das Organ."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Genau deshalb ist Kant hier der entscheidende Vorläufer."]]}, {"f": 0, "r": [["n", "Er zieht nicht nur ein paar Sätze aus dem Verkehr. Er ändert, was überhaupt als zulässiger Zugriff gilt. Von da an reicht es nicht mehr, dass ein Gedanke groß klingt oder sich in sich schön schließt. Er muss sich an möglicher Erfahrung messen lassen. Sonst bleibt er vielleicht unvermeidlich. Vielleicht erhaben. Aber er erkennt nichts."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das ist die Kränkung."]]}, {"f": 0, "r": [["n", "Und vielleicht zum ersten Mal so etwas wie Sauberkeit."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Denn Vernunft wird nicht zerstört. Sie wird auf ihren Ort zurückgesetzt. Nicht damit sie kleiner wird. Damit klar wird, was Erkenntnis heißen darf. Keine freie Fahrt ins Übersinnliche. Keine bloße Höhe des Anspruchs. Geltung nur dort, wo Zugriff gedeckt ist."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Am Ende sitzt sie noch immer da."]]}, {"f": 0, "r": [["n", "Nicht entthront. Aber hörbar leiser."]]}]}], "vermerk": ""}]}];
