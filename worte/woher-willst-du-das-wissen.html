<script>
const SEITE = {"zurueck": "index.html", "letztes": {"titel": "Wer hat dir das erlaubt?", "href": "wer-hat-dir-das-erlaubt.html"}, "naechstes": {"titel": "Wieso sagst du das?", "href": "wieso-sagst-du-das.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "Woher willst du das wissen?", "unter": "Zwischen Wahrheit und Wirklichkeit.", "datum": "2026-03-17", "anzeige": "17.03.26", "form": "Prosa", "zeilen": true, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "", "titel": "", "zeilen": true, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["c", "VERSUCHSANORDNUNG"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Man stelle drei Menschen in denselben Raum. Dem ersten gibt man ein Thermometer. Dem zweiten einen Fragebogen. Dem dritten nichts, nur den eigenen Körper."]]}, {"f": 0, "r": [["n", "Dann öffnet man das Fenster."]]}, {"f": 0, "r": [["n", "Der erste sagt: achtzehn Grad. Der zweite: eher kühl. Der dritte reibt unmerklich die Hände aneinander und tut so, als sei das nichts."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nun wiederhole man den Versuch. Gleicher Raum. Gleiche Luft. Gleiche Stunde. Aber diesmal ohne Skala, ohne Kästchen, ohne Vergleichswert. Wand, Tisch, Atem, Haut."]]}, {"f": 0, "r": [["n", "Die Kälte ist nicht weg. Das Händereiben auch nicht. Weg ist nur die Stelle, an der man sie festhalten kann."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nicht alles, was wirklich ist, liegt schon als fertiges Objekt bereit. Vieles muss erst in eine Form geraten, damit es lesbar wird. Eine Form kann etwas auseinanderziehen, das uns sonst nur gleichzeitig trifft."]]}]}, {"t": "luecke", "h": 30}, {"t": "p", "z": [{"f": 0, "r": [["n", "Im nächsten Durchgang nehme man Schmerz, Angst, Aufmerksamkeit. Spätestens hier wird es unangenehm."]]}, {"f": 0, "r": [["n", "Wo beginnt Angst genau. Wann wird ein Blick zu lang. Wann ist jemand nur nervös. Wann schon auffällig."]]}, {"f": 0, "r": [["n", "Und wer entscheidet das eigentlich, während man noch so tut, als würde man bloß messen."]]}, {"f": 0, "r": [["n", "Hier zerfällt die brave Vorstellung, Objektivität sei einfach die spiegelglatte Wiedergabe von etwas, das vollständig vor uns liegt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Je schwerer ein Gegenstand sich fassen lässt, desto mehr rückt mit ins Bild, was ihn fassbar machen soll:"]]}, {"f": 0, "r": [["n", "die Frage, die man überhaupt stellen darf;"]]}, {"f": 0, "r": [["n", "der Takt, in dem abgefragt wird;"]]}, {"f": 0, "r": [["n", "die Grenze, ab der etwas zählt;"]]}, {"f": 0, "r": [["n", "der Vergleich, den man im Hintergrund schon mitführt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann ändere man das Verfahren. Man fragt anders. Man wartet länger. Man zählt gröber. Man setzt die Grenze ein Stück weiter links."]]}, {"f": 0, "r": [["n", "Und auf einmal verschiebt sich nicht nur das Resultat. Mitunter verschiebt sich schon das, was man hier ernsthaft ein Resultat nennen kann."]]}]}, {"t": "luecke", "h": 30}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich misstraue Leuten, die an diesem Punkt noch immer so reden, als läge Wahrheit einfach unberührt in der Welt herum und wir müssten nur sauber genug hinschauen. Das klingt stark, ist aber oft nur eine höfliche Form von Blindheit."]]}, {"f": 0, "r": [["n", "Auch ich hätte das gern. Es wäre entlastend. Dann müsste ich mein Sehen nicht mitverantworten."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Aber in manchen Bereichen hängt Erkenntnis an Beobachtungs- und Messordnungen wie die Stimme an dem Raum, in dem sie gesprochen wird. Im Treppenhaus klingt derselbe Satz anders als am Bett eines Kranken."]]}, {"f": 0, "r": [["n", "Seine Fassung entscheidet mit, was von ihm überhaupt ankommt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Objektivität ist oft der mühsam hergestellte Zustand, in dem Verschiedenes so erfasst wird, dass es überhaupt gegeneinander bestehen muss."]]}, {"f": 0, "r": [["n", "Und manchmal fürchte ich, dass wir zu früh so tun, als sei schon klar, was da überhaupt gemessen wird."]]}]}], "vermerk": "überarbeitet am 06.10.2026"}]}];
