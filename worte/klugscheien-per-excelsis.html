<script>
const SEITE = {"zurueck": "index.html", "letztes": {"titel": "Wieso sagst du das?", "href": "wieso-sagst-du-das.html"}, "naechstes": {"titel": "Henne oder Ei?", "href": "henne-oder-ei.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "Klugscheißen per excelsis", "unter": "Eine Kunst der Selbstverarschung.", "datum": "2026-03-19", "anzeige": "19.03.26", "form": "", "zeilen": false, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "", "titel": "", "zeilen": false, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Neulich war jemand verärgert. Ich wusste nicht mal, ob es um mich ging. Aber mein Körper war schneller. Erst Angst. Dann Scham. Dann dieses alte Schrumpfen. Bloß nichts Falsches sagen. Bloß keinen Ärger machen. Lieber schon mal innerlich reparieren, was ich vielleicht gar nicht kaputtgemacht hatte. Ich habe danach zwei Tage damit verbracht, das Problem dieser Person in meinem Kopf zu lösen, ohne sie einmal zu fragen, was überhaupt los war. Merkwürdig daran ist nicht die Reaktion selbst. Merkwürdig ist, wie automatisch das immer noch läuft."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht begeistere ich mich deshalb an Filmen wie Limitless, Lucy, 2001 und Oppenheimer. Nicht wegen Bewusstsein oder Intelligenz als großer Idee, sondern weil sie Zustände zeigen, in denen man nicht sofort einknickt, in denen nicht gleich wieder die Angst übernimmt. Für jemanden, der im falschen Moment kleiner wird, ist das nicht neutral."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Bei Limitless zieht mich nicht das Kluge an, sondern dieses plötzliche Greifen. Dinge rasten ein. Gedanken brechen nicht dauernd ab. Gespräche tragen. Zwischen Wahrnehmung und Handlung sitzt auf einmal nicht mehr ständig Reibung. Darin steckt die Fantasie, endlich nicht mehr gehemmt zu sein, nicht dauernd zu spät bei sich selbst anzukommen. Auch nicht sozial. Nicht dieses stockende Halbsprechen, nicht dieses Nachkorrigieren, wenn der Moment schon vorbei ist."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Lucy geht weiter, und genau deshalb kippt es dort. Nicht nur Präzision, sondern Entgrenzung. Angst, Schmerz, Begehren verlieren Gewicht, die Welt wird lesbar, fast verfügbar. Die Szene im Auto ist dafür fast zu deutlich. Es wirkt wie Freiheit, aber in einem kalten Sinn, als wäre Rücksicht nur noch etwas für Wesen, die noch im gewöhnlichen Maß festsitzen. Genau das macht den Film so verführerisch: nicht mehr so gebunden sein, nicht mehr so verletzlich, nicht mehr so abhängig davon, was andere fühlen, wollen, übelnehmen. Das ist keine wirkliche Freiheit."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "2001 interessiert mich nicht wegen des Fremden selbst. Es ist die Erleichterung, einmal aus dem sozialen Maß des Menschlichen herauszukommen. Bowman wird am Ende nicht größer, er wird klein, fast weg, aufgelöst in etwas, das keine Gespräche mehr tragen, keine Nähe mehr aushalten, keine Folgen mehr verhandeln muss. Dagegen wirken Pille und Superkapazität fast wie Kindertricks. Vielleicht steckt genau darin der Sog: dass Bewusstsein einen einmal nicht mehr zurück ins Leben schickt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und Oppenheimer zieht in die Gegenrichtung. Da bleibt Denken nicht im Kopf. Es schlägt in die Welt ein. Es hält, es reicht weit, es bekommt Gewicht. Das zieht mich an, weil es das Gegenteil von Rauschen ist. Etwas setzen, das bleibt. Und auch da ist wieder die Gefahr: Man kann sich im Denken so verlieren, dass alles andere kurz nur noch Hintergrund ist."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Erst zusammen werden die vier interessant, weil sie sich kaputtmachen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Limitless wirkt neben Lucy plötzlich klein. Lucy wirkt dann schon überzogen. Und 2001 macht beides egal. Oppenheimer holt dich wieder runter."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Trotzdem hängen sie an derselben Stelle. Und ein Teil von mir hält daran fest, als könnte es mich aus allem rausziehen. Dass es endlich leichter wird. Dass ich nicht dauernd so reagieren muss. Dass es einen Zustand gibt, in dem man sieht und handelt, ohne sofort wieder von Scham, Angst und Anpassung gesteuert zu werden."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Bei mir ist das nicht nur Filmzeug. In der Schule war immer das Nächste das Ziel: die nächste Prüfung, die nächste Klasse, der nächste Abschluss. Dazwischen viel Rauschen. Lebendig wurde es selten, eigentlich nur da, wo etwas ausprobiert wurde, wo Reibung war, wo etwas noch nicht fertig war. Irgendwann fiel die Ohnmacht gar nicht mehr auf. Sie war einfach normal."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht hängen die Filme auch deshalb so fest. Sie sind Gegenbilder zu einem Leben, in dem das Eigene leicht untergeht, unter Zielen, die nicht die eigenen sind, unter Spannung, unter diesem Reflex, sich lieber kleinzumachen, bevor überhaupt klar ist, was los ist. Ich mag diese Filme nicht nur, weil sie etwas treffen. Ich benutze sie auch, nicht vor der Wirklichkeit überhaupt, sondern vor der Zumutung, in ihr wirklich etwas Eigenes zu riskieren."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es geht nicht um Schärfe. Es geht darum, dass es aufhört. Dass zwischen einer fremden Regung und meinem inneren Einknicken einmal etwas anderes tritt als Angst. Kein Größenrausch. Keine Souveränität. Nur ein kleiner Aufschub, in dem ich nicht schon wieder von mir wegrücke."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Genau deshalb sind diese Bilder für mich nicht harmlos. Sie versprechen nicht nur Kraft. Sie versprechen, dass ich nicht mehr so erreichbar bin. Für Stimmung. Für Erwartung. Für möglichen Vorwurf. Nicht mehr schon halb schuldig, bevor überhaupt etwas gesagt wurde."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und genau da kippt es. Dann will ich nicht nur handlungsfähiger werden. Ich will raus aus der Zone, in der ich mich zeigen, antworten, mich irren und trotzdem bleiben muss."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wahr ist der Wunsch, nicht dauernd unter fremde Spannung zu geraten. Das andere ist der Wunsch, das zu lösen, ohne wirklich in Erscheinung treten zu müssen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich verstehe diese Wünsche: Handlungsfähigkeit, Unverletzbarkeit, raus aus dem menschlichen Maß, dass Denken nicht nur im Kopf bleibt. Ich will Teile davon selbst. Aber das mit dem Unberührbarwerden stimmt nicht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Die Versuchung ist nicht weg. Aber sie ist nicht mehr unschuldig."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich nehme sie, um nicht fühlen zu müssen, was eine wirkliche Veränderung kosten würde."]]}]}], "vermerk": ""}]}];
