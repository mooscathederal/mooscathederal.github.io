<script>
const SEITE = {"zurueck": "index.html", "letztes": {"titel": "Kohärenzpflicht", "href": "koharenzpflicht.html"}, "naechstes": {"titel": "Schmunzeln.", "href": "schmunzeln.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "Sicherheitsfrömmigkeit", "unter": "Sicherheit wirkt harmlos, bis man merkt, wie viel Lebendigkeit man ihr längst geopfert hat.", "datum": "2026-03-04", "anzeige": "03.03.26", "form": "Prosa", "zeilen": true, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "", "titel": "", "zeilen": true, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Antwort bis spätestens Freitag. Es is Donnerstagabend."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Firefox in Vollbild mit offenem Email Browser. Betreff: Re: Bewerbung."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Zwei Sätze reichen. Ja, ich komme. Nein, ich komme nicht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich lese meinen Entwurf zum fünften Mal. Er hat sich die letzten 4 mal nicht verändert."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Mein Bauch flau. Kribbelig. Statt Angst. Wahrscheinlich Endgültigkeit."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wenn ich auf absenden drücke, schließ sich eine Tür. Das Nichtantworten hat noch nicht entschieden. Bis Freitag"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Hier solle es unanständig sein: eine Tür schließen. Einen Anfang setzen, hinter den man nicht mehr zurückkann."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vorsicht. Professionalität. Risikoabwägung. Verantwortungsbewusstsein. Weitsichtigkeit."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es ist Sicherheitsfrömmigkeit."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Sicherheitsfrömmigkeit ist die Moral einer Ordnung, die nichts mehr verlieren will. Ihre Angst zeigt, wie fragil sie geworden ist."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Sie hat gelernt, dass Abweichung Kaskaden auslöst. Shitstorm. Kündigung. Ausschluss. Förderstopps. Eine unbeantwortete Nachricht. Eine Einladung, die ausbleibt. ... \"Algorithmische Unsichtbarkeit\"."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Eine Einladung bleibt aus. War da etwas? Du denkst an deinen letzten Satz. Beim nächsten Mal lässt du ihn weg."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Was bleibt is Prüfung. Auch wenn sie nichts mehr findet. Irgendwann fragt keiner mehr nach ihrem Zweck. Wer sie auslässt, muss sich erklären."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Reformen, Pilotphasen, Umstrukturierungen... Verändert wird dauernd"]]}, {"f": 0, "r": [["n", "Wer den Anfang verantwortet, wird selten genannt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Da is niemand der mir über die Schulter schauen könnte. Die Mail liegt fertig vor mir. Ich lese die Mail noch einmal. Suche nach dem einen vorentschieden Grund, sie nicht abzuschicken."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Der Fehler liegt tiefer als der brave Satz, und wie ich finde besonders elegante Satz: \"Sicherheit töte Innovation\". Den eigentliche Schaden seh ich in Selektion."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es steigen die Reibungsfreien: Menschen, die vor jedem Beginn ihre Fluchtwege markieren und deren Sätze selten einen Preis haben."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Einer schlägt ein Versuch vor. Jemand verlangt eine weitere Abstimmung. Der Termin verstreicht. Beim nächsten Treffen steht der Vorschlag wieder in der Tagesordnung."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Einer scheitert. Sein Name bleibt am Fehler kleben. Was er dabei herausgefunden hat, nutzen später andere. Ohne seinen Namen zu kennen. Ob sein Versuch falsch war oder nur misslang, hat noch niemand gefragt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Manche Irrtümer zeigen sich erst, wenn jemand handelt. Bleibt der Versuch aus, fehlt auch die Erfahrung, die ihn hätte widerlegen können."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Du schreibst eine Mail. Der andere fragt: Gilt das jetzt? Du sagst: Im Prinzip. Er wartet noch eine Weile. Dann fragt er jemand anderen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Du erfährst nichts davon. Die Entscheidung liegt weiter vor dir. Irgendwann kostet schon der Gedanke daran Kraft."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Die Tage vergehen. Was noch offen scheint, hat sich anderswo längst entschieden."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Was du vermieden hast, lässt sich benennen. Was dir entgangen ist, erfährst du selten. Keine Nachricht von dem Menschen, dem du nie geschrieben hast."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es braucht Startrecht. Räume für Versuche, deren Ausgang offen bleiben. Auch für Fehler, die Name tragen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wer darf beginnen, wenn andere die Folgen tragen? Und wer entscheidet darüber, bevor jemand begonnen hat?"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Je mehr eine Ordnung Stabilität zum obersten Gut macht, desto aggressiver wird sie gegen Anfänge."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ein Startrecht müsste auch dort gelten, wo der Ausgang ungewiss bleibt. Seine Grenzen zeigen sich spätestens, wo andere die Folgen tragen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich schaue wieder auf die Mail. Punkt dreiundzwanzig Uhr dreißig. Freitag ist hier das Schweigen eine Antwort."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Kein Plan, der alles abfängt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Abgesendet."]]}, {"f": 0, "r": [["n", "Und.."]]}]}], "vermerk": "überarbeitet am 21.10.2026"}]}];
