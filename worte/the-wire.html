const SEITE = {"zurueck": "index.html", "letztes": {"titel": "Die Tru(e)man Show", "href": "die-trueman-show.html"}, "naechstes": {"titel": "f*ck society", "href": "fck-society.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "The Wire", "unter": "In The Wire sind die Räume längst so gebaut, dass aus Schwäche Betrieb wird.", "datum": "2026-03-03", "anzeige": "14.02.26", "form": "Prosa", "zeilen": true, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "10.26", "titel": "", "zeilen": true, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht sind wir technisch tatsächlich erwachsen. Netze, die Kontinente verbinden, Maschinen, schneller als jedes Nervensystem."]]}, {"f": 0, "r": [["n", "Und doch reicht ein Kommentar, und es kippt. Manchmal nur ein Widerspruch. Dann stehen wir da wie Stämme, nicht wie Bürger."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Geräte in der Hand, die mehr Macht bündeln als frühere Imperien, und in der Brust Angst vor Ausschluss, Hunger nach Zugehörigkeit, diese feine Allergie gegen Rangverlust."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich merke es bei mir: wie schnell ich recht haben will, wie leise sich Kränkung als Moral verkleidet und Zugehörigkeit sich anfühlt wie Wahrheit."]]}]}, {"t": "luecke", "h": 30}, {"t": "p", "z": [{"f": 0, "r": [["n", "Neulich im Supermarkt. Müde. Dünnhäutig."]]}, {"f": 0, "r": [["n", "An der Kasse drängelt sich einer vor, als wäre es selbstverständlich. In mir geht sofort ein kleiner Richter an, geschniegelt und bereit."]]}, {"f": 0, "r": [["n", "Ich sage nichts. Innerlich stelle ich ihn an die Wand und spüre dabei, wie mein Kiefer hart wird."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es geht nicht um zwei Minuten. Es geht um Rang."]]}, {"f": 0, "r": [["n", "Er hat mich klein gemacht, so fühlt es sich an. Wie schnell ich daraus eine Weltfrage mache, ist fast peinlich."]]}, {"f": 0, "r": [["n", "Ich will einfach nicht übergangen werden. Punkt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht, weil Macht ein uraltes Versprechen berührt. Sicherheit, Bedeutung, Überlegenheit."]]}, {"f": 0, "r": [["n", "Klingt hässlich. Ich glaub es trotzdem."]]}]}, {"t": "luecke", "h": 30}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht ist das System nicht gegen uns. Nur nicht für unser seelisches Gleichgewicht gebaut. Es belohnt Geschwindigkeit, Reaktion, Positionierung. Reife ist langsam und still. Niemand klatscht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Manche Tage fühlt sich die Welt persönlich an. Als würde sie bewerten, sortieren, verwerten. Als wäre man eine Zahl mit Haut."]]}, {"f": 0, "r": [["n", "Vielleicht ist sie nur gleichgültig: Effizienz statt Würde, Reichweite statt Beziehung, Funktion vorn, das Gefühl irgendwann hinterher."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wir versuchen, darin weich zu bleiben."]]}, {"f": 0, "r": [["n", "Manchmal gelingt es. Oft nicht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Manche haben darin eine Rolle gefunden und verteidigen das System. Wahrscheinlich klammere auch ich mich an Strukturen, die mich erschöpfen, weil sie Identität geben."]]}, {"f": 0, "r": [["n", "„Ich bin jemand“ fühlt sich besser an als „ich bin unsicher“."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich rede mir das schön. So eine saubere Selbstkritik, fast schon brav."]]}, {"f": 0, "r": [["n", "Dabei ist es einfacher. Ich will Applaus. Ich will Recht. Und ich will nicht, dass jemand sieht, wie dünn die Haut gerade ist."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Bequemer wäre: die da oben, die Technik, die Politik."]]}, {"f": 0, "r": [["n", "Wenn ich ehrlich bin, beginnt es kleiner. Im Wunsch, gesehen zu werden. Im Impuls, zu dominieren statt zu verstehen. Im Reflex, mich zu erklären, damit ich dazugehören darf."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wie viel Unreife führen wir den Systemen täglich zu? Wie viel Hunger, wie viel Angst, wie viel „ich muss gewinnen“?"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht beginnt Reife nicht mit Kontrolle, sondern mit Verlangsamung. Mit dem Mut, nicht sofort zu reagieren. Nicht jeden Konflikt zu gewinnen. Und nicht jede Zugehörigkeit zu verteidigen, als wäre sie Leben und Tod."]]}]}, {"t": "luecke", "h": 30}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich weiß nicht, ob wir zu spät sind. Vielleicht sind wir nur früh."]]}, {"f": 0, "r": [["n", "Früh in einer Epoche, in der unsere Werkzeuge größer sind als unsere Selbstkenntnis."]]}, {"f": 0, "r": [["n", "Mit leicht zitternder Hand."]]}]}], "vermerk": "überarbeitet am 06.10.2026"}, {"name": "02.26", "titel": "", "zeilen": true, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht sind wir technisch tatsächlich erwachsen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wir bauen Netze, die Kontinente verbinden."]]}, {"f": 0, "r": [["n", "Maschinen, die schneller rechnen als jedes Nervensystem."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und doch reicht ein Kommentar, und es kippt."]]}, {"f": 0, "r": [["n", "Manchmal nur ein Widerspruch. Und plötzlich stehen wir da."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nicht wie Bürger."]]}, {"f": 0, "r": [["n", "Wie Stämme."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wir halten Geräte in der Hand, die mehr Macht bündeln als frühere Imperien."]]}, {"f": 0, "r": [["n", "Und trotzdem schlägt in der Brust noch dieses alte Herz:"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Angst vor Ausschluss."]]}, {"f": 0, "r": [["n", "Hunger nach Zugehörigkeit."]]}, {"f": 0, "r": [["n", "Diese feine Allergie gegen Rangverlust."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wir haben die Werkzeuge beschleunigt."]]}, {"f": 0, "r": [["n", "Nicht das Bewusstsein."]]}, {"f": 0, "r": [["n", "Nicht aus Bosheit."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Zeitversatz."]]}, {"f": 0, "r": [["n", "Evolution ist langsam."]]}, {"f": 0, "r": [["n", "Reichweite wächst exponentiell."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich merke es bei mir."]]}, {"f": 0, "r": [["n", "Wie schnell ich recht haben will."]]}, {"f": 0, "r": [["n", "Wie leise sich Kränkung als Moral verkleidet."]]}, {"f": 0, "r": [["n", "Wie Zugehörigkeit sich anfühlt wie Wahrheit, als wäre das dasselbe."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Neulich im Supermarkt:"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "müde, dünnhäutig."]]}, {"f": 0, "r": [["n", "Vor mir an der Kasse ein Typ, der sich vordrängelt."]]}, {"f": 0, "r": [["n", "Ganz selbstverständlich, als wäre es sein Privileg."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "In mir geht sofort ein kleiner Richter an, geschniegelt und bereit."]]}, {"f": 0, "r": [["n", "Ich sage nichts, aber ich stelle ihn innerlich an die Wand."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich spüre, wie mein Kiefer hart wird."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und ich merke: Es geht nicht um zwei Minuten. Es geht um Rang."]]}, {"f": 0, "r": [["n", "Er hat mich gerade klein gemacht. So fühlt es sich an."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wie schnell ich daraus eine Weltfrage mache, ist fast peinlich."]]}, {"f": 0, "r": [["n", "Ich will einfach nicht übergangen werden. Punkt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Der Kern ist banal und brutal:"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nicht Technologie ist das Problem."]]}, {"f": 0, "r": [["n", "Sondern unreife Psyche bei unbegrenzter Verstärkung."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wir haben Maschinen gebaut, die rechnen können."]]}, {"f": 0, "r": [["n", "Aber keine Kultur, die Macht tragen kann, ohne sich daran zu berauschen."]]}, {"f": 0, "r": [["n", "Oder sich daran zu zerreiben."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht, weil Macht ein uraltes Versprechen berührt:"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Sicherheit."]]}, {"f": 0, "r": [["n", "Bedeutung."]]}, {"f": 0, "r": [["n", "Überlegenheit."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das klingt hässlich. Ich glaube es trotzdem."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und vielleicht ist das System nicht gegen uns."]]}, {"f": 0, "r": [["n", "Es ist nur nicht für unser seelisches Gleichgewicht gebaut."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es belohnt Geschwindigkeit."]]}, {"f": 0, "r": [["n", "Reaktion."]]}, {"f": 0, "r": [["n", "Positionierung."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Innere Reife dagegen ist langsam."]]}, {"f": 0, "r": [["n", "Still."]]}, {"f": 0, "r": [["n", "Und niemand klatscht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es gibt Tage, da fühlt sich die Welt persönlich an."]]}, {"f": 0, "r": [["n", "Als würde sie bewerten, sortieren, verwerten."]]}, {"f": 0, "r": [["n", "Als wäre man eine Zahl mit Haut."]]}, {"f": 0, "r": [["n", "Aber vielleicht ist sie gar nicht persönlich."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nur gleichgültig in ihrer Logik:"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Effizienz statt Würde."]]}, {"f": 0, "r": [["n", "Reichweite statt Beziehung."]]}, {"f": 0, "r": [["n", "Funktion, und das Gefühl irgendwo hinterher."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und wir?"]]}, {"f": 0, "r": [["n", "Wir versuchen in dieser Architektur weich zu bleiben."]]}, {"f": 0, "r": [["n", "Manchmal gelingt es. Oft nicht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht verteidigen manche das System nicht, weil es gut ist."]]}, {"f": 0, "r": [["n", "Sondern weil sie darin eine Rolle gefunden haben."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht klammere auch ich mich an Strukturen,"]]}, {"f": 0, "r": [["n", "die mich erschöpfen,"]]}, {"f": 0, "r": [["n", "weil sie mir Identität geben."]]}, {"f": 0, "r": [["n", "Weil „ich bin jemand” sich besser anfühlt als „ich bin unsicher”."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und trotzdem: Ich rede mir das manchmal schön."]]}, {"f": 0, "r": [["n", "So eine saubere Selbstkritik, fast schon brav."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dabei ist es oft einfacher:"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich will Applaus."]]}, {"f": 0, "r": [["n", "Ich will Recht."]]}, {"f": 0, "r": [["n", "Ich will nicht, dass jemand sieht, wie dünn die Haut gerade ist."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es wäre bequemer zu sagen:"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Die da oben."]]}, {"f": 0, "r": [["n", "Die Technik."]]}, {"f": 0, "r": [["n", "Die Politik."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Aber wenn ich ehrlich bin, beginnt es kleiner."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Im Wunsch, gesehen zu werden."]]}, {"f": 0, "r": [["n", "Im Impuls, zu dominieren statt zu verstehen."]]}, {"f": 0, "r": [["n", "Im Reflex, mich zu erklären, damit ich dazugehören darf."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Erwachsensein ist nicht technischer Fortschritt."]]}, {"f": 0, "r": [["n", "Sondern die Fähigkeit, Macht zu tragen, ohne sie gegen andere zu richten."]]}, {"f": 0, "r": [["n", "Oder gegen sich selbst."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht ist die eigentliche Frage nicht,"]]}, {"f": 0, "r": [["n", "wie wir Systeme verändern."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Sondern wie viel Unreife wir ihnen täglich zuführen."]]}, {"f": 0, "r": [["n", "Wie viel Hunger. Wie viel Angst. Wie viel „ich muss gewinnen”."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich weiß nicht, ob wir zu spät sind."]]}, {"f": 0, "r": [["n", "Vielleicht sind wir nur früh."]]}, {"f": 0, "r": [["n", "Früh in einer Epoche,"]]}, {"f": 0, "r": [["n", "in der unsere Werkzeuge größer sind als unsere Selbstkenntnis."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Kein Urteil."]]}, {"f": 0, "r": [["n", "Demut."]]}, {"f": 0, "r": [["n", "Mit leicht zitternder Hand."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht beginnt Reife nicht mit Kontrolle,"]]}, {"f": 0, "r": [["n", "sondern mit Verlangsamung."]]}, {"f": 0, "r": [["n", "Mit dem Mut, nicht sofort zu reagieren."]]}, {"f": 0, "r": [["n", "Nicht jeden Konflikt zu gewinnen."]]}, {"f": 0, "r": [["n", "Nicht jede Zugehörigkeit zu verteidigen, als wäre sie Leben und Tod."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Die leiseste Form von Fortschritt:"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wenn Reichweite wächst,"]]}, {"f": 0, "r": [["n", "und das Ego nicht mitwächst."]]}]}], "vermerk": ""}]}];
