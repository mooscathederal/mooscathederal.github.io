const SEITE = {"zurueck": "index.html", "letztes": {"titel": "Henne oder Ei?", "href": "henne-oder-ei.html"}, "naechstes": {"titel": "Rotstift.", "href": "rotstift.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "Alter Ego", "unter": "Warum Lesbarkeit nicht dasselbe ist wie Wirklichkeit.", "datum": "2026-03-22", "anzeige": "22.03.26", "form": "Prosa", "zeilen": false, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "", "titel": "", "zeilen": false, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Es ist weniger Identität als Couch mit Staubschutz: etwas, worin ich hänge, wohne, mich bewege, ohne dass es je ganz nach mir aussieht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Am Strand reicht Sand. Mehr braucht es gar nicht. Eine Hand voll. Kurzhalten. Dann läuft er schon. Zwischen den Fingern weg. Und sobald ich länger hinsehe, ist es nicht mehr einfach Sand. Die Größe kippt. Nicht feierlich, nicht kosmisch im großen Ton: Auf einmal steht alles anders zueinander. Für einen Moment ist nichts mehr nur das, was es eben noch war."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "So läuft das oft auch in mir. Ich denke lange, ich will verstehen. Das stimmt. Aber nicht nur. Ich will nicht blind reinlaufen. Ich will vorher merken, wo es eng wird. Wo etwas kippt. Was gleich von mir will. Wissen gibt mir etwas in die Hand."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wenn ich früh merke, wie ein Raum läuft, stehe ich nicht ganz offen da. Ich merke schneller, was besser nicht gesagt wird, wo Reibung droht, was sie kostet, wen sie trifft, wie man sich hinstellt, ohne gleich irgendwo anzustoßen. So kommt man rüber. So kommt man rein. Manchmal sogar nah genug. Und man muss nicht gleich mit dem Eigenen nach vorne. Nicht gleich zeigen, was man will, was man braucht, woran man hängt. Die Angst wird dann nicht kleiner, weil sie schrumpft. Sie verschwindet unter einer Decke aus Rauschen. Es funktioniert. Das ist das Problem."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich merke oft früh, was los ist, und viel später, was es mit mir macht. Selten steht da ein großer Preis plötzlich vor mir. Meist läuft etwas schon die ganze Zeit mit. Wie Kosten, die immer schon abgehen. Ich rede dann schon. Ich nicke schon. Ich bin schon in einer Reaktion, während in mir noch gar nichts nachgekommen ist. Oder nur sehr leise. Manchmal merke ich erst hinterher, dass ich zwar da war, aber nicht wirklich. Dass etwas von mir schon vorher runtergedrückt wurde, damit es nicht stört. Nicht auffällt. Nicht querliegt. Damit der Kontakt nicht kippt. Damit ich drinbleibe."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es ist nicht so, dass das Eigene fehlt. Ich schiebe es weg. Oft ziemlich früh. Fast automatisch. Erst mal zur Seite. Später kann man ja immer noch schauen. Später ist nur oft zu spät. Dann bin ich schon im Gespräch, schon im Ton, schon in einer Zustimmung, die in mir noch gar keinen Boden hat. Von außen läuft das glatt. Innen komme ich nicht hinterher. Oft reicht es, dass ich passe. Ob ich wirklich da bin, ist dann fast nebensächlich. Ich bin schon im Kontakt, bevor ich bei mir bin. Innen ist es oft bloß ein Durcheinander, das nach außen halbwegs hält."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Von außen wirkt das beweglich. Innen ist es oft nur schnelles Nachgeben. Ich komme durch Situationen, aber ich nehme aus vielem zu wenig mit. Es ist mehr als Erschöpfung: Ich treffe mich selbst in dem, was ich tue, nicht ganz. Ich bin schneller bei der Lage als bei mir. Schneller im Einschätzen als im Dasein. Es hilft. Man muss weniger offen bitten. Weniger offen wollen. Weniger offen hoffen. Man steht nicht ganz so schutzlos da. Aber genau dort wird es schief. Ich halte mich fest und verliere dabei den Stand."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Irgendwann wird das müde. Nicht dramatisch, stumpf. Das viele Einordnen macht Abstand. Die Schärfe kippt und wird kalt an den Rändern. Wie eine dünne Haut gegen zu viel. Wenn ich mich lange so halte, fehlt mir irgendwann der Mut für Momente ohne Geländer. Einfach da sein. Ohne vorher schon alles gelesen zu haben. Ohne inneren Vorsprung. Ohne diese kleine halbe Sicherheit."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und trotzdem bleibt darunter etwas sehr Einfaches. Der Wunsch, da sein zu dürfen, ohne erst alles richtig lesen zu müssen. Ohne mich vorher passend zu machen. Ohne das Eigene schon wieder zu sortieren, bevor es überhaupt da sein darf."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Am Steg ist das für ein paar Sekunden anders. Eine Ente springt auf den Pier, läuft ein Stück, bleibt stehen, schaut sich um, geht zurück ins Wasser. Mehr nicht. Aber auf einmal ist sie nicht einfach Kulisse. Nicht nur etwas, das ich registriere. Sie ist da. Eigen. Für sich. Und ich merke daran nebenbei, wie schnell ich sonst alles in etwas verwandle, das ich lesen, einordnen, benutzen kann. Als wäre das Gelesene schon das Wirkliche. Ist es nicht. Etwas handhaben können ist noch lange nicht dasselbe wie es wirklich sehen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht liegt es weniger daran, dass die Welt zu groß ist, als daran, dass ich vom Verstehen zu viel verlange. Es soll mich halten und mich nicht so offen dastehen lassen. Und natürlich kann es das eine Weile. Sonst würde ich mich nicht so daran hängen. Aber es trägt nicht bis dorthin, wo ich eigentlich hinwill."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Man kann damit durchkommen. Nur ankommen nicht."]]}]}], "vermerk": ""}]}];
