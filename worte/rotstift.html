<script>
const SEITE = {"zurueck": "index.html", "letztes": {"titel": "Alter Ego", "href": "alter-ego.html"}, "naechstes": {"titel": "Tapetentau", "href": "tapetentau.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "Rotstift.", "unter": "Absichtlich unmöglich", "datum": "2026-03-25", "anzeige": "25.03.26", "form": "Prosa", "zeilen": true, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "", "titel": "", "zeilen": true, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "In der 2. Klasse sollten wir aus drei Begriffen eine Geschichte schreiben. Geist, Dachboden, Truhe. Die Begriffe weiß ich noch. Den Fehler auch. Der Hauptcharakter fällt die Treppe runter, obwohl er schon zwei oder drei Schritte von ihr weg ist. Ich habe das absichtlich so geschrieben."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es ging nicht darum zu Versehen und ich hatte auch keine Lust daran, etwas falsch zu machen. Ich wollte etwas prüfen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Damals hätte ich das nicht so sagen können. Ich wusste nur, dass ich sehen wollte, ob es auffällt. Aber es ging um mehr. Darum, worauf überhaupt reagiert wird. Ob jemand merkt, dass da etwas nicht stimmt. Ob mich jemand korrigiert. Ob mehr zurückkommt als bloß Korrektur. Ob da irgendwo eine Antwort ist."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Die rote Schrift steht bis heute in meinem Kopf. Rechts neben dem Absatz. "], ["i", "Wie soll das gehen?"], ["n", " Dazu die Erklärung des Fehlers. Sachlich. Richtig. Es fiel auf. Es wurde markiert."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und trotzdem war ich niedergeschlagen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es hatte auf eine blöde Art funktioniert und zugleich nicht funktioniert. Der Fehler wurde gesehen. Die Korrektur war richtig. Aber das, worum es mir eigentlich ging, blieb offen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und das kenne ich bis heute. Du weißt, dass etwas nicht stimmt, aber du kommst nicht ran. Zu vernebelt, zu früh schon festgelegt. Zu schnell unter einem Urteil. Oder du kommst dran und merkst, dass die Sache schon entschieden ist, bevor du sie überhaupt richtig suchen konntest. Dann bleibt etwas, das ich spür, aber nicht aufkriegt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Der Moment war kurz. Vielleicht sitzt er gerade deshalb noch fest. Da ist ein Fehler. Eine Reaktion. Und trotzdem geht es mit dem Fehler allein nicht auf. Die Bewegung in der Geschichte sollte gar nicht logisch sein. Ich wollte wissen, was passiert, wenn sie es nicht ist."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ob das, worin ich damals war, mehr sehen konnte als nur den Fehler."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es konnte es nicht. Jedenfalls nicht dort."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Eine Reaktion kam ja. Und sie ging an der Frage vorbei. Die Korrektur hatte recht. Sie sitzt noch immer an derselben Stelle wie damals. Sie war richtig und ging trotzdem vorbei."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich hatte, glaube ich, schon früh das Gefühl, dass vieles entschieden ist, bevor man selbst überhaupt richtig vorkommt. Keine große Welterklärung. Einfach so. Als liefe die Welt vor mir her und ich käme immer erst kurz darauf nach. Wie ein kleiner Bildfehler. Das Bewusstsein schon einen Tick weiter, die Wahrnehmung noch nicht ganz nachgekommen. Der Rahmen steht schon. Er weiß schon, was als Fehler gilt. Worauf geantwortet wird. Was relevant ist. Ohne dass ich den Inhalt davon schon gekannt hätte."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Zu Hause war das ähnlich genug, dass es für mich nicht ganz getrennt war. Es gab Ordnung, Abläufe, Vorgaben. Nicht unbedingt hart. Aber eng."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es ging mir auch außerhalb des Klassenzimmers so. In der Nachmittagsbetreuung, in Pausen, später draußen mit Freunden oder Nachbarn. Nicht dramatisch. Nur oft ähnlich genug, dass etwas bleibt. Dass da etwas in einem ist und trotzdem nicht richtig auftaucht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Größe war dabei nicht das Entscheidende. Ich wollte nicht nur als Verhalten, Rolle oder Oberfläche vorkommen. Nicht bloß ein Name auf der Klassenliste sein. Oder wenigstens das Gefühl haben, dass mehr ankommt als bloß Form."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Weder frontal noch offen. Seitlich. Etwas leicht verschieben und schauen, worauf angesprungen wird. Wenn du das Eigentliche nicht direkt sagen kannst, prüfst du an den Rändern."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich stelle etwas in den Raum und suche nicht nur, ob es stimmt, sondern welcher Teil greift, was bleibt und was trägt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das ist meist weniger Gedanke als Körpergefühl: ein Kribbeln, eine Enge, ein Druck, der schon da ist, bevor ich ihn in Worte bekomme. Ungeordnet. Aber da."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich setze etwas. Eine kleine Schieflage. Dann kommt eine Reaktion, sauber genug, folgerichtig genug, und ich merke trotzdem: Das wars noch nicht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["i", "Wie soll das gehen?"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ja. Genau. Aber nicht auf die Frage, die ich eigentlich gestellt hatte."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Später war das nicht weg. Im Sportunterricht zum Beispiel. Meine Mitfahrgelegenheit wollte der Sportlehrerin klarmachen, dass wir früher wegmüssen. Es ging um eine Ausrede. Das Wort "], ["i", "Notlüge"], ["n", " fiel. Den genauen Satz weiß ich nicht mehr. Geblieben ist der Ton. So ein Ton, der kurz Erleichterung gibt und sie im selben Zug wieder einsammelt. Als dürfe man das im Notfall tun, aber bitte nicht zu ruhig dabei werden."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich war verwirrt. Der Inhalt war nur ein Teil davon. Entscheidend war diese schnelle Verschiebung: wie etwas in eine Form gebracht wird, in der man damit weiterkann. Es war weder ganz falsch noch wirklich offen. Gerade so, dass es passt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Die Situation ging vorbei. Das Gefühl nicht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das war einer der ersten Momente, an die ich mich erinnern kann, dass etwas nicht erst weg ist, wenn es geleugnet wird. Es reicht oft schon, dass es so zugerichtet wird, dass es tragbar wird. Glatter. Weniger scharf. Etwas, mit dem man weitermachen kann."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es gibt ganze Phasen, in denen sich meine Gedanken um fast nichts anderes drehen. Mal mehr, mal weniger bewusst. Ich bin teils verzweifelt. Meist dann, wenn ich in einer Sackgasse lande und, so verbissen wie ich sein kann, weiter geradeaus will. Glaube ich. Lob oder Bewunderung sind dabei nicht das Entscheidende. Ich will einmal auf der richtigen Ebene ankommen. Eine Antwort bekommen, die nicht nur die Oberfläche abarbeitet. Die nicht schon feststeht, bevor sie kommt dabei etwas trifft und gerade das Entscheidende liegenlässt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Bewusst-Sein scheint mir oft Tortur. Dieses Kreisen und Nachsetzen, das Misstrauen gegen den ersten Satz. Er kann stimmen und trotzdem zu früh über etwas hinweggehen, das erst noch erreicht werden müsste."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann kippt es manchmal."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann wirkt es plötzlich, als trüge der ganze Rahmen nichts, und damit fast auch nicht mehr, was in ihm wahr oder unwahr ist."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ganz stimmt das auch wieder nicht. Aber der Satz kommt aus einer echten Stelle. Aus dem Moment, in dem alles so gebaut wirkt, dass es auf das Eigentliche gar nicht ankommen kann. Dann ist schnell alles verdächtig. Gerade wenn ich mich in einer Sackgasse wiederfinde. Ich spür, wohin sie führt. Weiter komme ich dort trotzdem nicht. Irgendetwas sucht weiter."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich versuche, die Stelle zu finden, an der eine Frage nicht wieder falsch beantwortet wird. Die Stelle, an der nicht bloß der Fehler markiert wird, sondern überhaupt lesbar wird, was da gefragt wurde."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Der Rotstift ist noch da. Wie dieser kurze Moment auf einer Stufe, in dem der Fehltritt schon im Körper steckt, aber der Sturz nicht kommt. Korrekt, präzise, unvollständig."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Eine kleine absichtliche Verschiebung, mit der ich sehen wollte, ob mehr gesehen wird als das Unmögliche selbst."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wahrscheinlich ist das mit ein Grund für mein Schreiben. Weniger aus dem Verlangen nach Recht als daraus, dass der Knoten noch da ist. Wie kommt man mit einer wirklichen Frage irgendwo an, ohne dass sie sofort bloß in richtig und falsch zerfällt. Wie finde ich eine Form, in der nicht wieder nur das Lesbare beantwortet wird."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wahrscheinlich liegt bis heute genau da das Problem. Noch vor der Frage nach Wahrheit. Ob der Raum überhaupt fähig ist, auf das Richtige zu antworten."]]}]}], "vermerk": "überarbeitet am 18.10.2026"}]}];
