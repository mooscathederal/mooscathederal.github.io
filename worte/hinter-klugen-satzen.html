<script>
const SEITE = {"zurueck": "index.html", "letztes": {"titel": "Identität", "href": "identitat.html"}, "naechstes": {"titel": "Wer hat dir das erlaubt?", "href": "wer-hat-dir-das-erlaubt.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "Hinter klugen Sätzen", "unter": "Ich mein ja nur...", "datum": "2026-03-13", "anzeige": "13.03.26", "form": "Prosa", "zeilen": false, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "10.26", "titel": "", "zeilen": false, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Manchmal reicht ein einziges Wort und ein ganzes altes Leben kippt in Lesbarkeit. Vorher Druck, Scham, Müdigkeit, dann: Kante. Ein Begriff. Und auf einmal hat das Diffuse Zähne. Im nächsten Gespräch wieder zu Anfang."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Was keine Adresse hat, läuft weiter. Im Hals. In Sätzen, die grammatisch stimmen und trotzdem etwas verfehlen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ein Blick kippt. Ein Satz bleibt halb offen. Ich spür etwas und komm nicht ran. Wenn Ruhe einkehrt und nix Vorwegnehmende mehr eintritt. Jahre später. Manchmal auch früher."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wir nennen Sprache Ausdruck. Als wäre die Sache längst geklärt und müsste nur noch hinaus. Was war vorher schon da? Druck? Erfahrung? Erinnerung? Erwartung? Auch ihre Form?"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht war der Druck da."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ein Wort fällt. Plötzlich passen Jahre zusammen. Auch die, an die man vorher anders dachte. Dann erzählt jemand dieselbe Geschichte anders."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Begriffe greifen ein. Was als Störung gilt, als Schuld zählt oder als Krankheit umläuft. Was überhaupt als Erfahrung anerkannt wird."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wenn ich es benennen kann, erinnere ich mich anders."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ob es schon vorher da war, muss ein Danach beurteilen, das es vorher nicht geben konnte."]]}]}], "vermerk": "überarbeitet am 16.11.2026"}, {"name": "03.26", "titel": "", "zeilen": false, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Etwas fällt in Momenten, in denen etwas da ist und trotzdem nicht hält. Ein Blick der kippt. Ein Satz bleibt halb offen. Im Raum liegt etwas ohne Griff. Ich spüre es schon und komme nicht ran."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Sprache allein als Ausdruck zu nehmen unterstellt, die Sache sei längst fertig und müsste nur noch hinaus. So ordentlich läuft es selten. Vieles wird erst fassbar, wenn Worte da sind, an denen es hängenbleiben kann."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Irgendwann habe ich gelernt, dass Wirklichkeit nicht sauber herumliegt. Begriffe ordnen mit, Kategorien greifen ein, Symbolsysteme ziehen Linien, lange bevor jemand behauptet, nur zu beschreiben. Sie bestimmen, was als Fall erscheint, was als Störung gilt, als Schuld zählt oder als Krankheit umläuft, was als Erfahrung anerkannt wird und was nur als Unruhe im Zimmer stehen bleibt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Manchmal reicht ein einziges Wort und ein ganzes altes Leben kippt in Lesbarkeit. Vorher war da nur Druck, Scham, Müdigkeit, falsches Ausweichen, immer dieselbe kleine Drehung im Gespräch. Dann kommt ein Begriff. Und auf einmal ist das diffuse Zeug nicht weg, aber es hat Zähne."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Sprache macht die Welt nicht. Aber ohne sie bleibt vieles bloß gedrängt, verstreut, schlecht aufgehoben, ohne Adresse."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Was keine Adresse hat, läuft weiter. Im Hals. In Formularen. In diesen Sätzen, die ich später über mich sage und ich sofort merke, dass etwas fehlt, obwohl grammatikalisch alles stimmt."]]}]}], "vermerk": ""}]}];
