<script>
const SEITE = {"zurueck": "index.html", "letztes": {"titel": "Popo-lismus", "href": "popo-lismus.html"}, "naechstes": {"titel": "Privilegien und Verantwortung", "href": "privilegien-und-verantwortung.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "warum ich nicht wegsehen kann.", "unter": "Zwischen beruhigter Gewalt und falschem Halt", "datum": "2026-03-29", "anzeige": "29.03.26", "form": "Prosa", "zeilen": false, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "", "titel": "", "zeilen": false, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Ich gehe fast jeden Tag an einem Werbeplakat der Bundeswehr vorbei."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das stimmt und gleichzeitig auch nicht. Denn es ist nie nur dieses eine. Dahinter brodelt die Form, in der mir täglich etwas begegnet, das sich hier nur zeigt und doch auf etwas in mir trifft, dass älter und schwerer ist als dieses Bild. Das Plakat ist nur die Stelle, an der es sichtbar genug wird, um meinen Körper zu treffen. Der Blick geht darüber, und noch bevor ein Gedanke sich schließt, setzt mein Bewusstsein für einen kleinen Moment aus. Weniger aus Angst oder Widerstand. Mehr die Berührung mit einem Versprechen, das so tief sitzt, dass es der Sprache einen Moment voraus ist."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das Bild selbst ist technisch sauber. Ein junger Mann in militärischem Gerät, Headset, Visier, sein Blick auf die Steuerung gerichtet. Halb im Bild eine Drohne. Kein Dreck, kein Lärm, keine Zerreißung. Kein Krieg, wie er wirklich ist. Sondern Krieg in einer Form, in der er wie ein lösbares Problem aussieht. Bedienbar. Präzise. Ferngehalten. Fast wie Arbeit an einem Interface. Das Plakat tarnt nichts im groben Sinn. Es macht etwas Schwierigeres. Es nimmt der Gewalt ihre Schwere und gibt sie als Funktion zurück."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Denn solche Bilder werben nicht bloß für Krieg. Krieg ist die äußerste Folge dessen, was sie versprechen. Geworben wird um die Erlösung vom Offenen. Darin liegt ihre Anziehung. Nicht im Befehl. Nicht im Lärm. Und nicht einmal in der Drohung. Sondern in der Ruhe, mit der Form hier als Antwort erscheint, noch bevor die Frage ganz gestellt ist. Du musst dich nicht mehr allein tragen. Du musst die Unschärfe nicht mehr selbst halten. Du musst die Ambivalenz nicht mehr in dir austragen. Gib dich hinein. Werde lesbar. Werde tragbar. Werde Teil."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich finde, dass hier sichtbar wird, worauf politische Form ihre Anziehung gründet. Große Ordnungen entstehen nicht nur, weil sie zwingen. Sie entstehen auch, weil sie das Offene schließen. Sie machen Komplexität tragbar, kürzen Wahl ab und nehmen dem Einzelnen die Zumutung, alles selbst entscheiden zu müssen. Weil sie die Mühe, sich selbst unabgeschlossen und dennoch wahr zu halten, in eine geteilte Form überführen. Darin liegt ihr Trost. Und ihre Gewalt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Deshalb haben mich Nationen und Imperien nie nur als Geschichte interessiert. Ich verstehe sie als Formen organisierter Übernahme. Sie übernehmen Angst, Richtungslosigkeit, Opferbereitschaft, Stolz, Sinn, Feind und Zugehörigkeit in eine gemeinsame Form. Solange das Getragene und das Abgenommene sich noch decken, erscheinen sie ordentlich. Doch wenn diese Deckung zerfällt und das Versprechen bleibt, beginnt ihr Charakter sichtbar zu werden. Dann lebt die Form weiter von einer Tragfähigkeit, die sie nicht mehr besitzt. Zugehörigkeit wird zur Verwaltung eines Mangels. Entlastung zur Methode. Verantwortung wandert nach oben, während unten nur noch ausgeführt, mitgetragen und geglaubt werden soll. Und Macht sieht oft nicht nach Zwang aus, sondern nach Beruhigung."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Darum bleibt es nicht nur politisch. Dieselbe Bewegung reicht tiefer, bis in die Stellen, an denen Menschen Halt suchen, Bindung eingehen und sich tragen lassen. Was Ordnungen im Großen tun, wiederholt sich im Kleinen. Beziehungen, Familien, Institutionen, Weltbilder, selbst Denkformen halten oft genau dadurch, dass sie einem etwas abnehmen, was man allein kaum tragen kann. Unsicherheit. Ambivalenz. Das Nicht-Garantierte. Die Zumutung innerer Freiheit. Genau deshalb ist die Grenze zwischen Halt und Verfügbarkeit so schmal. Form und Liebe, Ordnung und Schutz, Entlastung und Unterwerfung. Sie sprechen oft dieselbe erste Sprache."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es kommt mir so nah, weil diese Fragen bei mir nicht aufhören. Leben und Sinn. Macht und Ordnung. Das Chaos darunter. Dass alles kippen kann und man dennoch weiterlebt. Wo das nicht aufhört, wird Form nötig. Denken, Schreiben, Ordnen sind dann der Versuch, etwas zusammenzuhalten, das sonst auseinanderfällt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wahrscheinlich kommt es mir deshalb so schnell entgegen, weil es mich seit langem nicht freigibt. Weil es an der Stelle in mir rührt, die nach Sicherheit, Richtung, Schutz vor Ohnmacht und dem Gefühl verlangt, in Bewegungen hineingezogen zu werden, die längst laufen. Populismus. Geopolitik. Alte Geschichten, die neu geschrieben werden und mich fühlen lassen, bevor ich die Gelegenheit habe, es in Worte zu fassen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich bin in einem Klima aufgewachsen, in dem Form Erleichterung verspricht und gerade darin verschlingend werden kann. Erst brauchbar sein, dann Ruhe. Erst leisten, dann Sicherheit. Erst dich in eine Ordnung bringen, dann darfst du hoffen, nicht mehr ganz ausgesetzt zu sein. Solche Sätze müssen nie gesagt werden. Sie schreiben sich auch als Ton ein. Als Rhythmus. Als stilles Gesetz dessen, was einen trägt und was nicht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und so wuchs das Bedürfnis, dieses Klima zu begreifen. Nicht als Folge bloßer Neugier oder der Lust, alles in Frage zu stellen. Aus Selbsterhaltung. Wer nimmt hier wem was ab. Wer nennt Entlastung Vernunft. Wer lagert den Preis aus. Wer verwandelt Wirklichkeit in Verfahren. Wer schützt sich durch Struktur vor dem, was lebendig nicht kontrollierbar ist. Darin findet sich Erkenntnis. Aber darin findet sich auch eine Versuchung. Denn je schärfer das Bild wird, desto mehr drohte ich zu einer Form zu werden, die nichts mehr entlässt. Zu verstehen als ein Versuch, der Form zuvorzukommen, indem ich sie überall freilege, bevor sie mich binden kann."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Darin liegt keine Freiheit und auch kein Sieg. Es gibt einen Punkt, an dem Schärfe selbst zu einer Entlastungsform wird. Lieber durchdringen, als sich einem Halt auszusetzen, der einen verziehen könnte. So bewahrt sich das Selbst vor Vereinnahmung und sperrt sich zugleich in andauernde Gegenwärtigkeit ohne Ruhe."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Mein Widerstand richtet sich gegen die Form, in der mein Bedürfnis lesbar und verwertbar gemacht wird. Das Plakat ist technisch sauber. Doch hier wird Sauberkeit nicht zur Ästhetik, sondern zu einer Form der Entlastung. Einer Übersetzung, die sich nicht an Gewaltlust, sondern an Ohnmacht richtet. Deshalb trifft sie mich dort, wo ich Form will. Aber dabei verrät sie sich auch, denn sie nimmt mein Bedürfnis nach Ordnung auf und gibt es als Zuteilung einer fremden Ordnung zurück. So verkauft das Bild keine Sache, sondern einen Tausch. Aus Angst wird Anschluss, aus Ungewissheit Rolle, aus Eigenheit Brauchbarkeit. Lesbar wird man schnell. Lebendig bleibt man so nicht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Meine Frage liegt nicht in den alten Gegensätzen. Nicht in Ordnung oder Chaos, Staat oder Freiheit, Bindung oder Autonomie. Sie liegt dahinter. Welche Form trägt, ohne Lebendigkeit gegen Ruhe einzutauschen. Welche Zugehörigkeit nimmt auf, ohne in Verwaltung zu kippen. Welche Wahrheit hält, ohne sich durch Reduktion zu stabilisieren. Dort sehe ich die Knackstellen großer Ordnung. Zunächst weniger als Konflikt. Eher dort, wo Form an die Stelle von Wirklichkeit tritt und die Erleichterung, die sie mitbringt, mehr zählt als die Wahrheit, die sie kostet."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich denke nicht, dass die Plakate das offen zur Schau stellen. Sondern vielmehr die beruhigte Stelle davor. Und ich denke, dass es deshalb so genau trifft. Es verspricht Halt, aber nur als Einpassung. Es bietet Zugehörigkeit, Sicherheit und Richtung in einer Form an, die verlangt, dass man sich einer fremden Logik verfügbar macht. Die Welt wird vorsortiert, die Wahl verkürzt, der Zweifel beruhigt. Das ist die andere Seite des Ufers. Gerade deshalb bleibt es für mich die verbotene Frucht. Ich will, was dort versprochen wird. Eindeutigkeit. Zugehörigkeit. Sicherheit. Einen Platz. Aber ich will meine Seele dafür nicht verkaufen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Für einen Moment kann ich die Ruhe darin fast mitatmen. Gerade das macht mir Angst. Denn die Verführung ist real, und die Ablehnung auch."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Mein eigentliches Thema war nie nur Macht. Es ist auch Halt. Halt, der nicht auf Kosten von Wirklichkeit geht. Zugehörigkeit, die nicht mit Selbstverkürzung bezahlt wird. Und der Wunsch, gespiegelt zu werden, ohne sich doch erst anpassen zu müssen. Entlastung, die nicht verlangt, dass ich mein Inneres in Lesbarkeit überführe."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Gerade deshalb will ich mein Leben nicht daran abgeben."]]}]}], "vermerk": ""}]}];
