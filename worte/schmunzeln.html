<script>
const SEITE = {"zurueck": "index.html", "letztes": {"titel": "Sicherheitsfrömmigkeit", "href": "sicherheitsfrommigkeit.html"}, "naechstes": {"titel": "QUALIA", "href": "qualia.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "Schmunzeln.", "unter": "Das kleine Lächeln weiß oft früher Bescheid als der Satz danach.", "datum": "2026-03-04", "anzeige": "04.03.26", "form": "Prosa", "zeilen": true, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "", "titel": "", "zeilen": true, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Ein Schritt im Treppenhaus. Jemand geht, den ich nicht kenne und der mich nicht kennt. Und doch trifft mich der Schlag, als wäre er an mich gerichtet."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Weil ich so gebaut bin, dass ein solcher Schlag mich überhaupt erreichen kann. Er meint mich nicht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Kurzer Schlag. Stille."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "In mir läuft etwas zusammen. Erwartung und Erinnerung, dann Möglichkeit. Weil ich der bin, an dem sie gerade ankommt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann Scham."]]}, {"f": 0, "r": [["n", "Aber die Scham gilt nicht dem Schritt. Sie gilt mir. Sie sieht die eigene Ergriffenheit, erkennt sie nicht wieder und hält sie dann für Fremd. Für zu viel. Für etwas, das nicht zu mir gehört. Und greift sie an. Als könnte man löschen, was selbst gerade gewesen ist."]]}, {"f": 0, "r": [["n", "Nur löscht es sich nicht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Was nicht durchgelassen und nicht ausgestoßen werden kann, bleibt. Manchmal kann ein Körper etwas weder verdauen noch loswerden. Statt ein Ende. Baut er eine Wand. Schicht für Schicht, ohne es zu zerstören und freizugeben."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das Gewebe drumherum lebt weiter. Verändert von dem, was es umschließt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "So auch das hier. Glaube ich jedenfalls. Der Schritt im Treppenhaus ist nicht verdaut. Auch nicht verstanden und nicht erledigt. Nicht zu einem Satz gemacht, den man ablegen kann. Stattdessen sitzt er noch da. Eingekapselt in etwas, das mittlerweile ich bin. Ohne dass ich sagen könnte, wo genau die Grenze verläuft. Zwischen ihm und mir."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Die Kapsel ist aus mir gemacht. Und zieht trotzdem eine Grenze, an der etwas anderes beginnt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Der Zuschauer, der die Scham geschickt hat, sitzt jetzt in derselben Wand und verdeckt, was darin liegt. Er legt frei, dass dort überhaupt etwas liegt. Beides durch dieselbe Bewegung."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich will nicht, dass es sich löst."]]}, {"f": 0, "r": [["n", "Ich will nur wissen, was ich da trage. Als etwas, das bleibt, weil es nicht anders kann."]]}]}], "vermerk": ""}]}];
