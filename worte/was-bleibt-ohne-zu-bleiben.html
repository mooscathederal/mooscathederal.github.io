<script>
const SEITE = {"zurueck": "index.html", "letztes": {"titel": "Stille Enteignung", "href": "stille-enteignung.html"}, "naechstes": {"titel": "Leerzeichenprüfung", "href": "leerzeichenprufung.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "Was bleibt, ohne zu bleiben.", "unter": "Über das, was verschwindet, obwohl alles bleibt.", "datum": "2026-04-18", "anzeige": "18.04.26", "form": "Prosa", "zeilen": true, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "", "titel": "", "zeilen": true, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Fast nichts in der Welt hört einfach auf. Es ändert Zustand, Ort, Bindung, Sichtbarkeit. Aber dieses Wort weg stimmt selten. Gerade dann nicht, wenn ich es bräuchte."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich sitze rauchend an einer Straßenecke, halb weg, und der Atem ist da, bevor ich daran denke. Was eben noch in meiner Lunge war, ist im nächsten Moment nicht vernichtet. Abgegeben, verdünnt, aufgenommen, weitergetragen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "An der Scheibe im Winter. Ich atme gegen das kalte Glas, und für einen Moment wird sichtbar, was sonst unsichtbar ist. Die Scheibe beschlägt, mein Körper schreibt sich in die Luft ein. Danach ist auch das fort. Nicht gelöscht. Verteilt, abgekühlt, aufgenommen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Eine Tasse, die ich zu lange stehen lasse. Im Sinn, als ich sie aufgesetzt habe. Dann kam etwas dazwischen. Als ich wiederkomme, ist sie lauwarm. Nicht kalt. Das wäre ein Schluss. Lauwarm heißt: noch nicht ganz fort. Die Wärme war im Porzellan, im Holz des Tisches, in der Luft, an meiner Hand, als ich sie hielt. Sie hat nur aufgehört, auf mich zu warten."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ein Zimmer, das ich gerade verlasse, ist nicht sofort leer. Auf dem Tisch ein halbvolles Glas, ein aufgeschlagenes Buch, das ich nicht zu Ende gelesen habe, eine Notiz, von mir an mich selbst, die jetzt niemand liest. Die Luft steht anders, der Stuhl leicht verschoben. Das Licht wirkt einen Moment unentschlossen. Ein Ort hält mich noch, nachdem ich gegangen bin."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dieselbe Struktur, die verhindert, dass etwas einfach aufhört, macht auch vor mir nicht halt. Mein Atem geht in die Luft, die Wärme in den Tisch, meine Spur in den Raum. Nicht weil die Welt mich schont. Weil sie nichts schont. Dass sie mich nicht schont, heißt auch: sie verliert mich nicht ganz."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wärme geht über. Das ist kein Trost, das ist ein Befund. Energie bleibt erhalten. Die Wärme der Tasse nicht. Sie ist im Tisch, in der Luft, in mir, wenn ich die Hand daran halte. Nachverfolgbar. Nur nicht dort, wo ich sie haben wollte."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Erhaltung ist nicht Bewahrung. Dass die Wärme noch irgendwo ist, hilft nicht, wenn ich sie nicht spüre. Dass mein Atem weitergetragen wird, ändert nichts daran, dass er nicht mehr meiner ist. Der Befund beschreibt, was mit dem Stoff geschieht. Nicht, was mit mir geschieht, wenn er geht. Physikalisch bleibt der Stoff erhalten. Für mich kann trotzdem etwas unwiederbringlich fort sein. Zwei verschiedene Wahrheiten über denselben Vorgang. Die zweite verschwindet nicht, weil die erste präziser ist."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Atem, Wärme, Spur, Raum. Das ist die Form, in der Leben stattfindet. Ein Körper, der nichts abgibt, nichts aufnimmt, nichts durchlässt, ist tot. Was lebt, bleibt nicht lebendig, indem es sich verschließt. Es nimmt auf, gibt ab, lässt hindurch, bindet und löst."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Die Membran einer Zelle ist keine Mauer. Sie ist selektiv durchlässig. Was sie trennt, trennt sie nicht durch Verschluss, sondern durch Regelung dessen, was hindurchkommt. Grenze als Bedingung des Übergangs."]]}, {"f": 0, "r": [["n", "Lebendig ist, was noch Austausch zulässt. Leben hält sich nicht durch Offenheit, sondern durch Unterscheidung."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nicht Energie treibt an. Unterschiede treiben an. Temperaturgefälle, Konzentration, Spannung. Wo kein Gefälle ist, fließt nichts. Was übergeht, geht nicht zurück. Die Wärme der Tasse verteilt sich in den Tisch, in die Luft, in den Raum, bis kein Unterschied mehr messbar ist. Dann ist nichts verloren. Und kein Unterschied treibt noch etwas an. Gleichgewicht ist nicht Ruhe. Es ist das Ende dessen, was noch treiben könnte."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Die Unruhe geht nicht fort. Das ist kein Versagen. Aber es ist auch kein Merkmal, das man annehmen könnte."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Sie hat dieselbe Struktur wie das, was sie ausgelöst hat. Beides geht über. Beides kehrt nicht zurück. Nicht weil etwas fehlt, sondern weil das ihre Form ist."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es ändert nichts an der Zumutung."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Zwei Wahrheiten über denselben Vorgang. Die Unruhe bleibt. Auch sie geht über. Die zweite Wahrheit macht die erste nicht kleiner. Sie macht sie kenntlich."]]}]}], "vermerk": ""}]}];
