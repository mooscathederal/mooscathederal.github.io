<script>
const SEITE = {"zurueck": "index.html", "letztes": {"titel": "Kontingenzdruck", "href": "kontingenzdruck.html"}, "naechstes": {"titel": "Sicherheitsfrömmigkeit", "href": "sicherheitsfrommigkeit.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "Kohärenzpflicht", "unter": "Wie man sich leise verlässt.", "datum": "2026-03-01", "anzeige": "28.02.26", "form": "Prosa", "zeilen": true, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "", "titel": "", "zeilen": true, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Ich sitze am Tisch. Jemand macht einen Witz über jemanden, der nicht da ist. Alle lachen. Ich spüre den Impuls, mitzulachen. Es wäre leicht. Es würde nichts kosten, zumindest nicht sichtbar. Ich lache halb. Es reicht, um nicht aufzufallen. Es reicht nicht, um ruhig zu bleiben."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Später liege ich im Bett. Der Satz kommt zurück. Nicht der Witz. Mein Lachen. Mein Körper ist wach, obwohl ich müde bin. Die Szene wiederholt sich, aber ohne Publikum. Ich merke, dass ich an einer kleinen Stelle nicht übereinstimme mit mir selbst. Ein  Versatz, der mich wach hält."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Deshalb: Kohärenzpflicht."]]}, {"f": 0, "r": [["n", "Ich teile das, weil es sonst bei mir nur ein innerer Standard bleibt. Wenn es nur innerlich gilt, wird es verhandelbar, sobald es unbequem wird. Wenn ich es ausspreche, kostet Ausweichen mehr."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es beginnt bei einer Nachricht, die ich abschwäche, obwohl ich etwas anderes meine. Einem Gespräch, in dem ich ausweiche, obwohl es gerade trägt. Ich kann das alles tun. Ich habe es oft genug getan. Der Unterschied ist: Es bleibt nicht mehr folgenlos."]]}, {"f": 0, "r": [["n", "Ich merke es zuerst im Körper. Unruhe. Flacher Schlaf. Sätze, die nachhallen, obwohl sie längst gesagt sind. Ich empfinde das nicht als moralischen Schmerz. Es ist Reibung. Als würde etwas nicht sauber greifen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "An diesem Punkt kippt etwas. Ich kann nicht mehr gleichzeitig ehrlich und bequem sein. Früher ging das. Oder ich habe es mir eingeredet. Heute zahle ich schneller."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ignoranz wäre eine Lösung. Sie fühlt sich weich an. Dinge stehen zu lassen, weil sie klein sind. Zu glättet, weil es niemandem schadet. Man nennt es Rücksicht oder Pragmatismus."]]}, {"f": 0, "r": [["n", "Doch dabei verschiebt sich der eigene Maßstab. Erst werde ich vorsichtiger, als es nötig wäre. Dann kompatibel, obwohl ich innerlich nicht mehr dabei bin. Und irgendwann verteidige ich Dinge, nur weil sie normal geworden sind."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich habe mich an meine eigene Abweichung gewöhnt."]]}, {"f": 0, "r": [["n", "Und kenne diese Bewegung. Ich habe sie oft genug gemacht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Die Pflicht liegt für mich darin, dass ich sonst zwei Leben führe. Eines nach außen, eines nach innen. Das frisst Energie."]]}, {"f": 0, "r": [["n", "Du wachst auf und bist müde, obwohl du geschlafen hast. Du gehst durch den Tag und merkst, dass du schneller zustimmst, als du denkst. Du formulierst Sätze, die funktionieren, aber nicht stimmen. Du wirst effizienter im Anpassen."]]}, {"f": 0, "r": [["n", "Es läuft, und ich merke es zu spät."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich kann mir diese Effizienz nicht mehr leisten. Das macht Gespräche langsamer, manchmal unangenehmer. Es kostet Nähe, zumindest kurzfristig. Es isoliert punktuell. Einen Vorteil, den ich vorzeigen könnte, bringt es nicht."]]}, {"f": 0, "r": [["n", "Ich gehe damit weiter, weil ich sonst merke, wie ich mich selbst verschiebe."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Sokrates bindet Denken. Wenn ich es ernst nehme, kann ich nicht so tun, als wäre es folgenlos."]]}, {"f": 0, "r": [["n", "Nietzsche treibt Gedanken bis zur Kante. Auch wenn dabei etwas in mir kippt."]]}, {"f": 0, "r": [["n", "Arendt macht Klarheit unhöflich, wenn es sein muss."]]}, {"f": 0, "r": [["n", "Camus lässt das Absurde stehen und handelt trotzdem."]]}, {"f": 0, "r": [["n", "Weil ist der Ernstfall. Aushalten statt schmücken."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das ist für mich keine Etikette. Es sind die wenigen Stellen, an denen ich mich erkenne, ohne mich zu erklären."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich rede nicht über alles. Manches muss erst stabil werden, bevor ich es in Worte lege. Sonst wird es sofort wieder weich. Ich muss dafür nicht immer laut sein. Ich will nicht gegen mich selbst arbeiten."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ein Gespräch kippt, weil ich nicht mitlache. Eine Beziehung wird stiller, weil ich nichts mehr überspiele. Ein Raum wird kälter, weil ich eine Sache nicht glätte. Das ist real."]]}, {"f": 0, "r": [["n", "Wenn ich es doch tue, werde ich glatt. Ich werde berechenbar auf eine Weise, die nichts mehr mit mir zu tun hat. Ich funktioniere."]]}, {"f": 0, "r": [["n", "Ich gehe so weit, weil ich sonst beginne, Dinge zu sagen, die ich selbst nicht mehr glaube, und am nächsten Morgen so tue, als wäre das normal."]]}]}], "vermerk": "überarbeitet am 06.10.2026"}]}];
