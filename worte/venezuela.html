<script>
const SEITE = {"zurueck": "index.html", "letztes": {"titel": "f*ck society", "href": "fck-society.html"}, "naechstes": {"titel": "Nur Liebe", "href": "nur-liebe.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "Venezuela", "unter": "Strukturhunger", "datum": "2026-05-08", "anzeige": "15.02.26", "form": "Prosa", "zeilen": true, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "", "titel": "", "zeilen": true, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Neulich hab ich in Jack Ryan eine Szene gesehen, die mich mehr erwischt hat als jede Verfolgungsjagd. Nicht wegen Action. Wegen diesem Moment, wo jemand vorne steht, Beamer an, Folienmodus, und erklärt, wie Macht funktioniert. Geopolitik. Interessen. Rohstoffe. Venezuela als Beispiel. Ich saß da und hab gemerkt, wie schnell mein Kopf auf sowas anspringt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich glaube nicht, dass das dann die Wahrheit ist. Aber ich merke, dass ich auf Ordnung hoffe. Für ein paar Minuten wirkt die Welt sortierbar. Als gäbe es eine Schublade für alles, und irgendwer hat den Plan."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann kam eine dieser Fragen, die ich noch aus meiner Kindheit kenne. Was ist das Wertvollste, was es gibt. Früher war die Antwort was Materielles. Geld. Gold. Irgendwas, das man anfassen kann und nicht wegfliegt, wenn man die Augen schließt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Später kam die Frage wieder. Diesmal nicht so handlich. Ich war zu unsicher, verwirrt, ängstlich, um mir eine Antwort zu geben, die nicht sofort nach Kalenderblatt klingt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht war schon die Frage verdächtig. Dieser Wunsch, dass irgendwo oben etwas steht und alles andere ordnet."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Venezuela ist ein Fall, der im Kopf schnell als Lehrstück funktioniert, weil er so brutal nach Regel klingt. Enorme Ölreserven, nach den bekannten Zahlen sogar die größten nachgewiesenen weltweit. Trotzdem ist die Geschichte seit Jahrzehnten nicht Reichtum, sondern Krise. Ein Land, das auf Öl gebaut war und dann nicht von Öl gerettet wurde. Instabilität. Autoritärer Umbau. Wirtschaftlicher Absturz. Massenemigration."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Was mich daran irritiert, ist nicht nur das Elend. Mich lässt nicht los, wie es in meinem Alltag auftaucht. In Schüben. Mal taucht es kurz auf, wenn es gerade in ein großes Narrativ passt. Sanktionen. Ölpreise. Migration. Dann verschwindet es wieder, als hätte jemand den Ton runtergedreht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich will nicht so tun, als gäbe es keine Berichte. Es gibt sie. Trotzdem kommt meine Aufmerksamkeit nur in Wellen dort an. Manche Krisen bleiben im Licht. Andere flackern kurz auf und sind wieder weg."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich merke, wie sehr ich mich an solche Erklärungen klammere. Nicht aus Zynismus. Meist aus Müdigkeit. Meine Tage sind oft zerstreut. Ich springe zwischen Dingen, Reizen, Pflicht und Ablenkung. Manchmal merke ich nicht, wann ich eigentlich weg war. In so einem Kopfzustand fühlen sich diese klaren Vorträge wie ein Geländer an."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nur, das hält nie lange."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Im Kleinen mache ich exakt dasselbe, nur ohne Beamer. Ich sitze am Laptop, will eigentlich nur einen Absatz schreiben, und merke, wie ich nebenbei Tabs öffne. Nachrichten. Hintergrund. Ein Video. Noch eine Einordnung. Ein Teil von mir glaubt, das sei Interesse, und manchmal ist es das auch. Aber oft ist es Unruhe in schick. So ein „ich informiere mich“, das eigentlich nur bedeutet: Ich kann nicht still sitzen in meinem Kopf."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und irgendwann ist alles da, Links, Stimmen, Kontext, nur ich nicht mehr richtig. So fehlt Aufmerksamkeit. Ich bin noch da, aber nicht ganz hier. Als würde mein eigener Blick die ganze Zeit ein Stück zu früh loslaufen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nichts bekommt sie ganz. Nicht Denken. Nicht Nähe. Nicht mal ein ganzer Tag. Sobald sie irgendwohin geht, fehlt sie woanders."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Gezogen wird von außen, klar. Aber eben auch von innen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich bin nicht nur der, an dem gezogen wird. Ich mache mit. Ich klicke nicht nur, weil man mich lockt. Ich klicke auch, weil irgendwas in mir Hunger hat. Nach Orientierung. Nach Zugehörigkeit. Nach dem Gefühl, nicht blind zu sein. Und manchmal auch einfach nach Unterbrechung. Stille ist nicht automatisch Frieden. Manchmal ist sie nur das, was ich sonst übertöne."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und das Gemeine ist, dafür muss nicht mal viel passieren. Es reicht, dass jederzeit etwas passieren könnte. Diese Bereitschaft im Körper, dieses leichte Vorziehen der Aufmerksamkeit, als wäre sie schon unterwegs, bevor ich mich entschieden habe. Ich kenne das gut. Dieses Aufspringen, bevor überhaupt ein Gedanke da ist."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Macht ist nicht nur, wer Öl kontrolliert. Wer Grenzen setzt. Wer Sanktionen verhängt. Macht ist auch, wer den Takt bestimmt. Wann etwas wichtig wird. Wie lange es bleibt. Und wann das Nächste kommt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht verdächtige ich die Gegenwart nur, weil ich nicht gut mit ihr Schritt halte. Jede Zeit hat ihre Auslöser. Früher waren es andere Medien, andere Süchte, andere Ängste. Und möglicherweise ist das ja alles nur Kultur. Gleichgültig statt bösartig. Einfach die jeweilige Zeit mit ihren Werkzeugen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Doch in mir bleibt dieses Gefühl, dass ich dauernd etwas einsammle, das mir gerade wieder auseinandergefallen ist, während schon wieder was Neues reinweht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann kommt manchmal ein Gedanke, der fast traurig klingt, aber mir hilft. Ich bin keine Hauptfigur. Nicht historisch. Nicht kosmisch. Das ist keine Demütigung. Es nimmt Druck raus. Ich muss nicht die ganze Welt verstehen, um heute nicht ganz aus ihr herauszufallen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Für den Anfang reicht es manchmal, zurückzukommen. In meinen eigenen Takt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das ist kein Sieg. Ich werde wieder abdriften. Wieder in dieses Wetter geraten. Ich werde mir wieder einreden, ich müsse jetzt unbedingt alles wissen, einordnen und das sofort."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Doch ich kann auch üben, den Blick zu schützen. Schlicht. Ein Text ohne nebenbei. Ein Gespräch ohne Fluchtwege. Ein Gedanke, den ich zu Ende denke, auch wenn er mich kurz verunsichert."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nicht für ewig."]]}, {"f": 0, "r": [["n", "Für heute."]]}]}], "vermerk": "überarbeitet am 10.05.2026"}]}];
