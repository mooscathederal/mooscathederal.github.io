gen, dann ist die Weise, in der es diesen Konflikt hält, bereits das Gefühl."]]}]}, {"t": "luecke", "h": 22}, {"t": "p", "z": [{"f": 0, "r": [["b", "THE MATH: _DÄDÄM_"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["i", "Kein Beweis. Nur ein Gedanke in Chiffren."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "1. Zustand"]]}]}, {"t": "p", "z": [{"f": 1, "r": [["n", "xₜ"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "2. Zwei Forderungen"]]}]}, {"t": "p", "z": [{"f": 1, "r": [["n", "Aₜ, Bₜ"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "3. Beides gilt, passt nicht zusammen"]]}, {"f": 1, "r": [["n", "Aₜ = 1, Bₜ = 1"]]}]}, {"t": "p", "z": [{"f": 1, "r": [["n", "Aₜ und Bₜ sind inkompatibel"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "4. Spannung bleibt"]]}, {"f": 1, "r": [["n", "Sₜ > 0"]]}, {"f": 0, "r": [["n", "5. Auflösen kostet zu viel"]]}, {"f": 1, "r": [["n", "Kₜ > k"]]}, {"f": 0, "r": [["n", "6. Es bleibt über Zeit"]]}, {"f": 1, "r": [["n", "Gₜ = Σᵢ₌ₜ₋ₙᵗ Sᵢ"]]}, {"f": 1, "r": [["n", "Gₜ > g"]]}, {"f": 0, "r": [["n", "7. Bindung an sich selbst"]]}, {"f": 1, "r": [["n", "Mₜ = Selbstmodell"]]}]}, {"t": "p", "z": [{"f": 1, "r": [["n", "Mₜ₊₁ = Mₜ + Sₜ"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "8. Erleben"]]}, {"f": 1, "r": [["n", "Qₜ = 1 ⇔ (Sₜ > 0)∧(Kₜ > k)∧(Gₜ > g)∧(Mₜ)"]]}, {"f": 1, "r": [["n", "Qualia ≈ Spannung + Kosten + Zeit + Selbstbindung"]]}, {"f": 0, "r": [["n", "9. "], ["b", "Cheat Sheet zur Notation"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "x_t = Zustand des Systems zur Zeit t"]]}, {"f": 0, "r": [["n", "A_t, B_t = zwei Forderungen"]]}, {"f": 0, "r": [["n", "S_t = verbleibende Spannung"]]}, {"f": 0, "r": [["n", "K_t = Kosten der Auflösung"]]}, {"f": 0, "r": [["n", "k = Schwelle, ab der Auflösung zu teuer wird"]]}, {"f": 0, "r": [["n", "G_t = gehaltene Spannung über Zeit"]]}, {"f": 0, "r": [["n", "Σ = Summe über mehrere Zeitpunkte"]]}, {"f": 0, "r": [["n", "g = Schwelle, ab der es lang genug anhält"]]}, {"f": 0, "r": [["n", "M_t = Selbstmodell"]]}, {"f": 0, "r": [["n
