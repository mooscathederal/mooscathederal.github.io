const SEITE = {"zurueck": "index.html", "letztes": {"titel": "Das herzlose Ohr", "href": "das-herzlose-ohr.html"}, "naechstes": {"titel": "Fuck u.", "href": "fuck-u.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "Was is eigentlich meine...", "unter": "Erklärung als Anspruch - Erklärung als Rechtfertigung", "datum": "2026-07-11", "anzeige": "11.07.26", "form": "Prosa", "zeilen": false, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "", "titel": "", "zeilen": false, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Zwei Menschen sprechen über dieselbe Sache. Jedenfalls sieht es am Anfang so aus. Sie benutzen dieselben Wörter, denselben Anlass, vielleicht sogar denselben Satz. Nach ein paar Minuten sind sie trotzdem nicht mehr dort, wo sie begonnen haben."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich sage einen Satz. So genau, wie ich ihn sagen kann. Ich meine ihn gut. Auf dem Gesicht des anderen kommt etwas anderes an. Ich merke es, bevor ich es begreife. Also erkläre ich. Ich sage, wie ich es gemeint habe, und während ich es sage, höre ich meinen eigenen Satz schon von seiner Seite. Verteidigung. Rechthaben. Der Beweis, dass ich mich über ihn stelle."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht stimmt das sogar. Ich weiß es bis heute nicht sicher. Wenn ich erkläre, wie etwas gemeint war, sage ich damit auch: Hier ist die Sache, und ich kenne sie besser. Das sage ich nicht, aber ich tue es, in jedem Satz, der beginnt mit Was ich eigentlich meinte. Jede Erklärung legt neu fest, was zwischen uns verhandelt wird und wer dafür zuständig ist. So gesehen hat er vielleicht nichts falsch gehört. Er hat gehört, was ich getan habe, während ich glaubte, nur zu sagen, was ich meinte."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich schreibe das und merke, wie ich schon wieder dabei bin, es genau hinzubekommen. Der Satz oben ist mehrfach umgestellt, damit er nicht überheblich klingt und trotzdem stimmt. Das ist derselbe Handgriff. Ich will die Sache so festlegen, dass sie mich nicht mehr belastet, und nenne das Genauigkeit. Je länger ich daran arbeite, desto enger wird der Satz, nicht klarer. Ich sehe das, während es passiert, und es hilft nichts."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht trete ich deshalb innerlich zur Seite, sobald ein Gespräch kippt. Etwas in mir redet weiter, genug, um nicht aufzufallen, zu wenig, um noch dabei zu sein. Lange habe ich das für einen Beobachtungsposten gehalten, eine Stelle außerhalb, von der aus ich sehen kann, was gerade geschieht. Ich bin nicht mehr sicher, ob dort jemand heraustritt. Vielleicht ist auch der, der zur Seite tritt, nur eine weitere Figur im selben Stück, die sich einbildet, das Publikum zu sein."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich kann den Vorgang benennen, während er passiert. Ich kann sagen, an welcher Stelle es kippt und warum. Es kippt trotzdem. Den Mechanismus zu durchschauen, ist keine Tür aus ihm heraus. Manchmal ist es nur eine genauere Art, drin zu sein."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich brauche für das andere ein Bild, dem ich nicht ganz traue. Zwei Menschen unter einer Decke. Ich habe das lange so erzählt, als hätte die Decke am Anfang gereicht, als hätte niemand sie gewollt, als hätten beide sich nur im Schlaf gedreht. Das stimmt vermutlich nicht. Einer hatte vermutlich von Anfang an mehr Stoff, nicht weil er zog, sondern weil sie schon so lag, als er dazukam, und hat es erst gemerkt, als der andere fror. Ich war vermutlich der mit mehr Stoff. Das ändert die Geschichte, die ich mit dem Bild erzählen wollte. Ich lasse es trotzdem stehen, mit der Änderung."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es gibt noch ein zweites Bild, mit Druck und Reifen, das ich früher ausführlicher gemacht hatte. Ich lass es hier einfach stehen. Nicht jeder Gedanke, den ich einmal gebraucht habe, verdient noch einen eigenen Absatz."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich fand seinen Satz ungerecht. Du stellst dich über mich. Nicht nur damals. Ich finde ihn manchmal noch heute ungerecht, wenn ich nicht aufpasse, obwohl ich inzwischen weiß, dass er nicht falsch lag. Beides ist wahr, gleichzeitig, und ich habe keinen Weg gefunden, das eine gegen das andere aufzuheben. Die spätere Einsicht hat die Abwehr nicht abgelöst. Sie liegt daneben."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Was ich in dem Moment wollte, war nicht kompliziert. Ich wollte, dass er mich wieder normal ansah. Ich weiß nicht, ob es mir dabei um mehr ging, um Reue etwa, oder nur darum, dass der Blick aufhört. Ich habe es damals nicht auseinandergehalten. Ich halte es jetzt auch nicht auseinander."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Auf dem Tisch stand noch eine übergroße kalte Tasse von vorher. Ich habe sie später weggeräumt. Das gehört nicht zur Geschichte."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ein einzelner Moment beweist nichts. Aber wenn dieselbe Bewegung sich wiederholt, mit verschiedenen Menschen, in Situationen, die inhaltlich nichts miteinander zu tun haben, wird ein Muster plausibel. Wo dieses Muster liegt, ist damit nicht entschieden. In mir. In einer bestimmten Gesprächsform. In einer Art, auf Einwände zu reagieren. Oder im wiederkehrenden Zusammentreffen zweier Erwartungen, die einander nicht erkennen. Ich lasse das offen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht war die Sache nie gemeinsam. Ich habe hier lange erzählt, als hätten wir etwas geteilt und dann verloren. Vielleicht trat jeder Satz von Anfang an in zwei Räume ein, die längst eingerichtet waren, und wurde in beiden sofort einsortiert, nur langsam genug, dass es wie ein gemeinsamer Anfang aussah. Dann war das, was ich Missverstehen genannt habe, kein Verfehlen einer geteilten Bedeutung, denn es gab keine zu verfehlen. Und ein Rückweg wäre dann keine Rückkehr zu etwas Bestehendem, sondern der Versuch, zum ersten Mal etwas herzustellen, das es vorher nie gab. Ich weiß nicht, welche der beiden Geschichten stimmt. Ich habe lange von der ersten gelebt. Sie ist leichter zu ertragen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Der Konflikt zwischen uns war nicht symmetrisch. Nicht beide taten einander dasselbe. Einer der die Sache, jedes Mal aufs Neue, mit dem genauesten Satz, den er finden konnte, setzt. Das war ich. Nicht die Frage, wer schuldiger ist. Nur, wer den ersten Satz gesagt hat."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich wollte diesen Absatz mit einem Satz schließen, der zeigt, dass ich verstanden habe, was meine Genauigkeit war. Ich habe drei Versionen davon geschrieben und alle wieder gelöscht, weil jede von ihnen genau das noch einmal getan hätte, wovon sie handelt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich habe den Satz nie zurückgenommen."]]}]}], "vermerk": ""}]}];
