const SEITE = {"zurueck": "index.html", "letztes": {"titel": "Rotstift.", "href": "rotstift.html"}, "naechstes": {"titel": "4KB bis zum Mond", "href": "4kb-bis-zum-mond.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "Tapetentau", "unter": "von dem, was erst sichtbar wird, wenn etwas fehlt.", "datum": "2026-03-26", "anzeige": "26.03.26", "form": "Prosa", "zeilen": true, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "", "titel": "", "zeilen": true, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Der Tag kommt nicht auf einmal."]]}, {"f": 0, "r": [["n", "Ein Blick auf die Uhr, der Kühlschrank leer, eine Antwort, die noch keinen Umschlag kennt. Ein Satz vom Morgen sitzt abends noch in den Schultern. Ein Tag vergeht auch an dem, was nicht mehr drankommt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Blätter an einem Strauß lassen sich hochziehen, bis sie fast wie eine Rose schließen."]]}, {"f": 0, "r": [["n", "Neu wird selten etwas. Oft hört etwas nur auf, unterbrochen zu werden."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ein Puls läuft mit. Lange, bis man keinen anderen mehr kennt."]]}, {"f": 0, "r": [["n", "Am Abend ist nicht nur der Tag vorbei. Etwas bleibt, ohne dass man es gleich benennen könnte. Manches bleibt so lange, dass man es kaum noch sieht. Nicht das Seltene. Eher das, was wieder da ist, langsam Platz nimmt, erst am Rand, dann nicht mehr nur dort."]]}, {"f": 0, "r": [["n", "Eine Pause, ein Ankommen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Jeden Tag fällt das Licht zur selben Stunde auf dieselbe Stelle am Boden. Man sieht es nicht immer, weil man vorbeigeht, etwas trägt, schon bei etwas anderem ist. Es fällt trotzdem dorthin."]]}, {"f": 0, "r": [["n", "Und eines Tages merkt man nicht zuerst, dass es da ist, sondern dass man damit gerechnet hat."]]}]}, {"t": "luecke", "h": 30}, {"t": "p", "z": [{"f": 0, "r": [["n", "Tapete zeigt ihr Alter oft erst, wenn das Bild von der Wand genommen wird."]]}, {"f": 0, "r": [["n", "Ereignisse heben sich heraus. Die Zeit nicht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Mehr Stimmen, mehr Raum, mehr Erfolge, und irgendwann steht das nicht mehr nur neben einem. Eine Nachricht kommt selten allein. Ein Abend bleibt nicht einfach Abend."]]}, {"f": 0, "r": [["n", "Dinge behalten ihre Namen. Nur die Art, wie sie im Raum stehen, hat sich verändert."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Man sitzt an einem Tisch und hält das Glas wie immer. Die Hand kennt die Form."]]}, {"f": 0, "r": [["n", "Viele Dinge werden erst dort sichtbar, wo sie stören. Gemacht wurden sie woanders."]]}, {"f": 0, "r": [["n", "Das Gesicht erscheint im Löffel, flach und verschoben."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Man kann nicht alles halten, nicht alles zugleich. Mit Form wird es nicht leichter. Es hält nur länger zusammen."]]}]}, {"t": "luecke", "h": 30}, {"t": "p", "z": [{"f": 0, "r": [["n", "Müde Augen, eine laute Stimme, ein Lächeln, das einen halben Schlag zu spät kommt."]]}]}], "vermerk": "überarbeitet am 06.10.2026"}]}];
