<script>
const SEITE = {"zurueck": "index.html", "letztes": {"titel": "warum ich nicht wegsehen kann.", "href": "warum-ich-nicht-wegsehen-kann.html"}, "naechstes": {"titel": "Sensibilität", "href": "sensibilitat.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "Privilegien und Verantwortung", "unter": "Das Leben kann nur rückwärts verstanden werden; Aber es muss weitergelebt werden.", "datum": "2026-03-30", "anzeige": "30.03.26", "form": "Prosa", "zeilen": false, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "", "titel": "", "zeilen": false, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht ist das Schwierige am Erwachsenwerden nicht zuerst, Verantwortung zu tragen. Vielleicht ist es schwerer, Unschärfe auszuhalten."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es gibt keinen endgültigen Standpunkt. Kein reines Außen. Und kein sicheres Lager, von dem aus man nur noch recht haben muss. Strukturelle Ungerechtigkeit ist real. Und trotzdem ist niemand von uns völlig unschuldig, völlig sauber, völlig gut. Beides stimmt gleichzeitig. Genau das macht Verantwortung unbequem."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Sie braucht Reaktion. Keine Bühne."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich frage mich, woran man erkennt, ob man etwas wirklich tut oder dabei nur gesehen werden will. Die Größe der Geste sagt wenig. Mehr sagt, was bleibt, wenn niemand zuschaut. Wenn keine Anerkennung kommt, keine Zustimmung, keine Erzählung, in der man gut aussieht. Nur die Entscheidung selbst. Und dass man trotzdem bei ihr bleibt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Auch das ist nicht sicher. Stille und Ruhe beweisen nichts. Sie können Klarheit sein. Oder nur Angst mit besserer Haltung. Ich habe oft geschwiegen, weil ich nicht riskieren wollte, bedürftig, falsch oder klein zu wirken. Nicht aus freier Wahl."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wir leben in einer Zeit, in der das Sagen oft wichtiger wirkt als das Tun. Je lauter etwas behauptet wird, desto weniger wird manchmal gesagt. Ich denke, darin liegt die versteckte Gemeinsamkeit der Extreme: Die einen reden sich in Reinheit, die anderen in Unzuständigkeit. Beide vermeiden den Punkt, an dem Verantwortung konkret wird."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Verantwortung, die nur gut aussieht, verändert nichts."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wenn Moral zur Identität wird, wird jeder Fehler zur Bedrohung. Dann geht es nicht mehr darum, etwas besser zu machen, sondern darum, nicht entlarvt zu werden. Eine Moral, die sich ständig nach vorne drängt, macht Menschen nicht freier. Sie macht sie vorsichtiger, härter, verschlossener."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Privilegien sind für mich keine Parole. Sie sind eine Handlungsoption. Ein Test."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ein Privileg zeigt sich nicht nur darin, was man hat. Es zeigt sich auch darin, wann man sich heraushalten kann: wann Wegsehen nichts kostet und Schweigen möglich bleibt, weil andere den Preis tragen. Dann ist die Frage nicht, ob man schuldig ist. Die Frage ist, was man mit der Möglichkeit macht, nicht reagieren zu müssen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich glaube nicht mehr an Verantwortung, die Menschen leer macht. Es gibt ein Bewusstsein, das nur noch beweisen will, dass es bewusster ist. Eine Stärke, die vor allem zeigen will, dass sie noch mehr tragen kann. Aber Verantwortung, die zerstört, macht nicht besser. Sie macht leerer."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das ist der Punkt: Verantwortung muss konkret genug sein, um etwas zu verändern, und menschlich genug, um nicht zur Selbstzerstörung zu werden. Sie darf nicht nur Entlastung suchen. Aber sie darf auch nicht alles verschlingen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Sie beginnt nicht mit der Erklärung von Schuld. Sie beginnt dort, wo man die eigene Möglichkeit nicht länger neutral nennt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Manchmal ist Verantwortung ein Handeln, manchmal ein Verzichten, manchmal ein klares Nein. Nicht hart. Nicht laut. Nur: Bis hierhin und nicht weiter. Und manchmal ist sie die Bereitschaft, den eigenen Vorteil nicht sofort für Unschuld zu halten."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich glaube, wir müssen wieder lernen, nicht jede offene Frage sofort in Haltung zu verwandeln. Nicht jedes Unbehagen ein Bekenntnis und nicht jeder Schmerz ein Beweis. Manche Fragen brauchen Zeit, weil sie uns nicht nur eine Meinung abverlangen, sondern eine andere Art zu leben."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wir entwickeln uns nicht nur durch Antworten. Wir entwickeln uns auch, wenn wir bereit sind, mit den Fragen zu leben. Fragen sind unbequem, weil sie keine Verantwortung delegieren. Sie lassen einen nicht ausweichen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Am Ende muss man nicht alles meistern. Man muss auch nicht gut aussehen, während man stolpert. Man muss den eigenen Anteil halten: nicht größer, als er ist, aber auch nicht kleiner. Nicht rein. Nicht unzuständig. Nicht erledigt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Verantwortung heißt nicht, sich selbst zum Beweisstück der eigenen Moral zu machen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Sie heißt, dort nicht zu verschwinden, wo das eigene Dasein Folgen hat."]]}]}], "vermerk": "überarbeitet am 11.05.2026"}]}];
