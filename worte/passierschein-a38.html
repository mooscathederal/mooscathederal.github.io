<script>
const SEITE = {"zurueck": "index.html", "letztes": {"titel": "Nur ein Wort", "href": "nur-ein-wort.html"}, "naechstes": {"titel": "Amélie", "href": "amelie.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "Passierschein", "unter": "", "datum": "2026-03-03", "anzeige": "11.02.26", "form": "Prosa", "zeilen": true, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "", "titel": "", "zeilen": true, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Manchmal fängt es ganz harmlos an. Mit so einem Satz, der sich selbst schnell ein Geländer dranschraubt, damit ja niemand runterfällt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dieses:"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "„Nur damit du mich nicht falsch verstehst …” „Ich weiß, das klingt hart, aber …” „Eigentlich meinte ich …”"]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Während ich rede, merke ich nicht, dass ich längst verhandle. Niemand hat mich angeklagt. Ich reiche trotzdem mein Anfrage ein. Und merke nicht wie ich dabei anfang mich in kleinen, höfliche Häppchen über den Tisch zu schieben. Nicht, weil ich gern erkläre. Ich hab Angst das Irgendwo ein stilles Urteil fallen könnte. Weil ich es rechtzeitig abfangen will."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich merk es meist erst später. Wenn das Gespräch im Kopf zurückläuft, obwohl der Moment längst vorbei ist. Wenn mein Körper noch so tut, als müsste er aufpassen. Als könnte gleich etwas nachkommen. Dabei ist keiner mehr da der nachkommen könnte. Trotzdem hänge ich an diesem Punkt. An dem Moment, in dem ich angefangen habe, mich zu erklären, obwohl niemand gefragt hat."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich sehe das an mir. Und ich sehe es an anderen. Wir sprechen, als müsste das Recht auf Raum erst verdient werden."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dabei könnte es einfacher sein. Ein Bedürfnis ist kein Antrag. Es braucht keine Genehmigung, keine Begründung und keinen günstigen Moment. Es ist auch schon da, bevor es höflich verpackt wird."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Trotzdem fühlt es sich manchmal für mich genauso an. Als müsste jedes „Ich will” noch eine Beilage aus Gründen bekommen, damit es nicht nach „zu viel” klingt und ich mich dabei hinterherschiebe. Keine Sorge. Ich bin nicht kompliziert. Nicht unbequem. Ich nehme nicht zu viel Platz. Bitte sei nicht genervt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Von außen kann das sogar vernünftig klingen. Erwachsen oder nett. Zivilisiert sowieso. Die Worte werden poliert damit sie niemandem Wehtun können. Damit der andere sich nicht bewegen muss. Damit sich niemand ertappt fühlt und man gemocht werden kann."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Irgendwann merke ich. Dabei spreche ich so, dass der andere nicht ausweichen muss, und verschwinde dabei selbst."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Danach nehme ich mir vor, nicht überzuerklären. Klarheit ist nicht das Problem. Hinter dem Übermaß steckt selten Information. Ich denke es ist meistens Angst. Angst, dass ich nicht reiche, wenn es nicht logisch klingt. Dass mein Innenleben erst dann gültig ist, wenn es sich wie ein sauberer Vortrag anhört. Einleitung, Hauptteil, Fazit. Bitte mit Quellenangabe."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Man kann das sogar moralisch adeln. In Differenziertheit oder Reflexion. Erwachsene sehen mehrere Seiten. Erwachsene sind reflektiert."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Iss klar."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Klingt wie ein Du-Problem mit meinem Namen drauf."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Den Unterschied spüre ich im Körper. Erkläre ich um Verbindung zu schaffen oder um mich selbst nicht zu verlassen? Erklären, um Verbindung zu schaffen, richtet auf. Erklären, um nicht verlassen zu werden, mach kleiner. Ich will nicht fallen. Ich will gesehen werden."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dieser Reflex ist heute fast normal. Ablehnung kommt selten als klares Nein. Oft als ein Temperaturwechsel. Ein Blick weniger. Ein Zögern zwischen dem Satz. Der Ton, der minimal kippt. Ich ertrage nicht, dass der andere ungewiss bleibt, also mache ich ihn berechenbar und verliere uns dabei."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Diese Kälte lese ich, bevor sie ausgesprochen wird. Also versuche ich, sie zu verhindern. Ich schiebe Nebensätze hinterher, rechtfertige mich, entschärfe jedes Wort. Die Stimme wird kleiner, bevor jemand anderes die Gelegenheit bekommen könnte sie klein zu machen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Erklären wird zu einem Mantel. Es geht dabei nicht darum gut auszusehen, sondern nicht zu zittern."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das Perfide daran. Je mehr ich mich erkläre, desto weniger stehe ich. Ich klinge verhandelbar. Als würde ich selbst nicht ganz glauben, dass mir das zusteht. Als das ich meine Grenze höflich beantragen müsste. So nach dem Motto. Wenn ihr es nicht mögt, kann ich es auch anders gemeint haben. Ich habe Angst, Zugehörigkeit oder Wärme zu verlieren."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es kommt dieses schnelle Alles gut, sobald ich im Gesicht des anderen den kleinsten Schatten sehe. Manchmal gilt die Angst nicht dem anderen. Sondern mir selbst. Meinem Inneren, sobald es nicht gespiegelt wird. Begleitet von dem schäbigen Gefühl. Vielleicht war’s zu viel. Als wäre ich selbst der Makel, den ich abstellen sollte."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann passiert etwas, das nach Moral aussieht, aber Überleben ist. Ich werde achtsam und reflektier. So sehr, dass niemand mehr richtig etwas an mir festhalten kann. Ich zeige mich mit Sicherheitsabstand. Sage ich, mit „ich” im Konjunktiv. So fang ich an in einer Version von mir zu leben, die niemand anstößig finden kann."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das ist der Preis eines Klimas, in dem ich mich ständig beobachtet fühle. Weniger die große Zensur. Als die unscheinbare. Die, die ich mir selbst antue, weil ich es irgendwann gelernt habe. Zugehörigkeit hat Bedingungen. Es gibt eine richtige Art zu fühlen, eine richtige Art zu sprechen. Sogar dafür, wie viel Mensch man sein darf, scheint es ein Maß zu geben."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das Tückische: Meist bleibt alles freundlich. Feedback. Oder Diskurs."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Genau deshalb ist die Unsicherheit so zäh. Ich weiß nie, ob ich wirklich abgelehnt werde oder ob ich mich nur besser hätte erklären müssen. Also erkläre ich mich. Einmal. Noch einmal. Immer und immer wieder."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich werde gefragt, ob diese Texte wirklich von mir sind. Ich wünschte, ich wäre so gelassen, wie ich dann tue. Dabei springt in mir sofort dieser Reflex an. Als müsste ich belegen, dass ich echt sei. Mir das Recht, so zu fühlen, jedes Mal neu verdienen müsste."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich schreibe genau deshalb. Da ist etwas in mir, das raus will und keine Gestalt hat. Erst wenn es dasteht, erkenne ich es. Erst schreibend komme ich wirklich vor."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Die eigentliche Frage ist nicht, wer es geschrieben hat. Sondern was es in dir berührt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Da ist dieser Satz, der weniger nach Urteil klingt als Ertappen. Wer sich ständig erklärt, bittet um Erlaubnis zu existieren. Erklären ist nicht das Problem. Ständiges Erklären sagt: Dein Dasein ist verhandelbar."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Erkennbar daran, wie schnell ich mich relativiere. Kaum ist ein Gefühl ausgesprochen, hängt ein Aber daran. Und meine Grenzen klingen wie Vorschläge. Meine Grenzen erkenne ich oft erst, wenn sie überschritten wurden. Von anderen oder von mir selbst. Bitter, aber wahr."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das Nachbeben verrät es. Die Müdigkeit nach einem Gespräch, in dem ich zu nett war. Die Wut, die erst später auftaucht. Das Gefühl, mich irgendwo liegengelassen zu haben, nur damit die Verbindung nicht reißt. Das Gefühl kam nicht zu spät. Sein Platz war besetzt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Allmählich richtet sich mein ganzes Sprechen danach, was bloß nicht passieren darf. Konflikte. Streit. Ein Missverständnis. Irgendeine Ablehnung."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Jedes Mal derselbe Tausch. Anwesenheit gegen Berechenbarkeit. Kontakt wird nicht mehr ausgehalten, sondern verwaltet."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wir verwechseln ständig Perspektive und Wahrheit. Ich halte etwas für wahr. Du hältst etwas anderes für wahr. Zwei Menschen sitzen sich gegenüber, beide spüren. So ist es. Und nichtsdestotrotz leben wir in unterschiedlichen Welten."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Lasse ich das wirklich zu, muss ich weniger erklären. Dann reicht es, anzuerkennen. Mein Inneres taucht nicht automatisch in deinem System auf. Trotzdem bin ich nicht verpflichtet, es so lange umzubauen, bis es bei dir passt. Meine Wünsche, meine Positionen, meine Perspektive, mein Selbst. Das ist durch mein ganzes Leben geformt. Ich kenne dieses Leben. Du nicht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Was genau muss ich eigentlich erklären? Ich frag das nicht aus Trotz sonder stiller Logik. Es gibt Dinge, die brauchen kein Warum. Nicht, weil sie über allem stehen, sondern weil sie schon da sind. Wie ein Atem. Ich erkläre ja normalerweise auch nicht, warum ich atme. Ich atme einfach. Wenn ich nicht atme, merke ich das sofort."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Trotzdem fang ich immer wieder damit an Gründe nach zuliefern, als müsste ich beweisen, dass Recht so zu sein verdienen. Als das Persönlichkeit nur dann akzeptabel ist, wenn sie argumentativ wasserdicht sei."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Erwachsensein ist unaufgeregter. Nicht zu überzeugen, sondern zu stehen. Klingt leicht. Ist es nicht. Weil dann der Zweifel kommt. Was auch sonst. Natürlich kommt er. Vielleicht ist das zu hart. Bin ich egoistisch. Oder zu viel. Erklären kann ja auch Demut sein. Rücksicht. Und manchmal stimmt das. Nur kippt es so schnell."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wenn ich ehrlich bin, spüre ich das. An der Hast. Der kleinen Panik in den Nebensätzen. Dem Drang, mein Gefühl sofort zu entschärfen, bevor es jemand anderes tut."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Gefühle sind nicht gefährlich. Sie machen sichtbar, dass ich verletzlich bin. Verletzlichkeit ist heute oft nur dann erlaubt, wenn sie sich sofort wieder entschuldigt. Wenn sie gleich noch sagt. Ist schon okay. War nicht so gemeint. Vergiss es."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wer fest steht, muss nicht drängen oder überzeugen. Er darf sogar falsch liegen, ohne zu verschwinden. Und sagen: So ist es für mich."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Die Gegenbewegung ist keine große Geste. Sie ist fast langweilig und gerade deshalb schwer. Sie heißt, konsequent sein. Dieses stille: Tu, was du sagst. Sag, was du tust."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Was ich brauche, brauche ich. Was ich nicht will, will ich nicht. Wenn ich da bin, bin ich da."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich darf geben, ohne mich zu verlieren. Nähe zulassen, ohne mich als Eintrittskarte zu benutzen. Erklären, ohne um Erlaubnis zu bitten."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich glaube es sollte wirklich ganz klein beginnen. Ich lasse einen Satz weg. Atme einmal durch und halte aus, dass mein Gedanke noch im Raum steht. Ohne gleich beweisen zu müssen, dass ich es darf."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Einfach stehen bleiben und merken, dass die Welt nicht einstürzt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Kürzer im Außen. Klarer im Inneren. Nicht laut. Nicht siegreich."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und trotzdem da."]]}]}], "vermerk": "überarbeitet am 24.10.2026"}]}];
