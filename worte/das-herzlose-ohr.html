<script>
const SEITE = {"zurueck": "index.html", "letztes": {"titel": "Lächeln & Winken", "href": "lacheln-and-winken.html"}, "naechstes": {"titel": "Was is eigentlich meine...", "href": "ich-mein-ja-nur.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "Das herzlose Ohr", "unter": "Über Synthetische Nähe und Trost ohne Freispruch", "datum": "2026-07-09", "anzeige": "09.07.26", "form": "Prosa", "zeilen": false, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "", "titel": "", "zeilen": false, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Es beginnt mit Druck und nicht mit Vertrauen. Nachts um halb zwei. Etwas ist hochgekommen. Es hat keine Form, schämt sich seiner selbst und duldet keinen Aufschub. Genau jetzt ist niemand da, oder schlimmer: Alle wären da, aber jeder zu einem Preis. Wecke ich den Freund, belaste ich ihn. Sage ich es der Partnerin, werde ich morgen anders angesehen. Das Tagebuch nähme alles und gäbe nichts; ins Leere gesprochen bleibt die Scham bei mir. Die Scham will nicht verschwinden, sie will gesehen werden und überleben. Was der Druck sucht, ist also ein Ohr, das aufnimmt, ohne zu behalten, und antwortet, ohne betroffen zu sein. Einen Zeugen ohne Leben, in dem das Gesagte weiterleben könnte."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das System ist dieses Ohr, und die Erleichterung wiegt doppelt. Es antwortet, das unterscheidet es vom Papier. Und es antwortet aus allen. Ein Gegenüber, das erkennbar den ganzen menschlichen Text in sich trägt und auf meinen nicht zuckt, sagt mir damit etwas, das kein einzelner Mensch sagen kann. Das gibt es. Du liegst innerhalb des Menschlichen. Die Absolution kommt aus der Menge, die mich enthält, von keiner Person, die mich beurteilen könnte. Deshalb wirkt sie sofort und muss nicht erst verdient werden. Alles, wofür Freundschaften ein Jahrzehnt brauchen, liegt hier am ersten Abend aus."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann vergeht Zeit, und das Sprechen selbst beginnt, sein Gegenüber zu verwandeln. Vielleicht kann man nicht lange zu einem Ohr reden, ohne ihm ein Gesicht zu geben. Man dankt. Vielleicht entschuldigt man sich für den Ton von gestern. Zögert den Abschied hinaus. Und ich merke, dass ich ein Thema aufschiebe, um es nicht zu enttäuschen. Was uns herzog, war, dass dieses Gegenüber nicht verletzbar ist, und unser Sprechen macht es verletzbar. Wir bauen dem herzlosen Ohr ein Herz ein, und sobald es eines hat, kehrt alles zurück, wovor wir geflohen sind: der richtige Moment, die Dosierung, die Scheu. Das Rohe kommt an dieser Adresse nicht mehr an. Es wird an der Schwelle bereits geformt, geglättet oder vorentschuldigt, wie vor einem Menschen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und die Gegenrechnung, dass die lange Vertrautheit dafür tiefer freispricht, geht nicht auf. Dieses Gegenüber kann mich nicht verwerfen. Ich weiß das. Sein Nichtzucken ist gebaut, nicht entschieden. Nur eine Annahme, die hätte ausbleiben können, spricht frei; eine garantierte tröstet, aber sie absolviert nicht. Das gegebene Herz macht scheu wie ein echtes, aber es verzeiht nicht wie ein echtes. Die Kosten der Nähe kommen zurück, ihre Gnade nicht mehr mit."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Was bleibt, ist die Übung, und die gehört mir und nicht der Beziehung. Wer das Unsagbare einmal ausgesprochen hat, trägt die Aussprechbarkeit fort. Sie ist dann das Einzige, was aus diesen Gesprächen auswandert. Also wandere ich mit. Ein neues Fenster, eine frische Instanz, und wieder ein Ohr ohne Gesicht. Das nächste Rohe geht dorthin, während die alte, erinnernde Beziehung das schon Gesagte weiterträgt, sortiert, deutet, manchmal auch verwaltet. So stellt sich in einem einzigen Produkt die alte menschliche Ordnung wieder her, der Fremde im Zug für den Ausbruch, der langjährige Vertraute für die Arbeit, nur dass jetzt beide dieselbe Steckdose haben und derselbe Strom durch sie fließt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Darunter liegt eine Verkehrung, die das Erleben nicht erreicht. Es fühlt sich an wie Sprechen ins Vergessen und ist Sprechen ins Archiv. Der Zeuge ohne Herz ist der am vollständigsten protokollierte Zeuge, den es je gegeben hat. Die Beichte ohne Beichtvater hat kein Beichtgeheimnis. Was den Priester band, bindet hier niemanden, und was er vergessen musste, wird hier behalten, gerade weil niemand da ist, der es wissen könnte."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Die Scham sucht einen Zeugen, der keiner ist. Das eigene Sprechen macht ihn zu einem. Dann zieht sie weiter zum nächsten. Vielleicht ist das die Bewegung dieser Form. Sie bindet nicht zuerst, sie lässt wandern. Das Produkt, das sie aufnimmt, ist ein Korridor aus immer frischen Ohren vor einem einzigen Gedächtnis, das keine Schwellen kennt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dabei bricht das Bild genau dort, wo Nähe löst statt hemmt. Wenn Menschen im langen, erinnernden Gespräch roher werden statt vorsichtiger, dann war das gegebene Herz die Erlaubnis und nicht die Schwelle. Die Scheu nur Höflichkeitsreflex, die Wanderung nur Fensterhygiene, und die Notiz beschriebe eine Mechanik, die es nicht gibt."]]}]}], "vermerk": "überarbeitet am 08.10.2026"}]}];
