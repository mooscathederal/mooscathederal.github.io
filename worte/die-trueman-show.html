<script>
const SEITE = {"zurueck": "index.html", "letztes": {"titel": "Amélie", "href": "amelie.html"}, "naechstes": {"titel": "The Wire", "href": "the-wire.html"}};   // Textseiten: der Bau setzt hier Rückweg und Blättern ein
const TEXTE = [{"titel": "Die Tru(e)man Show", "unter": "Was wir Stabilität nennen, ist vielleicht nur Stillstand, der gelernt hat, gut auszusehen.", "datum": "2026-03-03", "anzeige": "13.02.26", "form": "Prosa", "zeilen": false, "leitsatz": false, "inline": false, "text": "", "fassungen": [{"name": "10.26", "titel": "", "zeilen": false, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Seit ich den „starken Mann“ oft angespannt statt weise sehe, frage ich mich, wann Autorität nur laut gewordene Angst ist. Stärke bloß der Versuch, das Zittern zu übertönen. Oder ein Platz, den einer nicht verlieren will."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Was wir Stabilität nennen erscheint mir oft Stillstand zu sein, der gelernt hat, gut auszusehen. Von außen läuft das Leben. Termine werden gehalten. Aufgaben erledigt. Das kann sogar beruhigen, solange es nicht Angst ist, die da steuert."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Schwierig wird es, wenn ich mir heimlich Grenzen ziehe und anfange, das Leben wie ein Projekt zu behandeln, das nicht scheitern darf. Begleitet von dem Gefühl, alles geregelt zu haben, ohne das die Regel hält. Ich selbst komm kaum noch voran. Dann passiert was Leises. Ein Abblenden."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Hier ist Stillstand mehr als \"keine Bewegung\". Außen klappt alles und innen will nichts mehr nach vorn. Viel tun, weniger spüren. Das Gemeine ist, dass sich das erst gar nicht falsch anfühlt. Zu glaube es sei \"Erwachsen\", \"kontrolliert\" oder \"Verantwortungsbewusst\" steht dabei schon im Vorfeld als \"Regel\" fest. Und manchmal stimmt das wahrscheinlich. "]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Weniger stark reagieren, nicht mehr ausbrechen und \"alles im Griff haben\". Das sieht nach Kompetenz aus. Und kann auch Kontrolle sein, die gelernt hat, sich gut zu verstecken. Hinter Höflichkeit, einem „Alles gut“ oder hinter einem Lächeln, das vorallem dann auftaucht, wenn ich glaube, dass es meint erwartet zu werden. "]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Das Leben lässt sich nicht nur Mechanik auf Mechanik reduzieren. Ich bin kein Werkzeug. Auch wenn ich mich so behandle. Wer alles absichern will, steht unter Spannung. Auch dann, wenn es ruhig aussieht. Das merk ich an Kleinigkeiten. Der berüchtigte feste Kiefer, ein steifer Nacken. Wenn die Stimme dem Ton vorauseilt. Oder flacheres Atmen, eine innere Wachsamkeit, die sich als „Reife“ tarnt. Vom Ich als Erleben zum Ich als Gegenstand. "]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dabei verwechsle wir Stillstand mit Stabilität. Ohne das es je als überzeugt auftritt. Vielleicht will ich bloß keine Unruhe machen. Oder nicht ins Kreuzfeuer geraten. Was Kreuzfeuer hier bedeuten soll weiß ich nicht. Es gehört trotzdem rein. "]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Stabilität klingt nach Wurzeln, und Wurzeln sind wichtig. Nur tragen Wurzeln, wenn sie in mehrere Richtungen wachsen. Klingt nach Entfalltung. In meinem Fall hängt alles nur an einer Rolle, Routine oder Erwartung. Dann wird es eng. Das wirkt stabil, und macht verletzlich. So hängt alles an einem „So macht man das“. Dann reicht ein Moment, der nicht ins System passt.  Wie ein Sozialarbeiter, glaube ich, sagen würde: Es wird „schwierig“, wenn zum Beispiel eine Tischtennisplatte aus dem Fenster im dritten Stock fliegt oder ein Kilogramm Kokain in der Sockenschublade auftaucht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ruhig leben und dabei gedämpft sein. „Sei der Stein in der Brandung“ soll nach Halt klingen. Ich höre für gewöhnlich: Bitte fühl nicht so viel, mach es nicht kompliziert. Bleib berechenbar! Dann ist Stabilität weniger Wurzel und mehr Betäubung. Wenn Vorhersagbarkeit mehr zählt als das Geschehen. "]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dabei kommt oft so etwas wie \"Ich brauch nicht mehr\". Klingt vernünftig, und is wahrscheinlich auch nicht ganz falsch. Oder es ist Angst, die sich als Bescheidenheit verkleidet. Ein unauffälliges „Passt schon“, das ich so oft wiederholt habe, bis es mir als Wahrheit erscheint."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich nehm Angst nicht als Feind. Angst is etwas Gelerntes. Sie kann zeigen, was sonst keinen Ort gefunden hätte. Und sie mischt sich in Abläufe, die irgendwann Vorsicht Verantwortung oder Reife bedeuten sollen. Bis daraus die Gewohnheit wird, mich klein zu halten, damit bloß nichts schiefgeht."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Manche Bedrohungen gibt es nur auf dem Papier. Manche nicht. Ich kann nicht sagen was welche gemeint is. Und um sie zu vermeiden, vermeide ich dann gleich alles, was mich bewegen könnte. Auch das, was mir zeigen könnte, welche welche is. Dann leb ich um die Angst herum. Und fang an zu Reagieren bevor eine Wahlaufkommen könnte. "]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ja zu Terminen sagen, weil es leichter ist als Nein. Zuverlässig sein, schnell antworten, Wort halten, und sich trotzdem auf kaum was freuen. Der Kalender wirkt dabei wie ein gut sortierter Käfig."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich kann vieles richtig machen, und innen bleibt es flach. So ein „Es ist okay“, das wie Enttäuschung klingt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich bleib nich stehen, weil nichts ginge. Also bleib ich bei dem, was ich kenne, und nenn das dann „Sein“ oder \"Ankommen\"."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Manchmal ist es auch ein nötiger Rückzug. Eine Phase, in der ich mich Erhole um nicht zu zerbrechen. Nur vergesses ich dabei, dass es eine Pause gab."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Der Stillstand, den ich mein, ist meist gar kein Mangel an Optionen. Mir fehlt die Erlaubnis. Fehler machen dürfen, Kontrolle abzugeben, dabei nicht perfekt zu reagieren. Nur weiß ich nicht mehr, was wann kommen soll."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wer alles beherrschen will, kämpft ständig gegen Realität. Nur bewegt Realität sich, so wie wir auch, leise, so unscheinbar dass ich es erst merke, wenn die Pause vergessen ist. "]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Stabilität wär dann ein Stand, bei dem wir wackeln dürfen, ohne zu fallen. Kein starres Halten. Ob ich fall, liegt aber auch an dem, worauf ich steh."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und Anpassung sieht aus wie Reife kann aber auch nur gutes Timing sein. Wie beim Familienessen, das sich anfühlt wie ein Theaterstück, die Rollen schon verteilt. Die richtigen Sätze, an den passenden Stellen lachen, höflich bleiben. Und erst später merken, dass ich kaum vorkam. Nur anwesend war."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Stabilität heißt auch, die eigene Wahrnehmung zu prüfen. Dabei nicht jede innere Warnung für Wahr zuhalten. Nicht jede Spannung für Gefahr. Wobei, genau das tut mein Körper schon die ganze Zeit. Im Kopf lässt sich das aber nicht prüfen. "]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Stabilität heißt, mich wieder dem Leben zuzuwenden. Entscheiden was ich leben will, statt nur zu meiden, was ich fürchte. Ein Gespräch, das ich nicht auf später verschiebe. Ich wüsste sogar, welches. Ein Schritt, bei dem ich nicht weiß, ob ich \"gut\" darin bin. Ein Nein, das leise bleiben kann, ohne dabei zu zittern. "]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich denke es braucht einen anderen Maßstab, der weniger nach Sicherheit und mehr nach Leben klingt. Ob Leben funktioniert, ist das eine. Ob es sich anfühlt, weiß ich noch nicht."]]}]}], "vermerk": "überarbeitet am 13.10.2026"}, {"name": "02.26", "titel": "", "zeilen": false, "bloecke": [{"t": "p", "z": [{"f": 0, "r": [["n", "Seit ich den „starken Mann” oft angespannt statt weise sehe, frage ich mich, wie oft Autorität nur laut gewordene Angst ist. Und Stärke bloß der Versuch, das Zittern zu übertönen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Was wir Stabilität nennen, ist manchmal Stillstand, der gelernt hat, gut auszusehen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Von außen wirkt so ein Leben funktional. Es läuft, hält Termine ein und erfüllt seine Aufgaben. Das kann beruhigen. Solange es nicht von Angst gesteuert wird."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Schwierig wird es, wenn dieses Funktionieren enger macht. Wenn man sich heimlich Grenzen zieht. Wenn das Leben wie ein Projekt behandelt wird, das nur nicht scheitern darf. Wenn das Gefühl, alles geregelt zu haben, häufiger wird und man dabei selbst kaum noch vorankommt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dann passiert etwas Leises. Kein Knall. Ein Abblenden."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Stillstand ist mehr als das Fehlen von Bewegung. Stillstand ist, wenn außen alles klappt und innen nichts mehr nach vorn will. Wenn man viel tut und dabei weniger spürt. Das Gemeine ist, dass es sich zuerst gar nicht falsch anfühlt. Es fühlt sich erwachsen an, kontrolliert und vernünftig."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wenn man weniger stark reagiert. Nicht mehr ausbricht. Alles im Griff hat. Das sieht nach Kompetenz aus. Und manchmal ist es das auch. Aber manchmal ist es Kontrolle, die sich gut versteckt. Versteckt hinter Höflichkeit. Hinter einem „Alles gut”. Oder dem Lächeln, das pünktlich erscheint, sobald es erwartet wird."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Nur ist das Leben kein Mechanismus. Es lässt sich nicht wie ein Ablaufplan sichern. Wer alles absichern will, steht unter Spannung. Auch wenn es ruhig aussieht. Und das merkt man selten an großen Gedanken. Man merkt es an Kleinigkeiten. Ein fester Kiefer. Flacheres Atmen. Innere Wachsamkeit, die sich als „Reife” tarnt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Irgendwann fällt einem auf, dass man Stabilität mit Stillhalten verwechselt hat. Nicht weil man überzeugt war. Es war der leise Wunsch, bloß keine Unruhe zu erzeugen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Stabilität klingt nach Wurzeln. Und Wurzeln sind wichtig. Nur tragen sie vor allem dann, wenn sie in mehrere Richtungen wachsen. Man könnte das Entfaltung nennen. Sobald man sich nur an eine Form von Sicherheit bindet, wird es eng. Eine Rolle, eine Routine, eine Erwartung. Das kann stabil wirken, macht aber auch verletzlich, weil alles an einem einzigen „So macht man das” hängt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und dann reicht manchmal ein Moment, der nicht ins System passt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wie ich glaube ein Sozialarbeiter sagen würde: Es wird „schwierig” wenn zum Beispiel eine Tischtennisplatte aus dem Fenster im dritten Stock fliegt oder 1Kilogramm Kokain in der Sockenschublade auftauchen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Man kann ruhig leben und dabei gedämpft sein."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Der Satz „Sei der Stein in der Brandung” klingt nach Halt. Und manchmal heißt er eigentlich, bitte fühl nicht so viel und mach es nicht kompliziert. Bitte bleib berechenbar. Dann klingt Stabilität weniger nach Wurzeln und mehr nach Betäubung."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Man kann sagen, ich brauche nicht mehr. Und manchmal stimmt das. Manchmal ist es wirklich genug. Und manchmal ist es Angst, die sich als Bescheidenheit verkleidet. Nicht dramatisch, wie ein unauffälliges „Passt schon”, das man so oft sagt, bis es nach Wahrheit klingt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich sehe Angst nicht als Feind. Sie ist etwas Gelerntes. Etwas, das sich in Abläufe mischt, die dann Vorsicht, Verantwortung oder Reife heißen. Und manchmal ist das auch genau das. Und andere Male ist es nur die alte Gewohnheit, sich klein zu halten, damit bloß nichts schiefgehen kann."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Unser Verstand baut Bedrohungen, die nur auf dem Papier existieren. Und um sie zu vermeiden, vermeidet man gleich alles, was einen bewegen könnte. Dann lebt man nicht mehr gegen die Angst. Man lebt um sie herum. Oder sogar für sie, als wäre sie die Instanz, die entscheidet, was „vernünftig” ist."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich meine damit nicht die Ruhe, die gut tut. Oder diese Momente, in denen alles still wird und man aufatmen kann. Ich meine die Ruhe, die dämpft, sich vernünftig anfühlt, in die Welt passt und sogar gelobt wird."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wenn man Ja zu Terminen sagt, weil es leichter ist als Nein zu sagen. Wenn man zuverlässig ist, schnell antwortet, sein Wort hält und sich trotzdem auf kaum etwas freuen kann. Dann wirkt der Kalender wie ein gut sortierter Käfig, und man merkt es erst später. Nicht im Moment. Danach."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Man kann vieles richtig machen und innen bleibt es flach."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Dieses flache Gefühl ist manchmal keine Traurigkeit. Es ist das Ausbleiben von Intensität. Dieses „Es ist okay”, das wie Enttäuschung klingt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wie bei Prokrastination. Man bleibt nicht stehen, weil nichts möglich wäre. Man bleibt stehen, weil zu viel möglich wäre. Weil Fehler Angst machen und man beim Bekannten, Sicheren und Bewährten bleibt und das dann „Ankommen” nennt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht war es sogar ein nötiger Rückzug. Eine Phase, die Erholung brauchte, um nicht zu zerbrechen. Nur sind Pausen keine Lebensform."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ich glaube, wir halten manchmal aus Gewohnheit, Stolz und Angst an Wegen fest, die uns nicht mehr dorthin führen, wo wir hinwollen. Und dabei verlieren wir Zeit. Zeit ist das Wertvollste, was wir haben."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Der Stillstand, den ich meine, ist oft kein Mangel an Optionen. Er ist ein Mangel an innerer Erlaubnis. Die Erlaubnis, Fehler zu machen, Kontrolle abzugeben und nicht perfekt zu reagieren."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Wer alles beherrschen will, kämpft ständig gegen die Realität. Nur bewegt sich Realität. So wie wir uns auch bewegen. Manchmal so leise, dass wir es erst merken, wenn wir müde sind. Nicht vom Tag. Von uns."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es kippt dort, wo dieses „Ordnung muss sein” anfängt, wie ein beruhigendes Lebensgefühl zu klingen. Dann wird Ordnung wichtiger als das Leben darin. Ordnung ist nicht falsch. Sie wird nur zur Hauptsache."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Echte Stabilität ist nicht das starre Halten einer Position. Sie ist Balance. Nicht zu viel Druck. Nicht zu wenig. Ein Stand, bei dem man wackeln darf, ohne zu fallen."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Es gibt zwei Arten von Ruhe. Eine, die nährt und wieder mehr Leben möglich macht. Und eine, die dämpft und danach weniger Leben übriglässt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und manchmal sieht Anpassung aus wie Reife, obwohl es nur gutes Timing ist. Wie beim Familienessen, das sich anfühlt wie ein Theaterstück, in dem jede Rolle schon verteilt ist. Man sagt die richtigen Sätze, lacht an den passenden Stellen, bleibt höflich und merkt erst später, dass man selbst kaum vorkam. Nur anwesend."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Stabilität bedeutet auch, die eigene Wahrnehmung zu prüfen. Nicht jede innere Warnung für Wahrheit zu halten. Nicht jede Spannung für Gefahr."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Und Stabilität kann auch bedeuten, sich wieder vorsichtig dem zuzuwenden, was man leben will. Nicht immer nur zu meiden, was man fürchtet. Nicht groß. Nicht perfekt. Nur echt."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Ein Gespräch, das man nicht auf später schiebt. Ein Schritt, bei dem man nicht sicher ist, ob man gut darin ist. Ein Nein, das leise bleibt, aber stimmt. Eine Entscheidung, die nicht nur bequem ist."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Stillstand verwaltet. Stabilität trägt. Der Unterschied ist leise, aber man spürt ihn."]]}]}, {"t": "p", "z": [{"f": 0, "r": [["n", "Vielleicht braucht es am Ende einen anderen Maßstab. Einen, der weniger nach Sicherheit klingt und mehr nach Leben. Ob ein Leben funktioniert, ist das eine. Ob es sich anfühlt, bleibt die Frage."]]}]}], "vermerk": ""}]}];
