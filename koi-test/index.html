<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Koi End-to-End Test</title>
<style>
  html,body{margin:0;height:100%;background:#0a0e0b;overflow:hidden;font:13px/1.4 ui-sans-serif,system-ui;color:#dfe6da}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
       padding:8px 12px;background:rgba(10,14,11,.72);backdrop-filter:blur(4px);z-index:5}
  #hud button{background:#1c2a1f;color:#e8f0e4;border:1px solid #3a4a3c;padding:5px 10px;cursor:pointer;font:12px/1 ui-sans-serif}
  #hud button.on{background:#2f5a38}
  #stats{margin-left:auto;font-variant-numeric:tabular-nums;color:#a9bda3;white-space:pre-wrap;text-align:right}
  .demo-title{position:absolute;left:6%;top:16%;color:#fff;font:700 clamp(28px,5vw,64px)/1.05 Georgia,serif;
       text-shadow:0 2px 18px rgba(0,0,0,.35);pointer-events:none}
  .demo-sub{position:absolute;left:6%;top:calc(16% + 4.6em);color:#eef4ec;font:400 clamp(13px,1.6vw,19px)/1.4 Georgia,serif;
       text-shadow:0 1px 10px rgba(0,0,0,.4);pointer-events:none}
</style>
</head>
<body>
  <div id="hud">
    <button data-k="occl" class="on">Occlusion</button>
    <button data-k="curved" class="on">Gekrümmte Spine</button>
    <button data-k="text" class="on">Text-Overlay</button>
    <button data-n="10">10</button>
    <button data-n="20">20</button>
    <button data-n="30" class="on">30</button>
    <button data-n="40">40</button>
    <button data-k="reset">Stats↺</button>
    <span id="stats">…</span>
  </div>
  <div id="stage">
    <div class="demo-title" id="ttl">mooscathederal</div>
    <div class="demo-sub" id="sub">Persönliche Wissenschaft — Philosophie, Logik, MINT</div>
  </div>
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
  <script type="module" src="./main.js"></script>
</body>
</html>
