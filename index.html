<style>
  /* Startebene: kein Schleier. Der Ort bleibt, nur der Fokus wechselt: die Ordner kommen in den Blick. */
  :root { --tief: 0; --ordner: #a8c7cc; --ordner-reiter: #8fb0b6; }   /* Bordeaux: #7c4f5a / #6a414b */
  html { scroll-snap-type: y proximity; }
  .schleier { display: none; }
  .oben { height: 100vh; height: 100svh; position: relative; scroll-snap-align: start; }
  .oben h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .abwaerts {
    position: absolute; left: 50%; bottom: calc(1.4rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    display: grid; justify-items: center; gap: .5rem; text-decoration: none;
    opacity: calc(.85 - var(--tief) * 3); text-shadow: 0 1px 6px rgba(0,0,0,.6);
  }
  .abwaerts .kapitaelchen { color: var(--schrift-farbe); }
  .abwaerts::after { content: ""; width: 1px; height: 2.2rem; background: linear-gradient(var(--schrift-farbe), transparent); }
  .unten { min-height: 100vh; min-height: 100svh; scroll-snap-align: start; display: grid; place-items: center; padding: 4rem 1rem calc(4rem + env(safe-area-inset-bottom, 0px)); }
  .reihe {
    list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(2.5rem, 8vw, 6rem);
    opacity: calc(.15 + .85 * var(--tief)); transform: translateY(calc(30px * (1 - var(--tief))));
  }
  .symbol { display: grid; justify-items: center; gap: .45rem; text-decoration: none; color: #fff; }
  .symbol .bild { width: clamp(6.5rem, 16vw, 8rem); aspect-ratio: 120 / 96; position: relative; filter: drop-shadow(1px 2px 2px rgba(0, 0, 0, .45)); }
  
  .symbol .name { font: 1.05rem/1.2 var(--aussen); padding: 1px 4px; text-shadow: 1px 1px 0 #000, 0 0 6px rgba(0,0,0,.6); }
  .symbol:hover .name, .symbol:focus-visible .name { text-decoration: underline; text-underline-offset: 2px; }
  .ordner svg { width: 100%; height: 100%; display: block; }
  .stapel img {
    position: absolute; left: 12%; top: 8%; width: 76%; height: auto; aspect-ratio: 4 / 3; object-fit: cover;
    background: #fff; border-radius: 1px; box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }
  .stapel img:nth-child(1) { transform: translate(-9%, 6%) rotate(-9deg); }
  .stapel img:nth-child(2) { transform: translate(8%, -3%) rotate(6deg); }
  .stapel img:nth-child(3) { transform: translate(-2%, 10%) rotate(-2.5deg); }
  .stapel img:nth-child(4) { transform: translate(4%, 14%) rotate(3.5deg); }
  
  .stapel img { transition: transform .25s ease; }
  @media (prefers-reduced-motion: reduce) { .symbol .bild, .stapel img { transition: none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="holz"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter></svg><div class="wald" aria-hidden="true"></div>

<main class="ebene">

  <section class="unten" id="seiten" aria-label="Seiten">
    <ul class="reihe">
      <li>
        <a class="symbol ordner" href="blog/">
          <span class="bild"><svg viewBox="0 0 120 96" aria-hidden="true">
            <defs>
              <linearGradient id="vorn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ordner)" stop-opacity=".97"/><stop offset="1" stop-color="var(--ordner)"/></linearGradient>
              <linearGradient id="glanz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".08"/></linearGradient>
            </defs>
            <path d="M4 14 Q4 6 12 6 H40 Q45 6 48 10 L52 15 H108 Q116 15 116 23 V84 Q116 92 108 92 H12 Q4 92 4 84 Z" fill="var(--ordner-reiter)"/>
            <path d="M4 30 Q4 22 12 22 H108 Q116 22 116 30 V84 Q116 92 108 92 H12 Q4 92 4 84 Z" fill="url(#vorn)"/>
            <path d="M4 30 Q4 22 12 22 H108 Q116 22 116 30 V84 Q116 92 108 92 H12 Q4 92 4 84 Z" fill="url(#glanz)"/>
          </svg></span>
          <span class="name">Schriften</span>

</main>

<script type="module">
import "./raum.js";
// Hochwischen = tiefer in den Raum: Schleier, Unschärfe und Kacheln folgen der Scrolltiefe.
const wurzel = document.documentElement;
let raf = 0;
const setze = () => { raf = 0; wurzel.style.setProperty("--tief", Math.min(1, Math.max(0, scrollY / (innerHeight * 0.85))).toFixed(3)); };
addEventListener("scroll", () => { if (!raf) raf = requestAnimationFrame(setze); }, { passive: true });
addEventListener("resize", setze); setze();
</script>
</body>
