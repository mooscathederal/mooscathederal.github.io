<style>

if (new URLSearchParams(location.search).has("diag")) addEventListener("DOMContentLoaded", () => {
  const box = Object.assign(document.createElement("div"), { style: "position:fixed;left:6px;bottom:6px;z-index:99;font:11px/1.35 ui-monospace,monospace;color:#fff;background:rgba(160,0,0,.85);padding:5px 7px;border-radius:4px;white-space:pre;pointer-events:none;max-width:94vw" });
  document.body.append(box);
  const d = document.documentElement, v = window.visualViewport || {}, log = [];
  let letzt = "laden", alt = { y: scrollY, s: v.scale || 1, w: d.scrollWidth };
  const merk = (s) => { log.push(new Date().toTimeString().slice(3, 8) + " " + s); if (log.length > 7) log.shift(); };
  const zeig = () => {
    const n = { y: scrollY, s: v.scale || 1, w: d.scrollWidth };
    if (Math.abs(n.y - alt.y) > 150) merk(`SPRUNG y ${Math.round(alt.y)}→${Math.round(n.y)} nach ${letzt}`);
    if (Math.abs(n.s - alt.s) > 0.15) merk(`ZOOM ${alt.s.toFixed(2)}→${n.s.toFixed(2)} nach ${letzt}`);
    if (n.w !== alt.w) merk(`BREITE ${alt.w}→${n.w} nach ${letzt}`);
    alt = n;
    box.textContent = `Breite ${d.scrollWidth} / Höhe ${d.scrollHeight}\nscrollY ${Math.round(scrollY)}  Zoom ${(v.scale || 1).toFixed(2)}  oben ${Math.round(v.pageTop || 0)}\n` + log.join("\n");
  };
  for (const e of ["pointerdown", "pointerup", "click", "touchend", "dblclick"]) addEventListener(e, () => { letzt = e; setTimeout(zeig, 0); }, true);
  addEventListener("scroll", zeig, { passive: true });
  v.addEventListener && v.addEventListener("scroll", zeig); v.addEventListener && v.addEventListener("resize", zeig);
  new MutationObserver(() => { letzt = "Kartenwechsel"; zeig(); }).observe(document.getElementById("zaehler"), { childList: true, characterData: true, subtree: true });
  setInterval(zeig, 250); zeig();
});

let deck = [...MEMES];
let idx = 0;
let historyStack = [];

const buehne = document.getElementById("buehne");
const zaehler = document.getElementById("zaehler");
const btnZurueck = document.getElementById("btn-zurueck");
const btnMischen = document.getElementById("btn-mischen");

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function preload(start) {
  for (let k = 1; k <= 3; k++) {
    const m = deck[(start + k) % deck.length];
    const im = new Image();
    im.src = "memes/" + encodeURIComponent(m);
  }
}

// 26.11.2026: Zwei feste Karten, die nur Bild und Rolle tauschen. Vorher baute render() bei jedem Wechsel
// beide Karten neu, auch die unter dem Finger; auf iOS-Safari sprang die herangezoomte Ansicht dabei ans Seitenende.
function makeCard(cls) {
  const el = document.createElement("div");
  el.className = "bildkarte " + cls;
  const img = document.createElement("img");
  img.alt = "Meme";
  img.draggable = false;
  el.appendChild(img);
  return el;
}

function setzeBild(karte, name) {
  const src = "memes/" + encodeURIComponent(name);
  const img = karte.firstChild;
  if (img.getAttribute("src") !== src) img.setAttribute("src", src);
}

function ruhe(karte, rolle) {
  karte.style.transition = "none";
  karte.style.transform = "";
  karte.style.opacity = "";
  karte.className = "bildkarte " + rolle;
}

const karteA = makeCard("oben"), karteB = makeCard("unten");
buehne.append(karteA, karteB);
let oben = karteA, unten = karteB;
let animating = false;

function render() {
  ruhe(oben, "oben");
  ruhe(unten, "unten");
  setzeBild(oben, deck[idx]);
  setzeBild(unten, deck[(idx + 1) % deck.length]);
  void oben.offsetWidth;   // Ruhelage übernehmen, bevor Übergänge wieder greifen
  oben.style.transition = "";
  unten.style.transition = "";
  zaehler.textContent = (idx + 1) + " / " + deck.length;
  btnZurueck.disabled = historyStack.length === 0;
  preload(idx);
}

function fling(dir) {
  if (animating) return;
  animating = true;
  const flieg = oben, naechste = unten;
  const dist = (window.innerWidth * 0.85 + 320) * dir;
  flieg.style.transition = "transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.28s ease";
  flieg.style.transform = `translate3d(${dist}px, 28px, 0) rotate(${dir * 22}deg)`;
  flieg.style.opacity = "0";
  naechste.style.transform = "scale(1) translateY(0)";
  naechste.style.opacity = "1";
  setTimeout(() => {
    historyStack.push(idx);
    idx = (idx + 1) % deck.length;
    oben = naechste;   // die nachrückende Karte bleibt liegen und wird zur oberen
    unten = flieg;     // die weggeflogene kehrt unsichtbar als untere zurück
    animating = false;
    render();
  }, 240);
}

let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false, startT = 0, activePid = null;

function endDrag(e) {
  if (!dragging || (e && e.pointerId !== activePid)) return;
  dragging = false;
  try { if (activePid !== null) oben.releasePointerCapture(activePid); } catch {}
  activePid = null;
  const dt = Math.max(16, performance.now() - startT);
  const vx = dx / dt;
  if (Math.abs(dx) > 75 || Math.abs(vx) > 0.38) {
    fling(dx >= 0 ? 1 : -1);
  } else {
    oben.style.transition = "transform 0.26s cubic-bezier(0.2, 0.9, 0.3, 1)";
    oben.style.transform = "translate3d(0, 0, 0) rotate(0deg)";
    unten.style.transform = "scale(0.95) translateY(10px)";
    unten.style.opacity = "0.65";
  }
}

for (const k of [karteA, karteB]) {
  k.addEventListener("pointerdown", e => {
    if (k !== oben || animating) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    dragging = true;
    activePid = e.pointerId;
    startX = e.clientX;
    startY = e.clientY;
    dx = 0; dy = 0;
    startT = performance.now();
    k.style.transition = "none";
    try { k.setPointerCapture(e.pointerId); } catch {}
  });
  k.addEventListener("pointermove", e => {
    if (k !== oben || !dragging || e.pointerId !== activePid) return;
    dx = e.clientX - startX;
    dy = e.clientY - startY;
    k.style.transform = `translate3d(${dx}px, ${dy * 0.28}px, 0) rotate(${dx * 0.045}deg)`;
    const prog = Math.min(1, Math.abs(dx) / 140);
    unten.style.transform = `scale(${(0.95 + 0.05 * prog).toFixed(3)}) translateY(${(10 * (1 - prog)).toFixed(1)}px)`;
    unten.style.opacity = (0.65 + 0.35 * prog).toFixed(2);
  });
  k.addEventListener("click", e => {
    if (k === oben && e.pointerType === "mouse" && Math.abs(dx) < 6 && Math.abs(dy) < 6) fling(1);
  });
  k.addEventListener("pointerup", endDrag);
  k.addEventListener("pointercancel", endDrag);
}

btnZurueck.addEventListener("click", () => {
  if (animating || historyStack.length === 0) return;
  idx = historyStack.pop();
  render();
});
btnMischen.addEventListener("click", () => {
  if (animating) return;
  shuffle(deck);
  idx = 0;
  historyStack = [];
  render();
});

addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") fling(-1);
  else if (e.key === "ArrowRight") fling(1);
  else if (e.key === "Backspace" || e.key.toLowerCase() === "z") btnZurueck.click();
});

shuffle(deck);
render();
</script>
