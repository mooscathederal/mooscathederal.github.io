IMG_1326.jpg", "IMG_1349.jpg", "IMG_1351.jpg", "IMG_1352.jpg", "IMG_1354.jpg", "IMG_1358.jpg", "IMG_1359.jpg", "IMG_1363.jpg", "IMG_1364.jpg", "IMG_1367.jpg", "IMG_1368.jpg", "IMG_1373.jpg", "IMG_1374.jpg", "IMG_1398.jpg", "IMG_1402.jpg", "IMG_1405.jpg", "IMG_1408.jpg", "IMG_7295.jpg", "IMG_7297.jpg", "IMG_7299.jpg", "IMG_7301.jpg", "IMG_7315.jpg", "IMG_7322.jpg", "IMG_7324.jpg", "IMG_7326.jpg", "IMG_7333.jpg", "IMG_7334.jpg", "IMG_7336.jpg", "IMG_7337.jpg", "IMG_7338.jpg", "IMG_7349.jpg", "IMG_7350.jpg", "IMG_7356.jpg", "IMG_7357.jpg", "IMG_7363.jpg", "IMG_7595.jpg", "IMG_8663.jpg", "IMG_9418.jpg", "IMG_9446.jpg", "IMG_9449.jpg", "IMG_9450.jpg", "IMG_9452.jpg", "IMG_9455.jpg", "IMG_9463.jpg", "IMG_9517.jpg", "IMG_9519.jpg", "IMG_9522.jpg", "chill-brah.jpg", "go-on-katze.jpg", "history-as-a-hobby.jpg", "jesus-grammatikkorrektur.jpg", "kehrschaufel-grenzwert.jpg", "zigaretten-nettogewinn.jpg"];
let deck = [...MEMES];
let idx = 0;
let historyStack = [];

const buehne = document.getElementById("buehne");
const zaehler = document.getElementById("zaehler");
const btnZurueck = document.getElementById("btn-zurueck");
const btnMischen = document.getElementById("btn-mischen");

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function preload(start) {
  for (let k = 1; k <= 3; k++) {
    const m = deck[(start + k) % deck.length];
    const im = new Image();
    im.src = "memes/" + encodeURIComponent(m);
  }
}

function makeCard(name, cls) {
  const el = document.createElement("div");
  el.className = "karte " + cls;
  const img = document.createElement("img");
  img.src = "memes/" + encodeURIComponent(name);
  img.alt = "Meme";
  img.draggable = false;
  el.appendChild(img);
  return el;
}

let animating = false;

function render() {
  buehne.innerHTML = "";
  const nextIdx = (idx + 1) % deck.length;
  const nextCard = makeCard(deck[nextIdx], "unten");
  const topCard = makeCard(deck[idx], "oben");
  buehne.append(nextCard, topCard);
  zaehler.textContent = (idx + 1) + " / " + deck.length;
  btnZurueck.disabled = historyStack.length === 0;
  preload(idx);
  attachDrag(topCard, nextCard);
}

function fling(dir, topCard, nextCard) {
  if (animating) return;
  animating = true;
  const dist = (window.innerWidth * 0.85 + 320) * dir;
  topCard.style.transition = "transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.28s ease";
  topCard.style.transform = `translate3d(${dist}px, 28px, 0) rotate(${dir * 22}deg)`;
  topCard.style.opacity = "0";
  if (nextCard) {
    nextCard.style.transform = "scale(1) translateY(0)";
    nextCard.style.opacity = "1";
  }
  setTimeout(() => {
    historyStack.push(idx);
    idx = (idx + 1) % deck.length;
    animating = false;
    render();
  }, 240);
}

function attachDrag(topCard, nextCard) {
  let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false, startT = 0, activePid = null;

  topCard.addEventListener("pointerdown", e => {
    if (animating) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    dragging = true;
    activePid = e.pointerId;
    startX = e.clientX;
    startY = e.clientY;
    dx = 0; dy = 0;
    startT = performance.now();
    topCard.style.transition = "none";
    try { topCard.setPointerCapture(e.pointerId); } catch {}
  });

  topCard.addEventListener("pointermove", e => {
    if (!dragging || e.pointerId !== activePid) return;
    dx = e.clientX - startX;
    dy = e.clientY - startY;
    const rot = dx * 0.045;
    topCard.style.transform = `translate3d(${dx}px, ${dy * 0.28}px, 0) rotate(${rot}deg)`;
    const prog = Math.min(1, Math.abs(dx) / 140);
    if (nextCard) {
      const sc = 0.95 + 0.05 * prog;
      const ty = 10 * (1 - prog);
      nextCard.style.transform = `scale(${sc.toFixed(3)}) translateY(${ty.toFixed(1)}px)`;
      nextCard.style.opacity = (0.65 + 0.35 * prog).toFixed(2);
    }
  });

  topCard.addEventListener("click", e => {
    if (e.pointerType === "mouse" && Math.abs(dx) < 6 && Math.abs(dy) < 6) {
      fling(1, topCard, nextCard);
    }
  });

  function endDrag(e) {
    if (!dragging || (e && e.pointerId !== activePid)) return;
    dragging = false;
    try { if (activePid !== null) topCard.releasePointerCapture(activePid); } catch {}
    activePid = null;
    const dt = Math.max(16, performance.now() - startT);
    const vx = dx / dt;
    if (Math.abs(dx) > 75 || Math.abs(vx) > 0.38) {
      fling(dx >= 0 ? 1 : -1, topCard, nextCard);
    } else {
      topCard.style.transition = "transform 0.26s cubic-bezier(0.2, 0.9, 0.3, 1)";
      topCard.style.transform = "translate3d(0, 0, 0) rotate(0deg)";
      if (nextCard) {
        nextCard.style.transform = "scale(0.95) translateY(10px)";
        nextCard.style.opacity = "0.65";
      }
    }
  }

  topCard.addEventListener("pointerup", endDrag);
  topCard.addEventListener("pointercancel", endDrag);
}

btnZurueck.addEventListener("click", () => {
  if (animating || historyStack.length === 0) return;
  idx = historyStack.pop();
  render();
});
btnMischen.addEventListener("click", () => {
  if (animating) return;
  shuffle(deck);
  idx = 0;
  historyStack = [];
  render();
});

addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") fling(-1, buehne.querySelector(".karte.oben"), buehne.querySelector(".karte.unten"));
  else if (e.key === "ArrowRight") fling(1, buehne.querySelector(".karte.oben"), buehne.querySelector(".karte.unten"));
  else if (e.key === "Backspace" || e.key.toLowerCase() === "z") btnZurueck.click();
});

shuffle(deck);
render();
</script>
