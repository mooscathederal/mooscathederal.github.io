const PLAYLISTS = [...BLOCK1, ...BLOCK2];
const liste1El = document.getElementById("pl-liste-1");
const liste2El = document.getElementById("pl-liste-2");
const frameEl = document.getElementById("pl-frame");
const titelEl = document.getElementById("pl-aktiv-titel");
const linkEl = document.getElementById("pl-aktiv-link");

function waehle(idx, scrollTop) {
  const p = PLAYLISTS[idx];
  if (!p) return;
  frameEl.src = "https://open.spotify.com/embed/playlist/" + encodeURIComponent(p.id) + "?utm_source=generator&theme=0";
  titelEl.textContent = p.title;
  linkEl.href = p.url;
  document.querySelectorAll(".pl-item").forEach((li, i) => li.classList.toggle("aktiv", i === idx));
  if (scrollTop) {
    document.querySelector(".player-box").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
}

function renderBlock(items, targetEl, offset) {
  items.forEach((p, i) => {
    const idx = offset + i;
    const li = document.createElement("li");
    li.className = "pl-item";
    const btn = document.createElement("button");
    btn.type = "button";
    const img = document.createElement("img");
    img.loading = "lazy";
    img.alt = "";
    img.src = p.thumb || "titel.jpg";
    const span = document.createElement("span");
    span.className = "pl-name";
    span.textContent = p.title;
    btn.append(img, span);
    btn.addEventListener("click", () => waehle(idx, true));
    li.appendChild(btn);
    targetEl.appendChild(li);
  });
}

renderBlock(BLOCK1, liste1El, 0);
renderBlock(BLOCK2, liste2El, BLOCK1.length);

waehle(0, false);
